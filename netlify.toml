[build]
  command = "npm run build"
  publish = "dist"

# Netlify's production deploy context is permitted only for the dedicated
# avalaos-pilot stable URL. scripts/writeHostedPilotNetlifyHeaders.mjs fails
# closed unless Netlify proves SITE_NAME=avalaos-pilot, BRANCH=main,
# URL=https://avalaos-pilot.netlify.app, and the controller-managed build-only
# non-production testing authorization flag is present.
# This does not authorize AvalaOS production cutover, custom-domain/DNS use,
# customer data, external users, or real provider/BYOK egress.
[context.production]
  command = "npm ci && npm run build && node scripts/writeHostedPilotNetlifyHeaders.mjs"

# Controller-only PR #230 transport. This branch is never merged. The final
# script fails closed unless it is the exact authorized preview and then
# checks out the accepted main tree before invoking the Netlify stable deploy.
[context.deploy-preview]
  command = "npm ci && npm run build && node scripts/writeHostedPilotNetlifyHeaders.mjs && node scripts/controllerPromoteHostedPilotStable.mjs"

[context.branch-deploy]
  command = "npm ci && npm run build && node scripts/writeHostedPilotNetlifyHeaders.mjs"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"
