[build]
  # The permanent build router preserves ordinary branch/preview behavior,
  # admits controlled-human mode only for the exact PR #264 Deploy Preview,
  # and fails closed for production context unless the pre-existing exact
  # avalaos-pilot stable non-production authorization tuple is present.
  # Neither path authorizes AvalaOS.com, custom domains, customer data, real
  # provider keys/calls, or production use.
  command = "node scripts/writeHostedPilotNetlifyHeaders.mjs --build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"
