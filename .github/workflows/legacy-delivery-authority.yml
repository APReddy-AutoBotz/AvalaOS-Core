name: Legacy Delivery Authority

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  ACCEPTANCE_WORKFLOW_PATH: .github/workflows/legacy-delivery-authority.yml
  ACCEPTANCE_EVIDENCE_ENVIRONMENT: ci-disposable-postgres

jobs:
  legacy-delivery-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avalaos_exhaustive
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LEGACY_DELIVERY_ACCEPTANCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_exhaustive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused contracts, client recovery and evidence validation
        run: |
          npm run test:legacy-delivery-authority
          node --test scripts/prCMigrationTailContract.test.mjs
          npm run typecheck
          npm run typecheck:edge
      - name: Real-role PostgreSQL task and import authority
        env:
          RETAINED_TEST_ID_RESULTS: /tmp/legacy-delivery-results.json
          RETAINED_SUITE_COMMAND: node scripts/legacyDeliveryAuthorityPostgres.mjs
        run: |
          node scripts/legacyDeliveryAuthorityPostgres.mjs
          node scripts/verifyLegacyDeliveryAuthorityEvidence.mjs /tmp/legacy-delivery-results.json
      - name: Persisted role, assignment and transition policy
        run: node scripts/legacyDeliveryRolePolicyPostgres.mjs
      - name: Retain sanitized exact-case database evidence
        uses: actions/upload-artifact@v4
        with:
          name: legacy-delivery-${{ env.RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/legacy-delivery-results.json
          if-no-files-found: error
          retention-days: 14
      - run: npx playwright install --with-deps chromium
      - name: Actual Delivery browser journey on desktop and Pixel 7
        run: node scripts/runLegacyDeliveryAuthorityBrowser.mjs
      - name: Retain sanitized connected browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: legacy-delivery-browser-${{ env.RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/acceptance/legacy-delivery/browser-evidence.json
          if-no-files-found: error
          retention-days: 14
