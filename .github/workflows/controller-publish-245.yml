name: Controller publish PR245 hydration correction

on:
  push:
    branches:
      - controller/reload-reconstruction-closure
    paths:
      - .github/workflows/controller-publish-245.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact recovery parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4ec01a297fdd25e613410046c801a6a1e927d9d2"
          test "$(git hash-object App.tsx)" = "f0c1234dc0a0e274927117a5049fb49e52ffd7fc"
          test "$(git hash-object services/falseSuccess.test.ts)" = "bbac8ab234da740ad4955fbdc1df64ccdacac6a7"
      - name: Apply exact approved recovery
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr245.patch <<'PATCH'
          diff --git a/App.tsx b/App.tsx
          index f0c1234dc0a0e274927117a5049fb49e52ffd7fc..a385f372d6689aaf7982dabd6afdbf5c9f0e2799 100644
          --- a/App.tsx
          +++ b/App.tsx
          @@ -1,4 +1,4 @@
          -import React, { useState, useEffect, useMemo, useRef, useCallback } from 'react';
          +import React, { useState, useEffect, useLayoutEffect, useMemo, useRef, useCallback } from 'react';
           import { persistBeforeCommit } from './services/persistenceTransition';
           import Sidebar from './components/shared/Sidebar';
           import Header from './components/shared/Header';
          @@ -520,7 +520,7 @@ function App() {
               setCurrentView,
             ]);
           
          -  useEffect(() => {
          +  useLayoutEffect(() => {
               if (guardLoading || !currentUser || !currentOrganization) return;
               if (!explicitNavigationIntent || navigationHydrated.current) return;
               if (processesLoading) return;
          diff --git a/services/falseSuccess.test.ts b/services/falseSuccess.test.ts
          index bbac8ab234da740ad4955fbdc1df64ccdacac6a7..6b37e2a1b7e6b6c5453fab32b05949f562c12593 100644
          --- a/services/falseSuccess.test.ts
          +++ b/services/falseSuccess.test.ts
          @@ -22,6 +22,11 @@ assert.match(
             /if \(explicitNavigationIntent && !navigationHydrated\.current\) return;\s*if \(navigationWriteSuppressed\.current\) return;[\s\S]*resolvePersistedViewScopeState/,
             'persisted view/scope normalization must not race explicit URL hydration or its commit',
           );
          +assert.match(
          +  appSource,
          +  /useLayoutEffect\(\(\) => \{\s*if \(guardLoading \|\| !currentUser \|\| !currentOrganization\) return;\s*if \(!explicitNavigationIntent \|\| navigationHydrated\.current\) return;\s*if \(processesLoading\) return;/,
          +  'explicit URL hydration must commit in the layout phase before passive reconciliation can observe a stale render',
          +);
           
           const providerSource = readFileSync('components/docs/DocsProvider.tsx', 'utf8');
           assert.match(providerSource, /Promise<DocumentGeneration>/);
          PATCH
          sed -i 's/^          //' /tmp/pr245.patch
          git apply --check /tmp/pr245.patch
          git apply /tmp/pr245.patch
          test "$(git hash-object App.tsx)" = "a385f372d6689aaf7982dabd6afdbf5c9f0e2799"
          test "$(git hash-object services/falseSuccess.test.ts)" = "6b37e2a1b7e6b6c5453fab32b05949f562c12593"
          printf '%s  App.tsx\n' '67a30171a58c3fb9f0742b0aed3009230bc0085cf7e881aa8ee24e92c1ead2c2' | sha256sum -c -
          printf '%s  services/falseSuccess.test.ts\n' '2856f0f16f4aef3b10bbcc80080b9cf00f6aaa5f3478f2c49ceef9b7106ca736' | sha256sum -c -
      - name: Publish exact correction and remove controller scaffold
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/controller-publish-245.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.tsx services/falseSuccess.test.ts
          git diff --cached --check
          git commit -m 'fix(navigation): hydrate routes before passive reconciliation'
          git push origin HEAD:controller/reload-reconstruction-closure
