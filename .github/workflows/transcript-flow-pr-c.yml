name: Governed Delivery and Monitor PR C

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: transcript-flow-pr-c-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && 'controlled-human' || 'ci' }}
  cancel-in-progress: false

jobs:
  exact-head-governed-evidence:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PR_C_BASE_SHA: 5433cad41721355e3ec5a29bc2f87772540c77b5
      PR_C_EXECUTION_CLASSIFICATION: github_candidate
      PR_C_EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_C_RUN_ATTEMPT: ${{ github.run_attempt }}
      PR_C_WORKFLOW_PATH: .github/workflows/transcript-flow-pr-c.yml
      PR_C_WORKFLOW_RUN_ID: ${{ github.run_id }}
      TRANSCRIPT_FLOW_PR_C_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TRANSCRIPT_FLOW_PR_B_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TRANSCRIPT_FLOW_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      ENTERPRISE_INTELLIGENCE_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      STUDIO_ARTIFACT_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      STUDIO_PRIVATE_ARTIFACT_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PILOT_OPERATIONS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PR1D_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PR1E_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PR_C_CONTROLLED_HUMAN_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checked-out head and accepted base
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$PR_C_EXACT_HEAD_SHA"
          test "$(git merge-base "$PR_C_BASE_SHA" HEAD)" = "$PR_C_BASE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify PR C registry, fixtures, owners, lineage, and adversarial evidence contract
        run: npm run test:transcript-flow:delivery-monitor-evidence-contract
      - name: Execute the exact governed Delivery/Monitor PR C and retained-platform command registry
        run: node scripts/runTranscriptFlowPrCEvidence.mjs
      - name: Independently verify per-assertion exact-head PR C evidence
        run: npm run test:transcript-flow:delivery-monitor-evidence
      - name: Upload sanitized exact-head governed Delivery/Monitor PR C evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: governed-delivery-monitor-pr-c-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/process-lifecycle-pr-c/
          if-no-files-found: error
          retention-days: 14

  controlled_human_authority:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        (github.event.label.name == 'pr264-controlled-human-credentials-preflight' ||
         github.event.label.name == 'pr264-controlled-human-edge' ||
         github.event.label.name == 'pr264-controlled-human-prepare' ||
         github.event.label.name == 'pr264-controlled-human-quiesce' ||
         github.event.label.name == 'pr264-controlled-human-checkpoints' ||
         github.event.label.name == 'pr264-controlled-human-final' ||
         github.event.label.name == 'pr264-controlled-human-abort' ||
         github.event.label.name == 'pr264-controlled-human-expiry')
      }}
    environment: hosted-nonproduction-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      phase: ${{ steps.authority.outputs.phase }}
      exact-head-sha: ${{ steps.authority.outputs.exact-head-sha }}
      trusted-execution-sha: ${{ steps.authority.outputs.trusted-execution-sha }}
      exercise-digest: ${{ steps.authority.outputs.exercise-digest }}
      target-fingerprint: ${{ steps.authority.outputs.target-fingerprint }}
      public-target-digest: ${{ steps.authority.outputs.public-target-digest }}
      netlify-deploy-id: ${{ steps.authority.outputs.netlify-deploy-id }}
      ci-run-id: ${{ steps.authority.outputs.ci-run-id }}
      ci-run-attempt: ${{ steps.authority.outputs.ci-run-attempt }}
      ci-artifact-name: ${{ steps.authority.outputs.ci-artifact-name }}
      ci-artifact-digest: ${{ steps.authority.outputs.ci-artifact-digest }}
      edge-run-id: ${{ steps.authority.outputs.edge-run-id }}
      edge-run-attempt: ${{ steps.authority.outputs.edge-run-attempt }}
      edge-artifact-digest: ${{ steps.authority.outputs.edge-artifact-digest }}
      preparation-run-id: ${{ steps.authority.outputs.preparation-run-id }}
      preparation-run-attempt: ${{ steps.authority.outputs.preparation-run-attempt }}
      quiesce-run-id: ${{ steps.authority.outputs.quiesce-run-id }}
      quiesce-run-attempt: ${{ steps.authority.outputs.quiesce-run-attempt }}
      requester-comment-id: ${{ steps.authority.outputs.requester-comment-id }}
      reviewer-comment-id: ${{ steps.authority.outputs.reviewer-comment-id }}
      approver-comment-id: ${{ steps.authority.outputs.approver-comment-id }}
      requester-run-id: ${{ steps.authority.outputs.requester-run-id }}
      requester-run-attempt: ${{ steps.authority.outputs.requester-run-attempt }}
      reviewer-run-id: ${{ steps.authority.outputs.reviewer-run-id }}
      reviewer-run-attempt: ${{ steps.authority.outputs.reviewer-run-attempt }}
      approver-run-id: ${{ steps.authority.outputs.approver-run-id }}
      approver-run-attempt: ${{ steps.authority.outputs.approver-run-attempt }}
      defect-history-json: ${{ steps.authority.outputs.defect-history-json }}
    steps:
      - name: Discover only prior terminal exact-head evidence and the exact PR preview
        id: authority
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          EXPECTED_EXERCISE_DIGEST: ${{ vars.PR_C_CONTROLLED_HUMAN_EXERCISE_DIGEST }}
          EXPECTED_TARGET_FINGERPRINT: ${{ vars.PR_C_CONTROLLED_HUMAN_TARGET_FINGERPRINT }}
          EXPECTED_PUBLIC_TARGET_DIGEST: ${{ vars.PR_C_CONTROLLED_HUMAN_PUBLIC_TARGET_DIGEST }}
          DEFECT_HISTORY_JSON: ${{ vars.PR_C_CONTROLLED_HUMAN_DEFECT_HISTORY_JSON }}
          RECOVERY_HEAD_SHA: ${{ vars.PR_C_CONTROLLED_HUMAN_RECOVERY_HEAD_SHA }}
          RECOVERY_DEPLOY_ID: ${{ vars.PR_C_CONTROLLED_HUMAN_RECOVERY_DEPLOY_ID }}
          RECOVERY_EXERCISE_DIGEST: ${{ vars.PR_C_CONTROLLED_HUMAN_RECOVERY_EXERCISE_DIGEST }}
          RECOVERY_TARGET_FINGERPRINT: ${{ vars.PR_C_CONTROLLED_HUMAN_RECOVERY_TARGET_FINGERPRINT }}
          RECOVERY_PUBLIC_TARGET_DIGEST: ${{ vars.PR_C_CONTROLLED_HUMAN_RECOVERY_PUBLIC_TARGET_DIGEST }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const reject = message => { throw new Error(`PR264_CONTROLLED_HUMAN_AUTHORITY_REJECTED:${message}`); };
            const expectedBranch = 'controller/governed-delivery-monitor-pr-c-20260831';
            const expectedWorkflow = '.github/workflows/transcript-flow-pr-c.yml';
            const expectedOrigin = 'https://deploy-preview-264--avalaos-pilot.netlify.app';
            const phases = new Map([
              ['pr264-controlled-human-credentials-preflight', 'credentials-preflight'],
              ['pr264-controlled-human-edge', 'edge'],
              ['pr264-controlled-human-prepare', 'prepare'],
              ['pr264-controlled-human-quiesce', 'quiesce'],
              ['pr264-controlled-human-checkpoints', 'checkpoints'],
              ['pr264-controlled-human-final', 'final'],
              ['pr264-controlled-human-abort', 'abort'],
              ['pr264-controlled-human-expiry', 'expiry'],
            ]);
            const phase = phases.get(context.payload.label?.name);
            const trusted = value => String(value || '').toLowerCase() === 'apreddy-autobotz';
            if (!phase || context.payload.action !== 'labeled' || context.payload.pull_request?.number !== 264) reject('event');
            if (!trusted(context.actor) || !trusted(process.env.TRIGGERING_ACTOR) || !trusted(context.payload.sender?.login)) reject('actor');
            const exactHead = context.payload.pull_request?.head?.sha;
            if (!/^[0-9a-f]{40}$/.test(exactHead || '') || context.payload.pull_request?.head?.ref !== expectedBranch) reject('event-head');
            if (context.payload.pull_request?.head?.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` || context.payload.pull_request?.base?.ref !== 'main') reject('repository');
            const { data: pull } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: 264 });
            if (pull.state !== 'open' || pull.head.sha !== exactHead || pull.head.ref !== expectedBranch || pull.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` || pull.base.ref !== 'main') reject('live-pr');

            if (phase === 'abort' || phase === 'expiry') {
              const recoveryHead = process.env.RECOVERY_HEAD_SHA || '';
              const recoveryDeploy = process.env.RECOVERY_DEPLOY_ID || '';
              const recoveryExercise = process.env.RECOVERY_EXERCISE_DIGEST || '';
              const recoveryTarget = process.env.RECOVERY_TARGET_FINGERPRINT || '';
              const recoveryPublicTarget = process.env.RECOVERY_PUBLIC_TARGET_DIGEST || '';
              if (!/^[0-9a-f]{40}$/.test(recoveryHead)) reject('recovery-head');
              if (!/^[0-9a-f]{24}$/.test(recoveryDeploy)) reject('recovery-deploy');
              if (!/^sha256:[0-9a-f]{64}$/.test(recoveryExercise) || !/^sha256:[0-9a-f]{64}$/.test(recoveryTarget) || !/^sha256:[0-9a-f]{64}$/.test(recoveryPublicTarget)) reject('recovery-binding');
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: 264,
                per_page: 100,
              });
              if (!commits.some(commit => commit.sha === recoveryHead)) reject('recovery-head-history');
              core.setOutput('phase', phase);
              core.setOutput('exact-head-sha', recoveryHead);
              core.setOutput('trusted-execution-sha', exactHead);
              core.setOutput('exercise-digest', recoveryExercise);
              core.setOutput('target-fingerprint', recoveryTarget);
              core.setOutput('public-target-digest', recoveryPublicTarget);
              core.setOutput('netlify-deploy-id', recoveryDeploy);
              return;
            }

            if (!/^sha256:[0-9a-f]{64}$/.test(process.env.EXPECTED_EXERCISE_DIGEST || '') || !/^sha256:[0-9a-f]{64}$/.test(process.env.EXPECTED_TARGET_FINGERPRINT || '') || !/^sha256:[0-9a-f]{64}$/.test(process.env.EXPECTED_PUBLIC_TARGET_DIGEST || '')) reject('protected-binding');

            let preview;
            try {
              preview = await fetch(expectedOrigin, { redirect: 'error', signal: AbortSignal.timeout(15000) });
            } catch {
              reject('preview-unreachable');
            }
            const deployId = preview.headers.get('x-avalaos-netlify-deploy-id');
            const release = preview.headers.get('x-avalaos-release');
            const environment = preview.headers.get('x-avalaos-environment');
            await preview.body?.cancel();
            if (preview.status !== 200 || !/^[0-9a-f]{24}$/.test(deployId || '') || release !== exactHead || environment !== 'hosted_nonproduction_pilot') reject('preview-identity');

            const runs = (await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'transcript-flow-pr-c.yml',
              event: 'pull_request',
              branch: expectedBranch,
              status: 'completed',
              per_page: 100,
            })).filter(run => run.id !== context.runId
              && String(run.path || '').split('@', 1)[0] === expectedWorkflow
              && run.head_sha === exactHead
              && run.head_branch === expectedBranch
              && run.event === 'pull_request'
              && run.status === 'completed'
              && run.conclusion === 'success')
              .sort((left, right) => Number(right.id) - Number(left.id));
            if (runs.length === 0) reject('no-prior-successful-run');

            const artifactsFor = async run => github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const findArtifact = async (kind, buildName) => {
              for (const run of runs) {
                const name = buildName(run);
                const matches = (await artifactsFor(run)).filter(artifact => artifact.name === name && !artifact.expired);
                if (matches.length > 1) reject(`${kind}-artifact-ambiguous`);
                if (matches.length === 1) {
                  const artifact = matches[0];
                  if (!/^sha256:[0-9a-f]{64}$/.test(artifact.digest || '')) reject(`${kind}-artifact-digest`);
                  return { run, artifact };
                }
              }
              reject(`${kind}-artifact-missing`);
            };
            const setRun = (prefix, found) => {
              core.setOutput(`${prefix}-run-id`, String(found.run.id));
              core.setOutput(`${prefix}-run-attempt`, String(found.run.run_attempt));
            };

            core.setOutput('phase', phase);
            core.setOutput('exact-head-sha', exactHead);
            core.setOutput('exercise-digest', process.env.EXPECTED_EXERCISE_DIGEST);
            core.setOutput('target-fingerprint', process.env.EXPECTED_TARGET_FINGERPRINT);
            core.setOutput('public-target-digest', process.env.EXPECTED_PUBLIC_TARGET_DIGEST);
            core.setOutput('netlify-deploy-id', deployId);

            if (phase === 'credentials-preflight' || phase === 'edge' || phase === 'prepare') {
              const ci = await findArtifact('ci', run => `governed-delivery-monitor-pr-c-${run.id}-${run.run_attempt}`);
              setRun('ci', ci);
              core.setOutput('ci-artifact-name', ci.artifact.name);
              core.setOutput('ci-artifact-digest', ci.artifact.digest);
            }
            if (phase === 'prepare') {
              const edge = await findArtifact('edge', run => `pr264-controlled-human-edge-deployment-${exactHead}-${run.id}-${run.run_attempt}`);
              setRun('edge', edge);
              core.setOutput('edge-artifact-digest', edge.artifact.digest);
            }
            if (phase === 'quiesce' || phase === 'checkpoints' || phase === 'final') {
              const preparation = await findArtifact('preparation', run => `pr264-controlled-human-preparation-${exactHead}-${run.id}-${run.run_attempt}`);
              setRun('preparation', preparation);
            }
            if (phase === 'checkpoints' || phase === 'final') {
              const quiesce = await findArtifact('quiesce', run => `pr264-controlled-human-quiesce-${exactHead}-${run.id}-${run.run_attempt}`);
              setRun('quiesce', quiesce);
            }
            if (phase === 'checkpoints') {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 264,
                per_page: 100,
              });
              const selected = new Map();
              for (const role of ['requester', 'reviewer', 'approver']) {
                const matches = comments.filter(comment => {
                  if (comment.user?.type !== 'User' || !comment.user.login || comment.created_at !== comment.updated_at) return false;
                  let body;
                  try { body = JSON.parse(comment.body); } catch { return false; }
                  return body.kind === 'pr264-controlled-human-observation'
                    && body.humanRole === role
                    && body.exactHead === exactHead
                    && body.exerciseDigest === process.env.EXPECTED_EXERCISE_DIGEST;
                });
                if (matches.length !== 1) reject(`${role}-comment-count`);
                selected.set(role, matches[0]);
                core.setOutput(`${role}-comment-id`, String(matches[0].id));
              }
              if (new Set([...selected.values()].map(comment => comment.user.login.toLowerCase())).size !== 3) reject('distinct-human-comments');
            }
            if (phase === 'final') {
              for (const role of ['requester', 'reviewer', 'approver']) {
                const found = await findArtifact(role, run => `pr264-controlled-human-${role}-${run.id}-${run.run_attempt}`);
                setRun(role, found);
              }
              let defectHistory;
              try { defectHistory = JSON.parse(process.env.DEFECT_HISTORY_JSON || '[]'); } catch { reject('defect-history-json'); }
              if (!Array.isArray(defectHistory) || defectHistory.length > 20) reject('defect-history-shape');
              core.setOutput('defect-history-json', JSON.stringify(defectHistory));
            }

  controlled_human_credentials_preflight:
    needs: controlled_human_authority
    if: ${{ needs.controlled_human_authority.outputs.phase == 'credentials-preflight' }}
    environment: hosted-nonproduction-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_C_CONTROLLED_HUMAN_ENVIRONMENT_CLASS: hosted_nonproduction_pilot
      PR_C_CONTROLLED_HUMAN_PR_NUMBER: 264
      PR_C_CONTROLLED_HUMAN_RELEASE_SHA: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
      PR_C_CONTROLLED_HUMAN_REVIEW_HEAD_SHA: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
      PR_C_CONTROLLED_HUMAN_DEPLOY_ID: ${{ needs.controlled_human_authority.outputs.netlify-deploy-id }}
      PR_C_CONTROLLED_HUMAN_DEPLOY_ORIGIN: https://deploy-preview-264--avalaos-pilot.netlify.app
      PR_C_CONTROLLED_HUMAN_EXERCISE_DIGEST: ${{ needs.controlled_human_authority.outputs.exercise-digest }}
      PR_C_CONTROLLED_HUMAN_TARGET_FINGERPRINT: ${{ needs.controlled_human_authority.outputs.target-fingerprint }}
      PR_C_CONTROLLED_HUMAN_EXPECTED_PUBLIC_TARGET_DIGEST: ${{ needs.controlled_human_authority.outputs.public-target-digest }}
      PR_C_CONTROLLED_HUMAN_CI_RUN_ID: ${{ needs.controlled_human_authority.outputs.ci-run-id }}
      PR_C_CONTROLLED_HUMAN_CI_RUN_ATTEMPT: ${{ needs.controlled_human_authority.outputs.ci-run-attempt }}
      PR_C_CONTROLLED_HUMAN_CI_ARTIFACT_NAME: ${{ needs.controlled_human_authority.outputs.ci-artifact-name }}
      PR_C_CONTROLLED_HUMAN_CI_ARTIFACT_DIGEST: ${{ needs.controlled_human_authority.outputs.ci-artifact-digest }}
      PR_C_CONTROLLED_HUMAN_PREFLIGHT_OUTPUT: output/pr-c-controlled-human-credential-preflight
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact checkout and accepted base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_C_CONTROLLED_HUMAN_RELEASE_SHA"
          test "$(git merge-base 5433cad41721355e3ec5a29bc2f87772540c77b5 HEAD)" = 5433cad41721355e3ec5a29bc2f87772540c77b5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies before protected values
        run: npm ci
      - name: Require exact protected credential preflight secrets
        env:
          PR_C_CONTROLLED_HUMAN_DATABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_DATABASE_URL }}
          PR_C_CONTROLLED_HUMAN_EVIDENCE_HMAC_KEY: ${{ secrets.PR_C_CONTROLLED_HUMAN_EVIDENCE_HMAC_KEY }}
          PR_C_CONTROLLED_HUMAN_EXERCISE_ID: ${{ secrets.PR_C_CONTROLLED_HUMAN_EXERCISE_ID }}
          PR_C_CONTROLLED_HUMAN_PASSWORD_BUNDLE_JSON: ${{ secrets.PR_C_CONTROLLED_HUMAN_PASSWORD_BUNDLE_JSON }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_PROJECT_REF: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_PROJECT_REF }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_SERVICE_ROLE_KEY }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_URL }}
        run: node scripts/prCControlledHumanWorkflowSecrets.mjs preflight
      - name: Verify pinned Supabase CA without consuming credentials
        run: node scripts/prCControlledHumanPostgresTls.mjs verify-ca
      - name: Verify protected credential transport with bounded read-only checks
        env:
          PR_C_CONTROLLED_HUMAN_DATABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_DATABASE_URL }}
          PR_C_CONTROLLED_HUMAN_EVIDENCE_HMAC_KEY: ${{ secrets.PR_C_CONTROLLED_HUMAN_EVIDENCE_HMAC_KEY }}
          PR_C_CONTROLLED_HUMAN_EXERCISE_ID: ${{ secrets.PR_C_CONTROLLED_HUMAN_EXERCISE_ID }}
          PR_C_CONTROLLED_HUMAN_PASSWORD_BUNDLE_JSON: ${{ secrets.PR_C_CONTROLLED_HUMAN_PASSWORD_BUNDLE_JSON }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_PROJECT_REF: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_PROJECT_REF }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_SERVICE_ROLE_KEY }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_URL }}
        run: node scripts/prCControlledHumanCredentialPreflight.mjs
      - name: Upload sanitized credential transport report
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr264-controlled-human-credential-preflight-${{ needs.controlled_human_authority.outputs.exact-head-sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/pr-c-controlled-human-credential-preflight/credential-preflight.json
          if-no-files-found: error
          retention-days: 14

  controlled_human_edge:
    needs: controlled_human_authority
    if: ${{ needs.controlled_human_authority.outputs.phase == 'edge' }}
    environment: hosted-nonproduction-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_C_CONTROLLED_HUMAN_ENVIRONMENT_CLASS: hosted_nonproduction_pilot
      PR_C_CONTROLLED_HUMAN_PR_NUMBER: 264
      PR_C_CONTROLLED_HUMAN_RELEASE_SHA: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
      PR_C_CONTROLLED_HUMAN_REVIEW_HEAD_SHA: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
      PR_C_CONTROLLED_HUMAN_DEPLOY_ID: ${{ needs.controlled_human_authority.outputs.netlify-deploy-id }}
      PR_C_CONTROLLED_HUMAN_DEPLOY_ORIGIN: https://deploy-preview-264--avalaos-pilot.netlify.app
      PR_C_CONTROLLED_HUMAN_EXERCISE_DIGEST: ${{ needs.controlled_human_authority.outputs.exercise-digest }}
      PR_C_CONTROLLED_HUMAN_EXPECTED_EXERCISE_DIGEST: ${{ needs.controlled_human_authority.outputs.exercise-digest }}
      PR_C_CONTROLLED_HUMAN_TARGET_FINGERPRINT: ${{ needs.controlled_human_authority.outputs.target-fingerprint }}
      PR_C_CONTROLLED_HUMAN_EXPECTED_PUBLIC_TARGET_DIGEST: ${{ needs.controlled_human_authority.outputs.public-target-digest }}
      PR_C_CONTROLLED_HUMAN_SITE_NAME: avalaos-pilot
      PR_C_CONTROLLED_HUMAN_NETLIFY_CONTEXT: deploy-preview
      PR_C_CONTROLLED_HUMAN_EDGE_WORKFLOW_PATH: .github/workflows/transcript-flow-pr-c.yml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact checkout and accepted base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_C_CONTROLLED_HUMAN_RELEASE_SHA"
          test "$(git merge-base 5433cad41721355e3ec5a29bc2f87772540c77b5 HEAD)" = 5433cad41721355e3ec5a29bc2f87772540c77b5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies before protected values
        run: npm ci

      - name: Require exact protected Edge phase secrets
        env:
          PR_C_CONTROLLED_HUMAN_DATABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_DATABASE_URL }}
          PR_C_CONTROLLED_HUMAN_EVIDENCE_HMAC_KEY: ${{ secrets.PR_C_CONTROLLED_HUMAN_EVIDENCE_HMAC_KEY }}
          PR_C_CONTROLLED_HUMAN_EXERCISE_ID: ${{ secrets.PR_C_CONTROLLED_HUMAN_EXERCISE_ID }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_ACCESS_TOKEN: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_ACCESS_TOKEN }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_PROJECT_REF: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_PROJECT_REF }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_URL }}
        run: node scripts/prCControlledHumanWorkflowSecrets.mjs edge

      - name: Verify terminal exact-head PR C CI and immutable artifact
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          EXPECTED_HEAD: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
          EXPECTED_RUN_ID: ${{ needs.controlled_human_authority.outputs.ci-run-id }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.controlled_human_authority.outputs.ci-run-attempt }}
          EXPECTED_ARTIFACT_NAME: ${{ needs.controlled_human_authority.outputs.ci-artifact-name }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.controlled_human_authority.outputs.ci-artifact-digest }}
        with:
          script: |
            const fail = message => core.setFailed(`PR 264 Edge authority rejected: ${message}`);
            if (!/^[0-9a-f]{40}$/.test(process.env.EXPECTED_HEAD) || !/^[1-9][0-9]{0,19}$/.test(process.env.EXPECTED_RUN_ID) || !/^[1-9][0-9]*$/.test(process.env.EXPECTED_RUN_ATTEMPT) || !/^sha256:[0-9a-f]{64}$/.test(process.env.EXPECTED_ARTIFACT_DIGEST)) return fail('invalid binding');
            const { data: pull } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: 264 });
            if (pull.head.sha !== process.env.EXPECTED_HEAD || pull.head.ref !== 'controller/governed-delivery-monitor-pr-c-20260831') return fail('PR head mismatch');
            const runId = Number(process.env.EXPECTED_RUN_ID);
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner: context.repo.owner, repo: context.repo.repo, run_id: runId });
            if (!Number.isSafeInteger(runId) || String(run.path || '').split('@',1)[0] !== '.github/workflows/transcript-flow-pr-c.yml' || run.head_sha !== process.env.EXPECTED_HEAD || run.event !== 'pull_request' || run.status !== 'completed' || run.conclusion !== 'success' || String(run.run_attempt) !== process.env.EXPECTED_RUN_ATTEMPT) return fail('CI run mismatch');
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ owner: context.repo.owner, repo: context.repo.repo, run_id: runId, per_page: 100 });
            const artifact = data.artifacts.find(item => item.name === process.env.EXPECTED_ARTIFACT_NAME);
            if (!artifact || artifact.expired || artifact.digest !== process.env.EXPECTED_ARTIFACT_DIGEST) return fail('CI artifact mismatch');

      - name: Verify exact PR-only Deploy Preview before deployment
        run: node scripts/verifyPr264ControlledHumanPreview.mjs

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.101.0

      - name: Bind Supabase project, API and database without disclosure
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_PROJECT_REF }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_URL }}
          PR_C_CONTROLLED_HUMAN_DATABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_DATABASE_URL }}
        run: node --input-type=module -e "import {validateSupabaseTargetTuple} from './scripts/prCControlledHumanEnvironment.mjs'; validateSupabaseTargetTuple(process.env.SUPABASE_PROJECT_REF,process.env.PR_C_CONTROLLED_HUMAN_SUPABASE_URL,process.env.PR_C_CONTROLLED_HUMAN_DATABASE_URL)"

      - name: Capture provider deployment baseline
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_ACCESS_TOKEN }}
        run: node scripts/producePrCControlledHumanEdgeDeploymentManifest.mjs --provider-baseline output/controlled-human/provider-baseline.json

      - name: Derive exact controlled-human migration digest
        run: node --input-type=module -e "import {appendFileSync,readFileSync} from 'node:fs'; import {createHash} from 'node:crypto'; appendFileSync(process.env.GITHUB_ENV,'PR_C_CONTROLLED_HUMAN_MIGRATION_DIGEST=sha256:'+createHash('sha256').update(readFileSync('supabase/migrations/20260904120000_pr_c_controlled_human_exercise_authority.sql')).digest('hex')+'\n')"

      - name: Verify pinned Supabase CA for controlled migration
        run: node scripts/prCControlledHumanPostgresTls.mjs verify-ca

      - name: Apply and verify exact additive migration on the dedicated database
        env:
          PR_C_CONTROLLED_HUMAN_DATABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_DATABASE_URL }}
          PR_C_CONTROLLED_HUMAN_EXERCISE_ID: ${{ secrets.PR_C_CONTROLLED_HUMAN_EXERCISE_ID }}
        run: |
          npm run pr-c-controlled-human:migration-preflight -- --output output/controlled-human/migration-preflight.json
          npm run pr-c-controlled-human:migration-apply -- --output output/controlled-human/migration-apply.json
          npm run pr-c-controlled-human:migration-verify -- --output output/controlled-human/migration-verify.json
          npm run pr-c-controlled-human:preflight -- --output output/controlled-human/edge-preflight.json

      - name: Deploy only the allowlisted functions
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for function_name in assess-command assess-v2-command enterprise-intelligence-command enterprise-intelligence-query studio-artifact-command studio-private-artifact-command tenant-context tenant-session pr-c-controlled-human-synthetic-generation; do
            log_file="$RUNNER_TEMP/pr264-edge-${function_name}.log"
            if ! supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_REF" >"$log_file" 2>&1; then
              node --input-type=module -e "import {rmSync} from 'node:fs'; rmSync(process.argv[1],{force:true})" "$log_file"
              echo "::error::PR_C_CONTROLLED_HUMAN_EDGE_DEPLOYMENT_FAILED:${function_name}"
              exit 1
            fi
            node --input-type=module -e "import {rmSync} from 'node:fs'; rmSync(process.argv[1],{force:true})" "$log_file"
          done

      - name: Produce provider-attested deployment and runtime manifest
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_ACCESS_TOKEN }}
          PR_C_CONTROLLED_HUMAN_EVIDENCE_HMAC_KEY: ${{ secrets.PR_C_CONTROLLED_HUMAN_EVIDENCE_HMAC_KEY }}
        run: node scripts/producePrCControlledHumanEdgeDeploymentManifest.mjs --migration-preflight output/controlled-human/migration-preflight.json --migration-apply output/controlled-human/migration-apply.json --migration-verify output/controlled-human/migration-verify.json --preflight output/controlled-human/edge-preflight.json --provider-baseline output/controlled-human/provider-baseline.json --output output/controlled-human/edge-deployment.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr264-controlled-human-edge-deployment-${{ needs.controlled_human_authority.outputs.exact-head-sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/controlled-human/edge-deployment.json
            output/controlled-human/provider-baseline.json
          if-no-files-found: error
          retention-days: 14

  controlled_human_prepare:
    needs: controlled_human_authority
    if: ${{ needs.controlled_human_authority.outputs.phase == 'prepare' }}
    environment: hosted-nonproduction-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR_C_CONTROLLED_HUMAN_ENVIRONMENT_CLASS: hosted_nonproduction_pilot
      PR_C_CONTROLLED_HUMAN_PR_NUMBER: 264
      PR_C_CONTROLLED_HUMAN_RELEASE_SHA: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
      PR_C_CONTROLLED_HUMAN_REVIEW_HEAD_SHA: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
      PR_C_CONTROLLED_HUMAN_DEPLOY_ID: ${{ needs.controlled_human_authority.outputs.netlify-deploy-id }}
      PR_C_CONTROLLED_HUMAN_DEPLOY_ORIGIN: https://deploy-preview-264--avalaos-pilot.netlify.app
      PR_C_CONTROLLED_HUMAN_TARGET_FINGERPRINT: ${{ needs.controlled_human_authority.outputs.target-fingerprint }}
      PR_C_CONTROLLED_HUMAN_EXPECTED_PUBLIC_TARGET_DIGEST: ${{ needs.controlled_human_authority.outputs.public-target-digest }}
      PR_C_CONTROLLED_HUMAN_EXERCISE_DIGEST: ${{ needs.controlled_human_authority.outputs.exercise-digest }}
      PR_C_CONTROLLED_HUMAN_EXPECTED_EXERCISE_DIGEST: ${{ needs.controlled_human_authority.outputs.exercise-digest }}
      PR_C_CONTROLLED_HUMAN_SITE_NAME: avalaos-pilot
      PR_C_CONTROLLED_HUMAN_NETLIFY_CONTEXT: deploy-preview
    steps:
      - name: Checkout exact authorized PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify PR 264 head and terminal exact-head CI artifact
        id: authority
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          EXPECTED_HEAD: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
          EXPECTED_RUN_ID: ${{ needs.controlled_human_authority.outputs.ci-run-id }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.controlled_human_authority.outputs.ci-run-attempt }}
          EXPECTED_ARTIFACT_NAME: ${{ needs.controlled_human_authority.outputs.ci-artifact-name }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.controlled_human_authority.outputs.ci-artifact-digest }}
        with:
          script: |
            const fail = message => core.setFailed(`PR 264 controlled-human authority rejected: ${message}`);
            if (!/^[0-9a-f]{40}$/.test(process.env.EXPECTED_HEAD)) return fail('invalid head');
            if (!/^[1-9][0-9]{0,19}$/.test(process.env.EXPECTED_RUN_ID)) return fail('invalid run ID');
            if (!/^[1-9][0-9]*$/.test(process.env.EXPECTED_RUN_ATTEMPT)) return fail('invalid run attempt');
            if (!/^sha256:[0-9a-f]{64}$/.test(process.env.EXPECTED_ARTIFACT_DIGEST)) return fail('invalid artifact digest');
            const { data: pull } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: 264 });
            if (pull.head.sha !== process.env.EXPECTED_HEAD || pull.head.ref !== 'controller/governed-delivery-monitor-pr-c-20260831') return fail('PR head or branch mismatch');
            const runId = Number(process.env.EXPECTED_RUN_ID);
            if (!Number.isSafeInteger(runId)) return fail('unsafe run ID');
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner: context.repo.owner, repo: context.repo.repo, run_id: runId });
            const workflowPath = String(run.path || '').split('@', 1)[0];
            if (workflowPath !== '.github/workflows/transcript-flow-pr-c.yml' || run.head_sha !== process.env.EXPECTED_HEAD || run.event !== 'pull_request' || run.status !== 'completed' || run.conclusion !== 'success' || String(run.run_attempt) !== process.env.EXPECTED_RUN_ATTEMPT) return fail('CI run identity mismatch');
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({ owner: context.repo.owner, repo: context.repo.repo, run_id: runId, per_page: 100 });
            const artifact = artifacts.artifacts.find(item => item.name === process.env.EXPECTED_ARTIFACT_NAME);
            if (!artifact || artifact.expired || artifact.digest !== process.env.EXPECTED_ARTIFACT_DIGEST) return fail('CI artifact identity mismatch');
            core.setOutput('workflow', workflowPath);
            core.setOutput('run-id', String(run.id));
            core.setOutput('run-attempt', String(run.run_attempt));
            core.setOutput('artifact-name', artifact.name);
            core.setOutput('artifact-digest', artifact.digest);

      - name: Verify trusted exact-head Edge deployment run and artifact
        id: edge-authority
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          EXPECTED_HEAD: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
          EDGE_RUN_ID: ${{ needs.controlled_human_authority.outputs.edge-run-id }}
          EDGE_RUN_ATTEMPT: ${{ needs.controlled_human_authority.outputs.edge-run-attempt }}
          EDGE_ARTIFACT_DIGEST: ${{ needs.controlled_human_authority.outputs.edge-artifact-digest }}
        with:
          script: |
            const fail = message => core.setFailed(`PR 264 Edge evidence rejected: ${message}`);
            if (!/^[1-9][0-9]{0,19}$/.test(process.env.EDGE_RUN_ID) || !/^[1-9][0-9]*$/.test(process.env.EDGE_RUN_ATTEMPT) || !/^sha256:[0-9a-f]{64}$/.test(process.env.EDGE_ARTIFACT_DIGEST)) return fail('invalid run binding');
            const runId = Number(process.env.EDGE_RUN_ID);
            if (!Number.isSafeInteger(runId)) return fail('unsafe run ID');
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner: context.repo.owner, repo: context.repo.repo, run_id: runId });
            const workflowPath = String(run.path || '').split('@', 1)[0];
            if (workflowPath !== '.github/workflows/transcript-flow-pr-c.yml' || run.head_sha !== process.env.EXPECTED_HEAD || run.event !== 'pull_request' || run.status !== 'completed' || run.conclusion !== 'success' || String(run.run_attempt) !== process.env.EDGE_RUN_ATTEMPT) return fail('Edge run identity mismatch');
            const artifactName = `pr264-controlled-human-edge-deployment-${process.env.EXPECTED_HEAD}-${run.id}-${run.run_attempt}`;
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({ owner: context.repo.owner, repo: context.repo.repo, run_id: runId, per_page: 100 });
            const artifact = artifacts.artifacts.find(item => item.name === artifactName);
            if (!artifact || artifact.expired || artifact.digest !== process.env.EDGE_ARTIFACT_DIGEST) return fail('Edge artifact identity mismatch');
            core.setOutput('workflow', '.github/workflows/transcript-flow-pr-c.yml');
            core.setOutput('run-id', String(run.id));
            core.setOutput('run-attempt', String(run.run_attempt));
            core.setOutput('artifact-name', artifact.name);
            core.setOutput('artifact-digest', artifact.digest);

      - name: Fail closed unless checkout is exact
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_C_CONTROLLED_HUMAN_RELEASE_SHA"
          test "$(git merge-base 5433cad41721355e3ec5a29bc2f87772540c77b5 HEAD)" = 5433cad41721355e3ec5a29bc2f87772540c77b5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Require exact protected preparation phase secrets
        env:
          PR_C_CONTROLLED_HUMAN_DATABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_DATABASE_URL }}
          PR_C_CONTROLLED_HUMAN_EVIDENCE_HMAC_KEY: ${{ secrets.PR_C_CONTROLLED_HUMAN_EVIDENCE_HMAC_KEY }}
          PR_C_CONTROLLED_HUMAN_EXERCISE_ID: ${{ secrets.PR_C_CONTROLLED_HUMAN_EXERCISE_ID }}
          PR_C_CONTROLLED_HUMAN_PASSWORD_BUNDLE_JSON: ${{ secrets.PR_C_CONTROLLED_HUMAN_PASSWORD_BUNDLE_JSON }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_PROJECT_REF: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_PROJECT_REF }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_SERVICE_ROLE_KEY }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_URL }}
        run: node scripts/prCControlledHumanWorkflowSecrets.mjs prepare

      - name: Verify controlled-human evidence and workflow contracts
        run: node --test scripts/prCControlledHumanEvidenceContract.test.mjs scripts/prCControlledHumanWorkflowContract.test.mjs

      - name: Verify exact PR-only Deploy Preview before backend access
        run: node scripts/verifyPr264ControlledHumanPreview.mjs

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.edge-authority.outputs.artifact-name }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.controlled_human_authority.outputs.edge-run-id }}
          path: output/controlled-human/edge-input

      - name: Verify signed exact deployed Edge source manifest before backend access
        env:
          PR_C_CONTROLLED_HUMAN_EDGE_WORKFLOW: ${{ steps.edge-authority.outputs.workflow }}
          PR_C_CONTROLLED_HUMAN_EDGE_RUN_ID: ${{ steps.edge-authority.outputs.run-id }}
          PR_C_CONTROLLED_HUMAN_EDGE_RUN_ATTEMPT: ${{ steps.edge-authority.outputs.run-attempt }}
          PR_C_CONTROLLED_HUMAN_EDGE_ARTIFACT_NAME: ${{ steps.edge-authority.outputs.artifact-name }}
          PR_C_CONTROLLED_HUMAN_EVIDENCE_HMAC_KEY: ${{ secrets.PR_C_CONTROLLED_HUMAN_EVIDENCE_HMAC_KEY }}
        run: node scripts/verifyPrCControlledHumanEdgeDeployment.mjs --input output/controlled-human/edge-input/edge-deployment.json --output output/controlled-human/edge-deployment.json

      - name: Bind Supabase Admin API and database to the exact deployed project
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_PROJECT_REF }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_URL }}
          PR_C_CONTROLLED_HUMAN_DATABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_DATABASE_URL }}
        run: node --input-type=module -e "import {validateSupabaseTargetTuple} from './scripts/prCControlledHumanEnvironment.mjs'; validateSupabaseTargetTuple(process.env.SUPABASE_PROJECT_REF,process.env.PR_C_CONTROLLED_HUMAN_SUPABASE_URL,process.env.PR_C_CONTROLLED_HUMAN_DATABASE_URL)"

      - name: Authenticate service-role authority against the exact Supabase API without retaining response data
        env:
          PR_C_CONTROLLED_HUMAN_SUPABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_URL }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_SERVICE_ROLE_KEY }}
        run: node --input-type=module -e "try { const base=new URL(process.env.PR_C_CONTROLLED_HUMAN_SUPABASE_URL); if(base.pathname!=='/'||base.search||base.hash||!base.hostname.endsWith('.supabase.co')) throw new Error(); const response=await fetch(new URL('/auth/v1/admin/users?page=1&per_page=1',base),{redirect:'error',headers:{apikey:process.env.PR_C_CONTROLLED_HUMAN_SUPABASE_SERVICE_ROLE_KEY,Authorization:'Bearer '+process.env.PR_C_CONTROLLED_HUMAN_SUPABASE_SERVICE_ROLE_KEY},signal:AbortSignal.timeout(15000)}); await response.body?.cancel(); if(!response.ok) throw new Error(); } catch { throw new Error('PR_C_CONTROLLED_HUMAN_SUPABASE_ADMIN_AUTHORITY_REJECTED'); }"

      - name: Verify pinned Supabase CA for target preflight
        run: node scripts/prCControlledHumanPostgresTls.mjs verify-ca

      - name: Preflight dedicated synthetic target
        env:
          PR_C_CONTROLLED_HUMAN_DATABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_DATABASE_URL }}
          PR_C_CONTROLLED_HUMAN_EXERCISE_ID: ${{ secrets.PR_C_CONTROLLED_HUMAN_EXERCISE_ID }}
        run: npm run pr-c-controlled-human:preflight -- --output output/controlled-human/preflight.json

      - name: Produce bounded seed plan
        env:
          PR_C_CONTROLLED_HUMAN_EXERCISE_ID: ${{ secrets.PR_C_CONTROLLED_HUMAN_EXERCISE_ID }}
        run: npm run pr-c-controlled-human:plan -- --output output/controlled-human/plan.json

      - name: Verify pinned Supabase CA for seed apply
        run: node scripts/prCControlledHumanPostgresTls.mjs verify-ca

      - name: Apply bounded synthetic seed
        id: apply
        env:
          PR_C_CONTROLLED_HUMAN_DATABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_DATABASE_URL }}
          PR_C_CONTROLLED_HUMAN_EXERCISE_ID: ${{ secrets.PR_C_CONTROLLED_HUMAN_EXERCISE_ID }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_URL }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_SERVICE_ROLE_KEY }}
          PR_C_CONTROLLED_HUMAN_PASSWORD_BUNDLE_JSON: ${{ secrets.PR_C_CONTROLLED_HUMAN_PASSWORD_BUNDLE_JSON }}
        run: npm run pr-c-controlled-human:apply -- --output output/controlled-human/apply.json

      - name: Verify pinned Supabase CA for seed verification
        run: node scripts/prCControlledHumanPostgresTls.mjs verify-ca

      - name: Verify exact seed and zero-egress boundary
        env:
          PR_C_CONTROLLED_HUMAN_DATABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_DATABASE_URL }}
          PR_C_CONTROLLED_HUMAN_EXERCISE_ID: ${{ secrets.PR_C_CONTROLLED_HUMAN_EXERCISE_ID }}
        run: npm run pr-c-controlled-human:verify -- --output output/controlled-human/verify.json

      - name: Record preparation timestamp
        id: timestamp
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build immutable preparation binding
        env:
          PR_C_CONTROLLED_HUMAN_CI_WORKFLOW: ${{ steps.authority.outputs.workflow }}
          PR_C_CONTROLLED_HUMAN_CI_RUN_ID: ${{ steps.authority.outputs.run-id }}
          PR_C_CONTROLLED_HUMAN_CI_RUN_ATTEMPT: ${{ steps.authority.outputs.run-attempt }}
          PR_C_CONTROLLED_HUMAN_CI_CONCLUSION: success
          PR_C_CONTROLLED_HUMAN_CI_ARTIFACT_NAME: ${{ steps.authority.outputs.artifact-name }}
          PR_C_CONTROLLED_HUMAN_CI_ARTIFACT_DIGEST: ${{ steps.authority.outputs.artifact-digest }}
          PR_C_CONTROLLED_HUMAN_EDGE_WORKFLOW: ${{ steps.edge-authority.outputs.workflow }}
          PR_C_CONTROLLED_HUMAN_EDGE_RUN_ID: ${{ steps.edge-authority.outputs.run-id }}
          PR_C_CONTROLLED_HUMAN_EDGE_RUN_ATTEMPT: ${{ steps.edge-authority.outputs.run-attempt }}
          PR_C_CONTROLLED_HUMAN_EDGE_ARTIFACT_NAME: ${{ steps.edge-authority.outputs.artifact-name }}
          PR_C_CONTROLLED_HUMAN_EDGE_ARTIFACT_DIGEST: ${{ steps.edge-authority.outputs.artifact-digest }}
          PR_C_CONTROLLED_HUMAN_CREATED_AT: ${{ steps.timestamp.outputs.value }}
          PR_C_CONTROLLED_HUMAN_EVIDENCE_HMAC_KEY: ${{ secrets.PR_C_CONTROLLED_HUMAN_EVIDENCE_HMAC_KEY }}
        run: node scripts/buildPrCControlledHumanPreparation.mjs --preflight output/controlled-human/preflight.json --plan output/controlled-human/plan.json --apply output/controlled-human/apply.json --verify output/controlled-human/verify.json --edge-deployment output/controlled-human/edge-deployment.json --output output/controlled-human/preparation.json

      - name: Write role-owned human observation templates
        run: node scripts/writePrCControlledHumanObservationTemplates.mjs --preparation output/controlled-human/preparation.json --output-directory output/controlled-human/templates

      - name: Verify pinned Supabase CA for abort recovery
        id: verify_abort_recovery_ca
        if: ${{ failure() && steps.apply.outcome != 'skipped' }}
        run: node scripts/prCControlledHumanPostgresTls.mjs verify-ca

      - name: Protected exact-bound abort recovery after failed seed or evidence assembly
        if: ${{ failure() && steps.apply.outcome != 'skipped' && steps.verify_abort_recovery_ca.outcome == 'success' }}
        continue-on-error: true
        env:
          PR_C_CONTROLLED_HUMAN_DATABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_DATABASE_URL }}
          PR_C_CONTROLLED_HUMAN_EXERCISE_ID: ${{ secrets.PR_C_CONTROLLED_HUMAN_EXERCISE_ID }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_URL }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/prCControlledHumanEnvironment.mjs recover-reset --reason abort --output output/controlled-human/emergency-deprovision.json

      - name: Upload sanitized preparation and observation templates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr264-controlled-human-preparation-${{ needs.controlled_human_authority.outputs.exact-head-sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/controlled-human/preparation.json
            output/controlled-human/edge-deployment.json
            output/controlled-human/verify.json
            output/controlled-human/templates/
          if-no-files-found: error
          retention-days: 14

  controlled_human_quiesce:
    needs: controlled_human_authority
    if: ${{ needs.controlled_human_authority.outputs.phase == 'quiesce' }}
    environment: hosted-nonproduction-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_C_CONTROLLED_HUMAN_ENVIRONMENT_CLASS: hosted_nonproduction_pilot
      PR_C_CONTROLLED_HUMAN_PR_NUMBER: 264
      PR_C_CONTROLLED_HUMAN_RELEASE_SHA: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
      PR_C_CONTROLLED_HUMAN_REVIEW_HEAD_SHA: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
      PR_C_CONTROLLED_HUMAN_DEPLOY_ID: ${{ needs.controlled_human_authority.outputs.netlify-deploy-id }}
      PR_C_CONTROLLED_HUMAN_DEPLOY_ORIGIN: https://deploy-preview-264--avalaos-pilot.netlify.app
      PR_C_CONTROLLED_HUMAN_EXERCISE_DIGEST: ${{ needs.controlled_human_authority.outputs.exercise-digest }}
      PR_C_CONTROLLED_HUMAN_EXPECTED_EXERCISE_DIGEST: ${{ needs.controlled_human_authority.outputs.exercise-digest }}
      PR_C_CONTROLLED_HUMAN_TARGET_FINGERPRINT: ${{ needs.controlled_human_authority.outputs.target-fingerprint }}
      PR_C_CONTROLLED_HUMAN_EXPECTED_PUBLIC_TARGET_DIGEST: ${{ needs.controlled_human_authority.outputs.public-target-digest }}
      PR_C_CONTROLLED_HUMAN_SITE_NAME: avalaos-pilot
      PR_C_CONTROLLED_HUMAN_NETLIFY_CONTEXT: deploy-preview
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact checkout
        run: test "$(git rev-parse HEAD)" = "$PR_C_CONTROLLED_HUMAN_RELEASE_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies before protected values
        run: npm ci

      - name: Require exact protected quiesce phase secrets
        env:
          PR_C_CONTROLLED_HUMAN_DATABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_DATABASE_URL }}
          PR_C_CONTROLLED_HUMAN_EXERCISE_ID: ${{ secrets.PR_C_CONTROLLED_HUMAN_EXERCISE_ID }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_PROJECT_REF: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_PROJECT_REF }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_URL }}
        run: node scripts/prCControlledHumanWorkflowSecrets.mjs quiesce

      - name: Verify completed exact-head preparation run and immutable artifact
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          EXPECTED_HEAD: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
          PREPARATION_RUN_ID: ${{ needs.controlled_human_authority.outputs.preparation-run-id }}
          PREPARATION_RUN_ATTEMPT: ${{ needs.controlled_human_authority.outputs.preparation-run-attempt }}
        with:
          script: |
            const id = process.env.PREPARATION_RUN_ID;
            const attempt = process.env.PREPARATION_RUN_ATTEMPT;
            if (!/^[1-9][0-9]{0,19}$/.test(id) || !/^[1-9][0-9]*$/.test(attempt)) return core.setFailed('invalid preparation run binding');
            const runId = Number(id);
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner: context.repo.owner, repo: context.repo.repo, run_id: runId });
            if (!Number.isSafeInteger(runId) || String(run.path || '').split('@',1)[0] !== '.github/workflows/transcript-flow-pr-c.yml' || run.head_sha !== process.env.EXPECTED_HEAD || run.event !== 'pull_request' || run.status !== 'completed' || run.conclusion !== 'success' || String(run.run_attempt) !== attempt) return core.setFailed('preparation run identity mismatch');
            const name = `pr264-controlled-human-preparation-${process.env.EXPECTED_HEAD}-${id}-${attempt}`;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ owner: context.repo.owner, repo: context.repo.repo, run_id: runId, per_page: 100 });
            const matches = data.artifacts.filter(item => item.name === name && !item.expired);
            if (matches.length !== 1 || !/^sha256:[0-9a-f]{64}$/.test(matches[0].digest || '')) return core.setFailed('immutable preparation artifact missing or ambiguous');

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pr264-controlled-human-preparation-${{ needs.controlled_human_authority.outputs.exact-head-sha }}-${{ needs.controlled_human_authority.outputs.preparation-run-id }}-${{ needs.controlled_human_authority.outputs.preparation-run-attempt }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.controlled_human_authority.outputs.preparation-run-id }}
          path: output/controlled-human/input

      - name: Validate exact preparation and active exercise binding
        env:
          PR_C_CONTROLLED_HUMAN_EXPECTED_VERSION: 1
        run: node scripts/validatePrCControlledHumanPreparation.mjs --preparation output/controlled-human/input/preparation.json

      - name: Bind Supabase project, API and database before lifecycle mutation
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_PROJECT_REF }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_URL }}
          PR_C_CONTROLLED_HUMAN_DATABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_DATABASE_URL }}
        run: node --input-type=module -e "import {validateSupabaseTargetTuple} from './scripts/prCControlledHumanEnvironment.mjs'; validateSupabaseTargetTuple(process.env.SUPABASE_PROJECT_REF,process.env.PR_C_CONTROLLED_HUMAN_SUPABASE_URL,process.env.PR_C_CONTROLLED_HUMAN_DATABASE_URL)"

      - name: Verify pinned Supabase CA for active-state verification
        run: node scripts/prCControlledHumanPostgresTls.mjs verify-ca

      - name: Reverify exact preview and active synthetic state
        env:
          PR_C_CONTROLLED_HUMAN_DATABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_DATABASE_URL }}
          PR_C_CONTROLLED_HUMAN_EXERCISE_ID: ${{ secrets.PR_C_CONTROLLED_HUMAN_EXERCISE_ID }}
        run: |
          node scripts/verifyPr264ControlledHumanPreview.mjs
          node scripts/prCControlledHumanEnvironment.mjs verify --output output/controlled-human/current-verify.json

      - name: Verify pinned Supabase CA for read-only transition
        run: node scripts/prCControlledHumanPostgresTls.mjs verify-ca

      - name: Enter exact server-enforced read-only state before any read-only human observation
        env:
          PR_C_CONTROLLED_HUMAN_DATABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_DATABASE_URL }}
          PR_C_CONTROLLED_HUMAN_EXERCISE_ID: ${{ secrets.PR_C_CONTROLLED_HUMAN_EXERCISE_ID }}
        run: node scripts/prCControlledHumanEnvironment.mjs quiesce --authority output/controlled-human/current-verify.json --output output/controlled-human/quiesce.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr264-controlled-human-quiesce-${{ needs.controlled_human_authority.outputs.exact-head-sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/controlled-human/quiesce.json
          if-no-files-found: error
          retention-days: 14

  controlled_human_requester:
    needs: controlled_human_authority
    if: ${{ needs.controlled_human_authority.outputs.phase == 'checkpoints' }}
    environment: hosted-nonproduction-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_C_CONTROLLED_HUMAN_ENVIRONMENT_CLASS: hosted_nonproduction_pilot
      PR_C_CONTROLLED_HUMAN_PR_NUMBER: 264
      PR_C_CONTROLLED_HUMAN_RELEASE_SHA: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
      PR_C_CONTROLLED_HUMAN_REVIEW_HEAD_SHA: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
      PR_C_CONTROLLED_HUMAN_DEPLOY_ID: ${{ needs.controlled_human_authority.outputs.netlify-deploy-id }}
      PR_C_CONTROLLED_HUMAN_DEPLOY_ORIGIN: https://deploy-preview-264--avalaos-pilot.netlify.app
      PR_C_CONTROLLED_HUMAN_EXERCISE_DIGEST: ${{ needs.controlled_human_authority.outputs.exercise-digest }}
      PR_C_CONTROLLED_HUMAN_EXPECTED_EXERCISE_DIGEST: ${{ needs.controlled_human_authority.outputs.exercise-digest }}
      PR_C_CONTROLLED_HUMAN_TARGET_FINGERPRINT: ${{ needs.controlled_human_authority.outputs.target-fingerprint }}
      PR_C_CONTROLLED_HUMAN_EXPECTED_PUBLIC_TARGET_DIGEST: ${{ needs.controlled_human_authority.outputs.public-target-digest }}
      PR_C_CONTROLLED_HUMAN_SITE_NAME: avalaos-pilot
      PR_C_CONTROLLED_HUMAN_NETLIFY_CONTEXT: deploy-preview
      PR_C_CONTROLLED_HUMAN_CAPTURE_WORKFLOW: .github/workflows/transcript-flow-pr-c.yml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact checkout
        env:
          EXPECTED_HEAD: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies before protected values
        run: npm ci

      - name: Require exact protected checkpoint phase secrets
        env:
          PR_C_CONTROLLED_HUMAN_DATABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_DATABASE_URL }}
          PR_C_CONTROLLED_HUMAN_EVIDENCE_HMAC_KEY: ${{ secrets.PR_C_CONTROLLED_HUMAN_EVIDENCE_HMAC_KEY }}
          PR_C_CONTROLLED_HUMAN_EXERCISE_ID: ${{ secrets.PR_C_CONTROLLED_HUMAN_EXERCISE_ID }}
        run: node scripts/prCControlledHumanWorkflowSecrets.mjs checkpoint

      - name: Verify completed exact-head preparation run and immutable artifact
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          EXPECTED_HEAD: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
          PREPARATION_RUN_ID: ${{ needs.controlled_human_authority.outputs.preparation-run-id }}
          PREPARATION_RUN_ATTEMPT: ${{ needs.controlled_human_authority.outputs.preparation-run-attempt }}
          QUIESCE_RUN_ID: ${{ needs.controlled_human_authority.outputs.quiesce-run-id }}
          QUIESCE_RUN_ATTEMPT: ${{ needs.controlled_human_authority.outputs.quiesce-run-attempt }}
        with:
          script: |
            const bindings = [
              ['preparation', process.env.PREPARATION_RUN_ID, process.env.PREPARATION_RUN_ATTEMPT, (id,attempt) => `pr264-controlled-human-preparation-${process.env.EXPECTED_HEAD}-${id}-${attempt}`],
              ['quiesce', process.env.QUIESCE_RUN_ID, process.env.QUIESCE_RUN_ATTEMPT, (id,attempt) => `pr264-controlled-human-quiesce-${process.env.EXPECTED_HEAD}-${id}-${attempt}`],
            ];
            for (const [kind,id,attempt,nameFor] of bindings) {
              if (!/^[1-9][0-9]{0,19}$/.test(id) || !/^[1-9][0-9]*$/.test(attempt)) return core.setFailed(`invalid ${kind} run binding`);
              const runId = Number(id);
              const { data: run } = await github.rest.actions.getWorkflowRun({ owner: context.repo.owner, repo: context.repo.repo, run_id: runId });
              if (!Number.isSafeInteger(runId) || String(run.path || '').split('@',1)[0] !== '.github/workflows/transcript-flow-pr-c.yml' || run.head_sha !== process.env.EXPECTED_HEAD || run.event !== 'pull_request' || run.status !== 'completed' || run.conclusion !== 'success' || String(run.run_attempt) !== attempt) return core.setFailed(`${kind} run identity mismatch`);
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({ owner: context.repo.owner, repo: context.repo.repo, run_id: runId, per_page: 100 });
              const matches = data.artifacts.filter(item => item.name === nameFor(id,attempt) && !item.expired);
              if (matches.length !== 1 || !/^sha256:[0-9a-f]{64}$/.test(matches[0].digest || '')) return core.setFailed(`immutable ${kind} artifact missing or ambiguous`);
            }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pr264-controlled-human-preparation-${{ needs.controlled_human_authority.outputs.exact-head-sha }}-${{ needs.controlled_human_authority.outputs.preparation-run-id }}-${{ needs.controlled_human_authority.outputs.preparation-run-attempt }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.controlled_human_authority.outputs.preparation-run-id }}
          path: output/controlled-human/input

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pr264-controlled-human-quiesce-${{ needs.controlled_human_authority.outputs.exact-head-sha }}-${{ needs.controlled_human_authority.outputs.quiesce-run-id }}-${{ needs.controlled_human_authority.outputs.quiesce-run-attempt }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.controlled_human_authority.outputs.quiesce-run-id }}
          path: output/controlled-human/input

      - name: Validate the exact pre-comment read-only transition
        run: node --input-type=module -e "import {readFile} from 'node:fs/promises'; import {validateQuiesceRecord} from './scripts/prCControlledHumanEvidenceContract.mjs'; const preparation=JSON.parse(await readFile('output/controlled-human/input/preparation.json','utf8')); const quiesce=JSON.parse(await readFile('output/controlled-human/input/quiesce.json','utf8')); validateQuiesceRecord(preparation,quiesce)"

      - name: Retrieve immutable human duty comment and reject edited or substituted evidence
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          EXPECTED_HEAD: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
          EXPECTED_ROLE: requester
          EXPECTED_EXERCISE_DIGEST: ${{ needs.controlled_human_authority.outputs.exercise-digest }}
          COMMENT_ID: ${{ needs.controlled_human_authority.outputs.requester-comment-id }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            if (!['requester','reviewer','approver'].includes(process.env.EXPECTED_ROLE) || !/^[1-9][0-9]{0,19}$/.test(process.env.COMMENT_ID)) return core.setFailed('invalid comment binding');
            const preparationBytes = fs.readFileSync('output/controlled-human/input/preparation.json');
            const preparation = JSON.parse(preparationBytes);
            const canonical = value => Array.isArray(value) ? `[${value.map(canonical).join(',')}]` : value && typeof value === 'object' ? `{${Object.keys(value).sort().map(key => `${JSON.stringify(key)}:${canonical(value[key])}`).join(',')}}` : JSON.stringify(value);
            const preparationDigest = `sha256:${crypto.createHash('sha256').update(canonical(preparation)).digest('hex')}`;
            const { data: comment } = await github.rest.issues.getComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: Number(process.env.COMMENT_ID) });
            if (comment.issue_url.split('/').at(-1) !== '264' || comment.user?.type !== 'User' || !comment.user.login || comment.created_at !== comment.updated_at) return core.setFailed('comment provenance mismatch');
            let payload; try { payload = JSON.parse(comment.body); } catch { return core.setFailed('comment must contain only canonical JSON'); }
            if (payload.kind !== 'pr264-controlled-human-observation' || payload.humanRole !== process.env.EXPECTED_ROLE || payload.exactHead !== process.env.EXPECTED_HEAD || payload.preparationDigest !== preparationDigest || payload.exerciseDigest !== process.env.EXPECTED_EXERCISE_DIGEST || !Array.isArray(payload.observations)) return core.setFailed('comment evidence binding mismatch');
            fs.mkdirSync('output/controlled-human/private', { recursive: true });
            fs.writeFileSync('output/controlled-human/private/comment.json', JSON.stringify({ ...payload, actor: comment.user.login, commentId: String(comment.id), createdAt: comment.created_at, updatedAt: comment.updated_at }), { flag: 'wx', mode: 0o600 });
            const observerRequest = { humanRole: payload.humanRole, steps: payload.observations.flatMap(checkpoint => checkpoint.steps.map(step => ({ checkpointId: checkpoint.checkpointId, stepId: step.stepId, personaKey: step.personaKey, startedAt: step.startedAt, completedAt: step.completedAt, attemptDigest: `sha256:${crypto.createHash('sha256').update(canonical(step.browserArtifact)).digest('hex')}`, bindingToken: step.browserArtifact.serverBinding?.bindingToken ?? null }))) };
            fs.writeFileSync('output/controlled-human/private/observer-request.json', JSON.stringify(observerRequest), { flag: 'wx', mode: 0o600 });

      - name: Verify pinned Supabase CA for backend observer
        run: node scripts/prCControlledHumanPostgresTls.mjs verify-ca

      - name: Derive backend observer records from the exact synthetic read-only scope
        env:
          PR_C_CONTROLLED_HUMAN_DATABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_DATABASE_URL }}
          PR_C_CONTROLLED_HUMAN_EXERCISE_ID: ${{ secrets.PR_C_CONTROLLED_HUMAN_EXERCISE_ID }}
        run: node scripts/prCControlledHumanEnvironment.mjs checkpoint-observe --request output/controlled-human/private/observer-request.json --output output/controlled-human/private/server-observer.json

      - name: Record capture timestamp
        id: timestamp
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Sign human attestation and independently observed server evidence
        env:
          PR_C_CONTROLLED_HUMAN_EVIDENCE_HMAC_KEY: ${{ secrets.PR_C_CONTROLLED_HUMAN_EVIDENCE_HMAC_KEY }}
          PR_C_CONTROLLED_HUMAN_CAPTURED_AT: ${{ steps.timestamp.outputs.value }}
        run: node scripts/capturePrCControlledHumanCheckpoint.mjs --preparation output/controlled-human/input/preparation.json --quiesce output/controlled-human/input/quiesce.json --comment output/controlled-human/private/comment.json --observer output/controlled-human/private/server-observer.json --output "output/controlled-human/checkpoint-requester.json"

      - name: Remove raw actor-bearing input before artifact upload
        run: node --input-type=module -e "import {rmSync} from 'node:fs'; rmSync('output/controlled-human/private',{recursive:true,force:true})"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr264-controlled-human-requester-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/controlled-human/checkpoint-requester.json
          if-no-files-found: error
          retention-days: 14

  controlled_human_approver:
    needs: [controlled_human_authority, controlled_human_requester]
    if: ${{ needs.controlled_human_authority.outputs.phase == 'checkpoints' && needs.controlled_human_requester.result == 'success' }}
    environment: hosted-nonproduction-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_C_CONTROLLED_HUMAN_ENVIRONMENT_CLASS: hosted_nonproduction_pilot
      PR_C_CONTROLLED_HUMAN_PR_NUMBER: 264
      PR_C_CONTROLLED_HUMAN_RELEASE_SHA: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
      PR_C_CONTROLLED_HUMAN_REVIEW_HEAD_SHA: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
      PR_C_CONTROLLED_HUMAN_DEPLOY_ID: ${{ needs.controlled_human_authority.outputs.netlify-deploy-id }}
      PR_C_CONTROLLED_HUMAN_DEPLOY_ORIGIN: https://deploy-preview-264--avalaos-pilot.netlify.app
      PR_C_CONTROLLED_HUMAN_EXERCISE_DIGEST: ${{ needs.controlled_human_authority.outputs.exercise-digest }}
      PR_C_CONTROLLED_HUMAN_EXPECTED_EXERCISE_DIGEST: ${{ needs.controlled_human_authority.outputs.exercise-digest }}
