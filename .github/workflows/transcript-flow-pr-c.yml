name: Governed Delivery and Monitor PR C

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transcript-flow-pr-c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-governed-evidence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PR_C_BASE_SHA: 5433cad41721355e3ec5a29bc2f87772540c77b5
      PR_C_EXECUTION_CLASSIFICATION: github_candidate
      PR_C_EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_C_RUN_ATTEMPT: ${{ github.run_attempt }}
      PR_C_WORKFLOW_PATH: .github/workflows/transcript-flow-pr-c.yml
      PR_C_WORKFLOW_RUN_ID: ${{ github.run_id }}
      TRANSCRIPT_FLOW_PR_C_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TRANSCRIPT_FLOW_PR_B_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TRANSCRIPT_FLOW_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      ENTERPRISE_INTELLIGENCE_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      STUDIO_ARTIFACT_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      STUDIO_PRIVATE_ARTIFACT_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PILOT_OPERATIONS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PR1D_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PR1E_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checked-out head and accepted base
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$PR_C_EXACT_HEAD_SHA"
          test "$(git merge-base "$PR_C_BASE_SHA" HEAD)" = "$PR_C_BASE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify PR C registry, fixtures, owners, lineage, and adversarial evidence contract
        run: npm run test:transcript-flow:delivery-monitor-evidence-contract
      - name: Execute the exact governed Delivery/Monitor PR C and retained-platform command registry
        run: node scripts/runTranscriptFlowPrCEvidence.mjs
      - name: Independently verify per-assertion exact-head PR C evidence
        run: npm run test:transcript-flow:delivery-monitor-evidence
      - name: Upload sanitized exact-head governed Delivery/Monitor PR C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-delivery-monitor-pr-c-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/process-lifecycle-pr-c/
          if-no-files-found: error
          retention-days: 14
