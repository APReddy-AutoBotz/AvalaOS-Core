          EXPECTED_HEAD: ${{ needs.controlled_human_authority.outputs.exact-head-sha }}
          EXPECTED_ROLE: approver
          EXPECTED_EXERCISE_DIGEST: ${{ needs.controlled_human_authority.outputs.exercise-digest }}
          COMMENT_ID: ${{ needs.controlled_human_authority.outputs.approver-comment-id }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            if (!['requester','reviewer','approver'].includes(process.env.EXPECTED_ROLE) || !/^[1-9][0-9]{0,19}$/.test(process.env.COMMENT_ID)) return core.setFailed('invalid comment binding');
            const preparationBytes = fs.readFileSync('output/controlled-human/input/preparation.json');
            const preparation = JSON.parse(preparationBytes);
            const canonical = value => Array.isArray(value) ? `[${value.map(canonical).join(',')}]` : value && typeof value === 'object' ? `{${Object.keys(value).sort().map(key => `${JSON.stringify(key)}:${canonical(value[key])}`).join(',')}}` : JSON.stringify(value);
            const preparationDigest = `sha256:${crypto.createHash('sha256').update(canonical(preparation)).digest('hex')}`;
