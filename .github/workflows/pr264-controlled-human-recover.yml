name: PR 264 Controlled Human Exact Recovery

on:
  workflow_call:
    inputs:
      exact_head_sha:
        description: Exact prior PR 264 head whose server-held recovery authority must be completed
        required: true
        type: string
      netlify_deploy_id:
        description: Exact 24-character Deploy Preview ID stored in recovery authority
        required: true
        type: string
      exercise_digest:
        description: Exact safe exercise digest derived from the protected exercise ID
        required: true
        type: string
      target_fingerprint:
        description: Exact safe dedicated-backend fingerprint stored in recovery authority
        required: true
        type: string
      public_target_digest:
        description: Protected digest of the exact public Supabase origin
        required: true
        type: string
      reason:
        description: Protected terminal recovery reason (abort or expiry)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      exact_head_sha:
        description: Exact prior PR 264 head whose server-held recovery authority must be completed
        required: true
        type: string
      netlify_deploy_id:
        description: Exact 24-character Deploy Preview ID stored in recovery authority
        required: true
        type: string
      exercise_digest:
        description: Exact safe exercise digest derived from the protected exercise ID
        required: true
        type: string
      target_fingerprint:
        description: Exact safe dedicated-backend fingerprint stored in recovery authority
        required: true
        type: string
      public_target_digest:
        description: Protected digest of the exact public Supabase origin
        required: true
        type: string
      reason:
        description: Protected terminal recovery reason
        required: true
        type: choice
        options:
          - abort
          - expiry

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pr264-controlled-human-${{ inputs.exercise_digest }}
  cancel-in-progress: false

jobs:
  recover:
    environment: hosted-nonproduction-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_C_CONTROLLED_HUMAN_ENVIRONMENT_CLASS: hosted_nonproduction_pilot
      PR_C_CONTROLLED_HUMAN_PR_NUMBER: 264
      PR_C_CONTROLLED_HUMAN_RELEASE_SHA: ${{ inputs.exact_head_sha }}
      PR_C_CONTROLLED_HUMAN_REVIEW_HEAD_SHA: ${{ inputs.exact_head_sha }}
      PR_C_CONTROLLED_HUMAN_DEPLOY_ID: ${{ inputs.netlify_deploy_id }}
      PR_C_CONTROLLED_HUMAN_DEPLOY_ORIGIN: https://deploy-preview-264--avalaos-pilot.netlify.app
      PR_C_CONTROLLED_HUMAN_EXPECTED_EXERCISE_DIGEST: ${{ inputs.exercise_digest }}
      PR_C_CONTROLLED_HUMAN_TARGET_FINGERPRINT: ${{ inputs.target_fingerprint }}
      PR_C_CONTROLLED_HUMAN_EXPECTED_PUBLIC_TARGET_DIGEST: ${{ inputs.public_target_digest }}
      PR_C_CONTROLLED_HUMAN_SITE_NAME: avalaos-pilot
      PR_C_CONTROLLED_HUMAN_NETLIFY_CONTEXT: deploy-preview
    steps:
      - name: Verify exact prior PR 264 head and bounded inputs
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          EXPECTED_HEAD: ${{ inputs.exact_head_sha }}
          EXPECTED_DEPLOY: ${{ inputs.netlify_deploy_id }}
          EXPECTED_EXERCISE: ${{ inputs.exercise_digest }}
          EXPECTED_TARGET: ${{ inputs.target_fingerprint }}
          EXPECTED_PUBLIC_TARGET: ${{ inputs.public_target_digest }}
        with:
          script: |
            const fail = message => core.setFailed(`PR 264 controlled-human recovery rejected: ${message}`);
            if (!/^[0-9a-f]{40}$/.test(process.env.EXPECTED_HEAD)) return fail('invalid head');
            if (!/^[0-9a-f]{24}$/.test(process.env.EXPECTED_DEPLOY)) return fail('invalid deploy');
            if (!/^sha256:[0-9a-f]{64}$/.test(process.env.EXPECTED_EXERCISE) || !/^sha256:[0-9a-f]{64}$/.test(process.env.EXPECTED_TARGET) || !/^sha256:[0-9a-f]{64}$/.test(process.env.EXPECTED_PUBLIC_TARGET)) return fail('invalid digest');
            const { data: pull } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: 264 });
            if (pull.head.ref !== 'controller/governed-delivery-monitor-pr-c-20260831' || pull.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) return fail('untrusted PR source');
            const commits = await github.paginate(github.rest.pulls.listCommits, { owner: context.repo.owner, repo: context.repo.repo, pull_number: 264, per_page: 100 });
            if (!commits.some(commit => commit.sha === process.env.EXPECTED_HEAD)) return fail('head was not part of PR 264');

      - name: Checkout exact recoverable PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.exact_head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact checkout and recovery-capable source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_C_CONTROLLED_HUMAN_RELEASE_SHA"
          grep -F "pr_c_controlled_human_recovery_authorities" supabase/migrations/20260904120000_pr_c_controlled_human_exercise_authority.sql >/dev/null
          grep -F "recover-reset" scripts/prCControlledHumanEnvironment.mjs >/dev/null

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies before protected values
        run: npm ci

      - name: Bind Supabase project, API, and database to one exact synthetic target
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_PROJECT_REF }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_URL }}
          PR_C_CONTROLLED_HUMAN_DATABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_DATABASE_URL }}
        run: node --input-type=module -e "import {validateSupabaseTargetTuple} from './scripts/prCControlledHumanEnvironment.mjs'; validateSupabaseTargetTuple(process.env.SUPABASE_PROJECT_REF,process.env.PR_C_CONTROLLED_HUMAN_SUPABASE_URL,process.env.PR_C_CONTROLLED_HUMAN_DATABASE_URL)"

      - name: Complete exact server-authorized abort or expiry recovery
        env:
          PR_C_CONTROLLED_HUMAN_DATABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_DATABASE_URL }}
          PR_C_CONTROLLED_HUMAN_EXERCISE_ID: ${{ secrets.PR_C_CONTROLLED_HUMAN_EXERCISE_ID }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_URL }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/prCControlledHumanEnvironment.mjs recover-reset --reason ${{ inputs.reason }} --output output/controlled-human/recovery.json

      - name: Upload sanitized terminal recovery receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr264-controlled-human-recovery-${{ inputs.exact_head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/controlled-human/recovery.json
          if-no-files-found: error
          retention-days: 14
