name: Hosted Final Gate Closure CI

on:
  pull_request:
    paths:
      - '.github/workflows/hosted-pilot-activation-evidence-producer.yml'
      - '.github/workflows/hosted-final-gate-closure-ci.yml'
      - 'scripts/hostedPilotDatabaseVerify.mjs'
      - 'scripts/wait-hosted-pilot-evidence-families.mjs'
      - 'scripts/hostedFinalGateClosure.test.mjs'
      - 'supabase/migrations/20260812171000_hosted_evidence_execution_gate_closure.sql'

permissions:
  contents: read

jobs:
  focused-hosted-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Verify focused final hosted gate contracts
        run: node --test scripts/hostedFinalGateClosure.test.mjs
      - name: Run retained hosted-pilot regression suite
        run: npm run test:hosted-pilot
      - name: Verify production build
        run: npm run build
