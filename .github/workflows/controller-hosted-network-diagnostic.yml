name: Controller Hosted Network Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/controller-hosted-network-diagnostic.yml'

permissions:
  contents: read

jobs:
  classify-stable-sandbox-xhr:
    name: Classify stable Sandbox XHR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STABLE_RELEASE_SHA: 2a422b84ea20921d5e65b1eec73716f6b8180375
      STABLE_NETLIFY_DEPLOY_ID: 6a80771b3272520008085c2c
      HOSTED_PILOT_URL: https://avalaos-pilot.netlify.app
    steps:
      - name: Checkout diagnostic controller branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install official Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify unchanged stable deployment identity
        env:
          EXPECTED_RELEASE_SHA: ${{ env.STABLE_RELEASE_SHA }}
          EXPECTED_NETLIFY_DEPLOY_ID: ${{ env.STABLE_NETLIFY_DEPLOY_ID }}
        run: node scripts/verify-hosted-deployment.mjs

      - name: Classify delayed external XHR without exposing its URL
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { chromium } from 'playwright';
          import AxeBuilder from '@axe-core/playwright';

          const stableOrigin = new URL(process.env.HOSTED_PILOT_URL).origin;
          const browser = await chromium.launch();
          const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
          const page = await context.newPage();
          const samples = [];
          let phase = 'sandbox-load';

          const family = (hostname) => {
            const host = hostname.toLowerCase();
            if (host.endsWith('.supabase.co')) return 'supabase';
            if (host === 'api.groq.com') return 'groq';
            if (host === 'generativelanguage.googleapis.com') return 'gemini';
            if (host.includes('netlify')) return 'netlify';
            if (host.endsWith('.googleapis.com')) return 'googleapis';
            if (host === 'aistudiocdn.com') return 'aistudiocdn';
            if (host === 'cdn.jsdelivr.net') return 'jsdelivr';
            if (host.endsWith('.gstatic.com')) return 'gstatic';
            return 'other';
          };

          page.on('request', request => {
            try {
              const url = new URL(request.url());
              if ((request.resourceType() === 'xhr' || request.resourceType() === 'fetch') && url.origin !== stableOrigin) {
                samples.push({
                  phase,
                  method: request.method().toUpperCase(),
                  resourceType: request.resourceType(),
                  family: family(url.hostname),
                  originFingerprint: `sha256:${createHash('sha256').update(url.origin).digest('hex')}`,
                });
              }
            } catch {}
          });

          const response = await page.goto(`${stableOrigin}/sandbox`, { waitUntil: 'domcontentloaded' });
          if (!response?.ok()) throw new Error('STABLE_SANDBOX_NAVIGATION_FAILED');
          const headers = response.headers();
          if (headers['x-avalaos-release'] !== process.env.STABLE_RELEASE_SHA
            || headers['x-avalaos-netlify-deploy-id'] !== process.env.STABLE_NETLIFY_DEPLOY_ID
            || headers['x-avalaos-environment'] !== 'hosted_nonproduction_pilot') {
            throw new Error('STABLE_DEPLOYMENT_IDENTITY_MISMATCH');
          }
          await page.getByRole('heading', { name: 'Explore with synthetic data.' }).waitFor();

          phase = 'persona-entry';
          const group = page.getByRole('group', { name: 'Choose a sandbox persona' });
          await group.getByRole('button').filter({ hasText: 'Process Analyst' }).click();
          await page.getByRole('button', { name: 'Enter sandbox as Process Analyst' }).click();
          await page.getByRole('button', { name: 'Toggle theme' }).waitFor();

          phase = 'settle-before-axe';
          await page.waitForTimeout(3000);
          const beforeAxe = samples.length;

          phase = 'axe-analysis';
          await new AxeBuilder({ page }).analyze();
          await page.waitForTimeout(1000);

          console.log(`SANITIZED_EXTERNAL_XHR_SAMPLES=${JSON.stringify(samples)}`);
          console.log(`SANITIZED_EXTERNAL_XHR_BEFORE_AXE=${beforeAxe}`);
          console.log(`SANITIZED_EXTERNAL_XHR_TOTAL=${samples.length}`);

          await browser.close();
          if (samples.length === 0) throw new Error('EXPECTED_STABLE_EXTERNAL_XHR_NOT_REPRODUCED');
          NODE
