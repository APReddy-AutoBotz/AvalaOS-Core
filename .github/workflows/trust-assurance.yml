name: Trust Assurance Evidence Hub
on:
  push:
    branches: ['codex/implement-enterprise-trust-hub']
  pull_request:
    paths: ['services/trustAssurance/**','components/admin/trust-assurance/**','components/admin/TrustCenterPanel.tsx','supabase/functions/**/trustAssurance*','supabase/functions/trust-assurance-*/**','supabase/migrations/*_trust_assurance_evidence_hub.sql','scripts/*TrustAssurance*','tests/trust-assurance/**','tests/trust-assurance/browser/**','playwright.trust-assurance.config.ts','vite.trust-assurance.config.ts','.github/workflows/trust-assurance.yml']
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: node scripts/runTrustAssuranceTest.mjs
      - run: node scripts/runEdgeTypeScriptTest.mjs types.ts services/trustCenterModel.ts services/trustAssurance/contracts.ts services/trustAssurance/domain.ts supabase/functions/_shared/tenantAuthority.ts supabase/functions/_shared/trustAssuranceCommand.ts supabase/functions/_shared/trustAssuranceCommand.test.ts
      - run: node scripts/testTrustAssuranceMigration.mjs
      - run: node scripts/checkTrustAssuranceBoundaries.mjs
      - run: npm run typecheck && npm run typecheck:edge && npm run build
      - run: npm run test:ai-boundary-static && npm run test:secret-hygiene
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: avalaos}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: node scripts/testTrustAssuranceMigration.mjs
      - run: node scripts/testTrustAssurancePostgres.mjs
        env: {DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/avalaos'}
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx vite build --config vite.trust-assurance.config.ts
        env: {VITE_RUNTIME_MODE: automated_test}
      - run: npx playwright test --config=playwright.trust-assurance.config.ts
