name: Controller Netlify Secret Preflight

on:
  push:
    branches:
      - controller/hosted-pilot-source-snapshot

permissions:
  contents: read

jobs:
  secret-preflight:
    environment: hosted-nonproduction-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
      NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
      NETLIFY_PERSONAL_ACCESS_TOKEN: ${{ secrets.NETLIFY_PERSONAL_ACCESS_TOKEN }}
    steps:
      - name: Report credential presence without values
        shell: bash
        run: |
          set -euo pipefail
          present=0
          for name in NETLIFY_AUTH_TOKEN NETLIFY_TOKEN NETLIFY_API_TOKEN NETLIFY_PERSONAL_ACCESS_TOKEN; do
            if [ -n "${!name:-}" ]; then
              echo "${name}=present"
              present=1
            else
              echo "${name}=absent"
            fi
          done
          if [ "$present" -ne 1 ]; then
            echo "No supported Netlify deployment credential is configured in the hosted-nonproduction-pilot environment." >&2
            exit 2
          fi
