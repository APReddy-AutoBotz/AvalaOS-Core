name: Controller Publication Recovery

on:
  push:
    branches:
      - controller/acceptance-evidence-closure-20260822
    paths:
      - .github/workflows/controller-publication-recovery.yml

permissions:
  contents: write
  issues: read

concurrency:
  group: controller-publication-recovery-pr255
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'APReddy-AutoBotz/AvalaOS-Core'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact recovery head
        uses: actions/checkout@v4
        with:
          ref: controller/acceptance-evidence-closure-20260822
          fetch-depth: 0

      - name: Recover and verify Codex patch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE: 67a894a3bd74cfee68dad9af6645cd3a33786e7f
          COMMENT_ID: '5382892724'
          EXPECTED_PATCH_SHA256: 1e315b725c4866cb543926a1ff324b2ee5f282e5f007c835690a242757665aa4
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "$EXPECTED_BASE"
          python - <<'PY'
          import hashlib, json, os, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          comment_id = os.environ['COMMENT_ID']
          token = os.environ['GH_TOKEN']
          expected = os.environ['EXPECTED_PATCH_SHA256']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/comments/{comment_id}',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              body = json.load(response)['body']
          marker = 'Complete machine-applicable patch:\n\n```diff\n'
          if marker not in body:
              raise SystemExit('PATCH_MARKER_NOT_FOUND')
          patch = body.split(marker, 1)[1].split('\n```', 1)[0]
          candidates = [patch, patch + '\n']
          for candidate in candidates:
              data = candidate.encode('utf-8')
              if hashlib.sha256(data).hexdigest() == expected:
                  open('/tmp/controller-recovery.patch', 'wb').write(data)
                  print('PATCH_SHA256_VERIFIED')
                  break
          else:
              raise SystemExit('PATCH_SHA256_MISMATCH')
          PY
          git apply --index --whitespace=nowarn /tmp/controller-recovery.patch
          test "$(git hash-object App.tsx)" = "2cd519f146eadc8eb40bb3968c741cb7743ab409"
          test "$(git hash-object services/falseSuccess.test.ts)" = "ba6f3475f9c7a839aae0775b105dfa662ef8a55e"
          test "$(git hash-object services/productNavigationController.test.ts)" = "a9500689ef5cea39467a50e39dc377cc52ce5089"
          test "$(git hash-object services/productNavigationController.ts)" = "0f4cccbea15240acd6405174b1bf0ba8cabbf3d5"
          git diff --cached --check

      - name: Publish exact recovered after-state and remove recovery workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/controller-publication-recovery.yml
          git config user.name 'AvalaOS Controller'
          git config user.email 'controller@users.noreply.github.com'
          git commit -m 'fix: converge navigation durability settlement'
          git push origin HEAD:controller/acceptance-evidence-closure-20260822
