name: Controller Publication Recovery

on:
  push:
    branches:
      - controller/reload-reconstruction-closure

permissions:
  contents: write

jobs:
  publish-approved-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified SAFETY-004 recovery and remove scaffold
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE='4e2f30a197ef9556f3542edc0e6c9c0d3375eddc'
          COMMENT_ID='5310161484'
          WORKFLOW='.github/workflows/controller-publication-recovery.yml'

          test "$(git rev-parse HEAD^)" = "$BASE"
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --jq .body > /tmp/recovery-comment.txt
          sed -nE 's/^[1-3]:(.*)$/\1/p' /tmp/recovery-comment.txt | tr -d '\n' > /tmp/recovery.b64
          test "$(wc -c < /tmp/recovery.b64 | tr -d ' ')" = '4044'
          base64 -d /tmp/recovery.b64 > /tmp/recovery.patch.gz
          echo 'e8e1885584e9b76fee35ff8c443d40ec048aeda24d1c6d4b3967b048c0f7ee0e  /tmp/recovery.patch.gz' | sha256sum -c -
          test "$(wc -c < /tmp/recovery.patch.gz | tr -d ' ')" = '3033'
          gzip -dc /tmp/recovery.patch.gz > /tmp/recovery.patch
          echo '6c9bf17bd075aca2df262fe1137f98d1c05e063789f18f5552b802ac7e7af399  /tmp/recovery.patch' | sha256sum -c -
          test "$(wc -c < /tmp/recovery.patch | tr -d ' ')" = '10088'

          git apply --check /tmp/recovery.patch
          git apply /tmp/recovery.patch
          test "$(git hash-object services/productNavigationState.ts)" = 'af4416c979497829347b679c45961b8df45ebce9'
          test "$(git hash-object App.tsx)" = 'cfabdee9d49da3886d018c12b7558886d66fdfe1'
          test "$(git hash-object services/viewStatePersistence.test.ts)" = 'e793c6c756a7f84d04f2527bee5f63cbfd0a0936'
          test "$(git hash-object tests/browser/exhaustiveHostedAcceptance.spec.ts)" = '135de93eb2929626c3a4d2667631e2628f7bfb19'
          test "$(git hash-object tests/browser/exhaustiveHostedAcceptanceContract.test.mjs)" = '3707503395d8950cc687d82e3eeb3b76f37f708f'

          git rm "$WORKFLOW"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(navigation): fail closed on reload state mismatch'
          git push origin HEAD:controller/reload-reconstruction-closure
