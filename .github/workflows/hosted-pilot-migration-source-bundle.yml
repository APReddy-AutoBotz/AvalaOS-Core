name: Hosted Pilot Migration Source Bundle

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'config/hosted-nonproduction-pilot-activation.json'
      - '.github/workflows/hosted-pilot-migration-source-bundle.yml'

# Controller-only checksum proof trigger. No migration content is changed.
permissions:
  contents: read

jobs:
  exact-head-migration-source:
    name: Exact-head migration source bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Require hosted non-production activation contract
        shell: bash
        run: |
          test -f config/hosted-nonproduction-pilot-activation.json
          grep -q '"environmentClass": "hosted_nonproduction_pilot"' config/hosted-nonproduction-pilot-activation.json
          grep -q '"productionCutover": false' config/hosted-nonproduction-pilot-activation.json

      - name: Build exact migration checksum manifest
        shell: bash
        run: |
          mkdir -p artifacts/hosted-pilot-migration-source
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 | sort -z | xargs -0 sha256sum > artifacts/hosted-pilot-migration-source/SHA256SUMS
          printf '%s\n' '${{ github.event.pull_request.head.sha }}' > artifacts/hosted-pilot-migration-source/HEAD_SHA
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -gt 0

      - name: Upload exact-head migration source
        uses: actions/upload-artifact@v4
        with:
          name: hosted-pilot-migration-source-${{ github.event.pull_request.head.sha }}
          path: |
            supabase/migrations/*.sql
            artifacts/hosted-pilot-migration-source/SHA256SUMS
            artifacts/hosted-pilot-migration-source/HEAD_SHA
          if-no-files-found: error
          retention-days: 1
