name: Exhaustive Acceptance Dispatch Bridge

on:
  create:

permissions:
  contents: read

jobs:
  validate-controller-bridge:
    if: >-
      github.ref_type == 'branch' &&
      startsWith(github.event.ref, 'exhaustive-acceptance-dispatch--') &&
      github.actor == 'APReddy-AutoBotz'
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.validate.outputs.release_sha }}
      netlify_deploy_id: ${{ steps.validate.outputs.netlify_deploy_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref }}
          fetch-depth: 0
      - id: validate
        name: Validate controller bridge provenance
        env:
          CREATED_REF: ${{ github.event.ref }}
        shell: bash
        run: |
          set -euo pipefail
          prefix='exhaustive-acceptance-dispatch--'
          DEPLOYMENT_ID="${CREATED_REF#${prefix}}"
          if [ "$DEPLOYMENT_ID" = "$CREATED_REF" ] || [[ ! "$DEPLOYMENT_ID" =~ ^[0-9a-f]{24}$ ]]; then
            echo 'EXHAUSTIVE_ACCEPTANCE_DISPATCH_REF_INVALID' >&2
            exit 1
          fi

          RELEASE_SHA="$(git rev-parse HEAD)"
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'EXHAUSTIVE_ACCEPTANCE_RELEASE_SHA_INVALID' >&2
            exit 1
          fi

          git fetch --quiet origin main
          if [ "$RELEASE_SHA" != "$(git rev-parse origin/main)" ]; then
            echo 'EXHAUSTIVE_ACCEPTANCE_DISPATCH_NOT_CURRENT_MAIN' >&2
            exit 1
          fi

          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "netlify_deploy_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "Controller bridge validated exact main ${RELEASE_SHA} and deploy ${DEPLOYMENT_ID}."

  run-exact-exhaustive-acceptance:
    needs: validate-controller-bridge
    uses: ./.github/workflows/exhaustive-acceptance.yml
    with:
      release_sha: ${{ needs.validate-controller-bridge.outputs.release_sha }}
      netlify_deploy_id: ${{ needs.validate-controller-bridge.outputs.netlify_deploy_id }}
      hosted_url: https://avalaos-pilot.netlify.app
