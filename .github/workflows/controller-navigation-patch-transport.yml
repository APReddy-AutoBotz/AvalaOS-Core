name: Controller Navigation Target Artifact

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  build-exact-target-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply retained Sol patch and classify controller QA storage inspection
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ANCESTOR_SHA: e5a628f288534fa1d1d8d0d82057f9fecfe3167c
          RETAINED_PATCH_BLOB_SHA: ec6bf087a97732cb1f23e9f7d2256488e796c76a
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${EXPECTED_ANCESTOR_SHA}^{commit}"
          git merge-base --is-ancestor "${EXPECTED_ANCESTOR_SHA}" HEAD

          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${RETAINED_PATCH_BLOB_SHA}" --jq .content \
            | tr -d '\n' \
            | base64 -d > /tmp/navigation.patch

          git apply --check /tmp/navigation.patch
          git apply /tmp/navigation.patch

          verify_blob() {
            path="$1"
            expected="$2"
            actual="$(git hash-object "$path")"
            printf '%s %s expected-prefix=%s\n' "$path" "$actual" "$expected"
            case "$actual" in
              "$expected"*) ;;
              *) echo "unexpected retained target blob for ${path}" >&2; exit 1 ;;
            esac
          }

          verify_blob '.github/workflows/preview-exhaustive-browser-qa.yml' '01920e1'
          verify_blob 'App.tsx' '6fe17b4'
          verify_blob 'package.json' 'af280b2'
          verify_blob 'playwright.config.ts' '866a02a'
          verify_blob 'playwright.controller-navigation-history.config.ts' '6b4b0af'
          verify_blob 'playwright.exhaustive-acceptance.config.ts' '36c2b60'
          verify_blob 'scripts/checkWorkflowYaml.test.mjs' 'd605ba9'
          verify_blob 'services/productNavigationController.test.ts' '291e783'
          verify_blob 'services/productNavigationController.ts' '0242432'
          verify_blob 'services/productNavigationState.ts' '563195a'
          verify_blob 'services/viewStatePersistence.test.ts' '213931b'

          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/quality/ai-boundary-static-scan-allowlist.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const entry = {
            pattern: 'local' + 'Storage',
            path: 'tests/browser/controllerNavigationHistory.spec.ts',
            lines: [35, 43],
            reason: 'test/control documentation',
            futureAction: 'Keep bounded inspection of non-secret persisted navigation evidence confined to controller browser QA; do not treat browser storage as runtime authority.'
          };
          const exists = data.entries.some((item) => item.pattern === entry.pattern && item.path === entry.path);
          if (!exists) data.entries.push(entry);
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE

          npm run test:workflow-yaml
          npm run test:product-navigation-controller
          npm run test:view-state-persistence
          npm run test:ai-boundary-static
          npm run typecheck
          git diff --check

          rm .github/workflows/controller-navigation-patch-transport.yml
          mkdir -p artifacts/controller-navigation-target
          {
            printf 'source_head=%s\n' "$(git rev-parse HEAD)"
            printf 'retained_patch_blob=%s\n' "${RETAINED_PATCH_BLOB_SHA}"
            for path in \
              '.github/workflows/preview-exhaustive-browser-qa.yml' \
              'App.tsx' \
              'package.json' \
              'playwright.config.ts' \
              'playwright.controller-navigation-history.config.ts' \
              'playwright.exhaustive-acceptance.config.ts' \
              'scripts/checkWorkflowYaml.test.mjs' \
              'services/productNavigationController.test.ts' \
              'services/productNavigationController.ts' \
              'services/productNavigationState.ts' \
              'services/viewStatePersistence.test.ts' \
              'docs/quality/ai-boundary-static-scan-allowlist.json'; do
              printf '%s %s\n' "$(git hash-object "$path")" "$path"
            done
          } > artifacts/controller-navigation-target/manifest.txt

      - name: Upload exact target files
        uses: actions/upload-artifact@v4
        with:
          name: controller-navigation-target
          if-no-files-found: error
          retention-days: 2
          path: |
            .github/workflows/preview-exhaustive-browser-qa.yml
            App.tsx
            package.json
            playwright.config.ts
            playwright.controller-navigation-history.config.ts
            playwright.exhaustive-acceptance.config.ts
            scripts/checkWorkflowYaml.test.mjs
            services/productNavigationController.test.ts
            services/productNavigationController.ts
            services/productNavigationState.ts
            services/viewStatePersistence.test.ts
            docs/quality/ai-boundary-static-scan-allowlist.json
            artifacts/controller-navigation-target/manifest.txt
