name: Controller Navigation Patch Transport

on:
  push:
    branches:
      - controller/navigation-durability-release-hardening-249
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-retained-sol-patch:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'controller/navigation-durability-release-hardening-249')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact controller head
        uses: actions/checkout@v4
        with:
          ref: controller/navigation-durability-release-hardening-249
          fetch-depth: 0

      - name: Apply Sol patch and verify exact target blobs
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE_SHA: e5a628f288534fa1d1d8d0d82057f9fecfe3167c
          RETAINED_PATCH_BLOB_SHA: ec6bf087a97732cb1f23e9f7d2256488e796c76a
          CONTROLLER_BRANCH: controller/navigation-durability-release-hardening-249
        shell: bash
        run: |
          set -euo pipefail
          echo "[transport] controller head=$(git rev-parse HEAD)"
          git cat-file -e "${EXPECTED_BASE_SHA}^{commit}"
          git rev-list HEAD | grep -Fx "$EXPECTED_BASE_SHA" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${RETAINED_PATCH_BLOB_SHA}" --jq .content | tr -d '\n' | base64 -d > /tmp/navigation.patch
          echo "[transport] captured patch bytes=$(wc -c < /tmp/navigation.patch) lines=$(wc -l < /tmp/navigation.patch)"
          grep '^diff --git ' /tmp/navigation.patch | sed -E 's#^diff --git a/([^ ]+) b/.*#\1#' | sort > /tmp/patch-paths
          cat > /tmp/expected-patch-paths <<'EOF'
          .github/workflows/preview-exhaustive-browser-qa.yml
          App.tsx
          package.json
          playwright.config.ts
          playwright.controller-navigation-history.config.ts
          playwright.exhaustive-acceptance.config.ts
          scripts/checkWorkflowYaml.test.mjs
          services/productNavigationController.test.ts
          services/productNavigationController.ts
          services/productNavigationState.ts
          services/viewStatePersistence.test.ts
          EOF
          sort /tmp/expected-patch-paths > /tmp/expected-patch-paths.sorted
          diff -u /tmp/expected-patch-paths.sorted /tmp/patch-paths
          git apply --check /tmp/navigation.patch
          git apply /tmp/navigation.patch
          echo "[transport] verifying byte-identical Sol after-state by Git blob IDs"
          verify_blob() { path="$1"; expected="$2"; actual="$(git hash-object "$path")"; echo "${path}: ${actual} expected-prefix=${expected}"; test "${actual#${expected}}" != "$actual"; }
          verify_blob '.github/workflows/preview-exhaustive-browser-qa.yml' '01920e1'
          verify_blob 'App.tsx' '6fe17b4'
          verify_blob 'package.json' 'af280b2'
          verify_blob 'playwright.config.ts' '866a02a'
          verify_blob 'playwright.controller-navigation-history.config.ts' '6b4b0af'
          verify_blob 'playwright.exhaustive-acceptance.config.ts' '36c2b60'
          verify_blob 'scripts/checkWorkflowYaml.test.mjs' 'd605ba9'
          verify_blob 'services/productNavigationController.test.ts' '291e783'
          verify_blob 'services/productNavigationController.ts' '0242432'
          verify_blob 'services/productNavigationState.ts' '563195a'
          verify_blob 'services/viewStatePersistence.test.ts' '213931b'
          rm .github/workflows/controller-navigation-patch-transport.yml
          git add -A
          git diff --cached --check
          { cat /tmp/expected-patch-paths.sorted; echo '.github/workflows/controller-navigation-patch-transport.yml'; } | sort > /tmp/expected-staged-paths
          git diff --cached --name-only | sort > /tmp/actual-staged-paths
          diff -u /tmp/expected-staged-paths /tmp/actual-staged-paths
          git config user.name 'AvalaOS Controller'
          git config user.email 'controller@users.noreply.github.com'
          git commit -m 'Harden governed navigation history'
          git push origin "HEAD:${CONTROLLER_BRANCH}"
