name: Controller PR255 Recovery Artifact

on:
  push:
    branches:
      - controller/acceptance-evidence-closure-20260822

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  reconstruct-approved-correction:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact controller transport head
        uses: actions/checkout@v4
        with:
          ref: controller/acceptance-evidence-closure-20260822
          fetch-depth: 2

      - name: Reconstruct and verify approved correction
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE_SHA: 51232e24f6500664ec4252e8c4a3eb1e9c9247a9
          PATCH_COMMENT_ID: '5383088611'
          EXPECTED_PATCH_BYTES: '17626'
          EXPECTED_PATCH_SHA256: 1e315b725c4866cb543926a1ff324b2ee5f282e5f007c835690a242757665aa4
          EXPECTED_GZIP_BYTES: '4298'
          EXPECTED_GZIP_SHA256: 3fb4c7be2736331d21b666bdd97e22ccf1835b7b9daed4e83b6bb993322d9ebe
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE_SHA"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/controller-255-artifact-recovery.yml"
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${PATCH_COMMENT_ID}" --jq .body > /tmp/controller-comment.md
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path

          text = Path('/tmp/controller-comment.md').read_text(encoding='utf-8')
          begin = 'BEGIN_FINAL_255_PATCH_GZIP_BASE64'
          end = 'END_FINAL_255_PATCH_GZIP_BASE64'
          start = text.index(begin) + len(begin)
          stop = text.index(end, start)
          block = text[start:stop]
          fence = block.index('```text') + len('```text')
          fence_end = block.index('```', fence)
          payload = ''.join(block[fence:fence_end].split())
          compressed = base64.b64decode(payload, validate=True)
          if len(compressed) != 4298:
              raise SystemExit(f'gzip bytes mismatch: {len(compressed)}')
          if hashlib.sha256(compressed).hexdigest() != '3fb4c7be2736331d21b666bdd97e22ccf1835b7b9daed4e83b6bb993322d9ebe':
              raise SystemExit('gzip sha256 mismatch')
          patch = gzip.decompress(compressed)
          if len(patch) != 17626:
              raise SystemExit(f'patch bytes mismatch: {len(patch)}')
          if hashlib.sha256(patch).hexdigest() != '1e315b725c4866cb543926a1ff324b2ee5f282e5f007c835690a242757665aa4':
              raise SystemExit('patch sha256 mismatch')
          Path('/tmp/final.patch').write_bytes(patch)
          PY
          git apply --check /tmp/final.patch
          git apply /tmp/final.patch
          git diff --check
          test "$(git hash-object App.tsx)" = "2cd519f146eadc8eb40bb3968c741cb7743ab409"
          test "$(git hash-object services/falseSuccess.test.ts)" = "ba6f3475f9c7a839aae0775b105dfa662ef8a55e"
          test "$(git hash-object services/productNavigationController.test.ts)" = "a9500689ef5cea39467a50e39dc377cc52ce5089"
          test "$(git hash-object services/productNavigationController.ts)" = "0f4cccbea15240acd6405174b1bf0ba8cabbf3d5"
          mkdir -p /tmp/recovered/services
          cp App.tsx /tmp/recovered/App.tsx
          cp services/falseSuccess.test.ts /tmp/recovered/services/falseSuccess.test.ts
          cp services/productNavigationController.test.ts /tmp/recovered/services/productNavigationController.test.ts
          cp services/productNavigationController.ts /tmp/recovered/services/productNavigationController.ts
          cat > /tmp/recovered/MANIFEST.txt <<'EOF'
          base=51232e24f6500664ec4252e8c4a3eb1e9c9247a9
          App.tsx=2cd519f146eadc8eb40bb3968c741cb7743ab409
          services/falseSuccess.test.ts=ba6f3475f9c7a839aae0775b105dfa662ef8a55e
          services/productNavigationController.test.ts=a9500689ef5cea39467a50e39dc377cc52ce5089
          services/productNavigationController.ts=0f4cccbea15240acd6405174b1bf0ba8cabbf3d5
          patch_sha256=1e315b725c4866cb543926a1ff324b2ee5f282e5f007c835690a242757665aa4
          EOF

      - name: Upload verified after-state files
        uses: actions/upload-artifact@v4
        with:
          name: controller-pr255-recovery-${{ github.run_id }}
          path: /tmp/recovered
          if-no-files-found: error
          retention-days: 1

      - name: Signal controller artifact readiness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/255/comments" -f body="CONTROLLER_RECOVERY_ARTIFACT_READY run_id=${GITHUB_RUN_ID} transport_head=$(git rev-parse HEAD) base=51232e24f6500664ec4252e8c4a3eb1e9c9247a9 patch_sha256=1e315b725c4866cb543926a1ff324b2ee5f282e5f007c835690a242757665aa4" >/dev/null
