name: Authenticated Product Acceptance Preparation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      frontend_kind:
        description: Exact acceptance frontend source
        required: true
        default: local_build
        type: choice
        options:
          - local_build
          - netlify
      release_sha:
        description: Exact merged 40-character release SHA
        required: true
        type: string
      netlify_deploy_id:
        description: Exact 24-character non-production deploy ID
        required: false
        default: ''
        type: string
      hosted_url:
        description: Canonical non-production hosted origin
        required: false
        default: ''
        type: string
      expected_project_ref:
        description: Approved non-production Supabase project reference
        required: true
        type: string
      target_public_digest:
        description: Sanitized approved target inventory digest
        required: true
        type: string
      backend_digest:
        description: Exact approved hosted backend source digest
        required: true
        type: string
      migration_version:
        description: Exact approved hosted migration version
        required: true
        type: string
      migration_digest:
        description: Exact authenticated authority migration source digest
        required: true
        type: string
      exercise_digest:
        description: Exact approved synthetic exercise digest
        required: true
        type: string
      baseline_digest:
        description: Exact approved non-exercise baseline digest
        required: true
        type: string
      acceptance_mode:
        description: Protected hosted execution mode
        required: true
        default: full_acceptance
        type: choice
        options:
          - full_acceptance
          - v2_primary_prefix_diagnostic
          - reviewer_selection_diagnostic
          - govern_studio_diagnostic

permissions:
  contents: read

# Pull requests and pushes remain repository preparation only. The separately
# protected dispatch is dormant until an exact hosted run is approved.
# Local fixture authentication cannot promote authenticated hosted requirements.
env:
  RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  ACCEPTANCE_WORKFLOW_PATH: .github/workflows/authenticated-product-acceptance.yml
  ACCEPTANCE_EVIDENCE_ENVIRONMENT: ci-disposable-postgres

jobs:
  source-and-authority:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avalaos_exhaustive
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LEGACY_DELIVERY_ACCEPTANCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_exhaustive
      ENTERPRISE_LIFECYCLE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_pilot_synthetic
      ENTERPRISE_INTELLIGENCE_ACCEPTANCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_exhaustive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Feature contracts and evidence rejection
        run: |
          npm run test:authenticated-product:source
          npm run test:provider-secret-backend
          node scripts/runPr1fTypeScriptTest.mjs services/deliveryReadiness.ts services/deliveryReadiness.test.ts
          npm run typecheck
          npm run typecheck:edge
          node scripts/exhaustiveAcceptanceValidate.mjs
          git diff --check
      - name: Actual PostgreSQL bridge, process and provider authority
        env:
          PGPASSWORD: postgres
          AUTHENTICATED_SYNTHETIC_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          createdb -h 127.0.0.1 -U postgres avalaos_pilot_synthetic
          npm run test:authenticated-hosted:postgres
          node scripts/studioDeliveryAuthorityPostgres.mjs
          node scripts/testAuthenticatedConnectedPostgres.mjs
      - name: Verify fresh-request reviewer replay against PostgreSQL
        env:
          AUTHENTICATED_HOSTED_CONTROLLER_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          AUTHENTICATED_LOCAL_PROOF_DIRECTORY: output/local-private/reviewer-semantic-replay
        run: npm run test:authenticated-reviewer-selection:postgres
      - name: Retain sanitized reviewer semantic replay proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-semantic-replay-${{ env.RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/local-private/reviewer-semantic-replay/reviewer-selection-server-binding-proof.json
          if-no-files-found: error
          retention-days: 14
      - name: Enterprise Intelligence query and retained cases
        env:
          RETAINED_TEST_ID_RESULTS: /tmp/authenticated-ei-results.json
          RETAINED_SUITE_COMMAND: node scripts/testEnterpriseIntelligenceAcceptancePostgres.mjs
        run: node scripts/testEnterpriseIntelligenceAcceptancePostgres.mjs
      - name: Retain sanitized Enterprise Intelligence results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-ei-${{ env.RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/authenticated-ei-results.json
          if-no-files-found: error
          retention-days: 14

  native-provider-secret-backend:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      supabase-vault-postgres:
        image: supabase/postgres:17.6.1.166@sha256:d5424e9f4d0c21d63991c3f3dd77881f23f722c3a212452a61bc91924b79e8c8
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Actual Supabase Vault provider-secret authority
        env:
          SUPABASE_PROVIDER_SECRET_BACKEND_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run test:provider-secret-backend:postgres

  connected-browser:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avalaos_pilot_synthetic
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENTERPRISE_LIFECYCLE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_pilot_synthetic
      PILOT_ACCEPTANCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify ordinary production browser assets stay local
        run: |
          npm run test:local-assets:modules
          npm run test:local-assets:browser
      - name: Cache exact disposable Assess V2 transport images
        run: |
          docker pull postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          docker pull postgrest/postgrest@sha256:bca3f86f69d8ef7aa1e5ee65e66ce9a20c6c147be637517a7be8399e102901d1
      - name: Verify complete native primary journey with real controller observations
        env:
          ASSESS_V2_FULL_PREFIX_REPRODUCTION: '1'
        run: node scripts/testAssessV2NativePostgrest.mjs
      - name: Verify complete-primary fixture cleanup
        if: always()
        run: |
          test -z "$(docker ps -aq --filter label=avalaos.assess-v2-native-run)"
          test -z "$(docker network ls -q --filter label=avalaos.assess-v2-native-run)"
      - name: Retain sanitized native complete-primary comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-native-primary-${{ env.RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/local-private/authenticated-product-acceptance/authenticated-native-primary-reproduction/result.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify bounded V2 transport lifecycle in Chromium
        run: npx playwright test --config=playwright.v2-reload-transport.config.ts --workers=1
      - name: Verify native Assess V2 PostgREST lifecycle
        run: node scripts/testAssessV2NativePostgrest.mjs
      - name: Verify eligible reviewer authority with hosted role parity
        env:
          ASSESS_V2_ELIGIBLE_REVIEWER_REPRODUCTION: '1'
        run: node scripts/testAssessV2NativePostgrest.mjs
      - name: Verify native Assess V2 fixture cleanup
        if: always()
        run: |
          test -z "$(docker ps -aq --filter label=avalaos.assess-v2-native-run)"
          test -z "$(docker network ls -q --filter label=avalaos.assess-v2-native-run)"
      - name: Retain sanitized eligible reviewer authority proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eligible-reviewer-authority-${{ env.RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/local-private/authenticated-product-acceptance/eligible-reviewer-authority
          if-no-files-found: error
          retention-days: 14
      - name: Verify restricted reviewer Govern denial on Desktop and Pixel
        env:
          GOVERN_REVIEWER_DENIAL_PROOF_PATH: output/local-private/authenticated-product-acceptance/govern-reviewer-denial/govern-reviewer-denial-proof.json
        run: node scripts/reproduceGovernDisabledControl.mjs
      - name: Verify Govern and Studio lineage against PostgreSQL
        env:
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
          AUTHENTICATED_GOVERN_STUDIO_LINEAGE_PROOF_PATH: output/local-private/authenticated-product-acceptance/govern-reviewer-denial/govern-studio-lineage-proof.json
        run: node scripts/testAuthenticatedGovernStudioLineagePostgres.mjs
      - name: Retain sanitized Govern reviewer denial proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govern-reviewer-denial-${{ env.RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/local-private/authenticated-product-acceptance/govern-reviewer-denial/
          if-no-files-found: error
          retention-days: 14
      - name: Verify exact Studio handoff personas on Desktop and Pixel
        env:
          STUDIO_HANDOFF_PERSONA_ATTEMPT: output/local-private/authenticated-product-acceptance/studio-handoff-persona
        run: node scripts/reproduceStudioHandoffPersonaContract.mjs
      - name: Retain sanitized Studio handoff persona proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-handoff-persona-${{ env.RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/local-private/authenticated-product-acceptance/studio-handoff-persona/
          if-no-files-found: error
          retention-days: 14
      - name: Verify Reviewer-ready projection loading on Desktop and Pixel
        env:
          REVIEWER_READY_AFTER_ATTEMPT: output/local-private/authenticated-product-acceptance/reviewer-ready-projection
        run: |
          test ! -e "$REVIEWER_READY_AFTER_ATTEMPT"
          npm run test:reviewer-ready:browser
      - name: Retain sanitized Reviewer-ready projection proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-ready-projection-${{ env.RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/local-private/authenticated-product-acceptance/reviewer-ready-projection/
          if-no-files-found: error
          retention-days: 14
      - name: Verify eligible reviewer request diagnostics in Chromium
        env:
          ELIGIBLE_REVIEWER_REQUEST_DIAGNOSTICS_EVIDENCE_DIR: output/local-private/authenticated-product-acceptance/eligible-reviewer-request-diagnostics/attempt-1
          ELIGIBLE_REVIEWER_DIAGNOSTICS_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          ELIGIBLE_REVIEWER_DIAGNOSTICS_RUN_ID: ${{ github.run_id }}
          ELIGIBLE_REVIEWER_DIAGNOSTICS_RUN_ATTEMPT: ${{ github.run_attempt }}
          ELIGIBLE_REVIEWER_DIAGNOSTICS_JOB: connected-browser
        run: |
          test ! -e "$ELIGIBLE_REVIEWER_REQUEST_DIAGNOSTICS_EVIDENCE_DIR"
          node scripts/runEligibleReviewerRequestDiagnosticsBrowser.mjs
      - name: Retain sanitized eligible reviewer request diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eligible-reviewer-request-diagnostics-${{ env.RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/local-private/authenticated-product-acceptance/eligible-reviewer-request-diagnostics/attempt-1/cleanup.json
            output/local-private/authenticated-product-acceptance/eligible-reviewer-request-diagnostics/attempt-1/diagnostic.json
            output/local-private/authenticated-product-acceptance/eligible-reviewer-request-diagnostics/attempt-1/result.json
            output/local-private/authenticated-product-acceptance/eligible-reviewer-request-diagnostics/attempt-1/source-bindings.json
          if-no-files-found: error
          retention-days: 14
      - name: Actual product cases on desktop and Pixel 7
        run: node scripts/runEnterpriseLifecycleAcceptanceBrowser.mjs --authenticated
      - name: Independently verify case observations and cleanup
        run: node scripts/verifyAuthenticatedLocalEvidence.mjs output/acceptance/authenticated-product/local-evidence.json
      - name: Retain sanitized local evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-local-${{ env.RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/acceptance/authenticated-product/local-evidence.json
          if-no-files-found: error
          retention-days: 14

  # Credential-free replay of the protected job's local setup commands.
  preactivation-checkout:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avalaos_exhaustive
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      ACCEPTANCE_WORKFLOW_PATH: .github/workflows/exhaustive-acceptance.yml
      ACCEPTANCE_EXECUTION_KIND: hosted_preview
      ACCEPTANCE_EVIDENCE_ENVIRONMENT: stable-release
      AUTHENTICATED_ACCEPTANCE_EXECUTION_KIND: hosted_authenticated_synthetic
      AUTHENTICATED_ACCEPTANCE_AUTH_KIND: supabase_auth
      AUTHENTICATED_ACCEPTANCE_MODE: full_acceptance
      AUTHENTICATED_ACCEPTANCE_SECRET_BACKEND: supabase_vault
      AVALA_PROVIDER_SECRET_BACKEND: supabase_vault
      PLAYWRIGHT_JSON: artifacts/exhaustive-acceptance/playwright-results.json
      ACCEPTANCE_RESULTS_DIR: acceptance-results
      RETAINED_RESULTS_MANIFEST: /tmp/avalaos-retained-results.json
      ORACLE_RESULTS_MANIFEST: /tmp/avalaos-oracle-results.json
      SUT_RESULTS_MANIFEST: /tmp/avalaos-sut-oracle-results.json
      SERVER_RESULTS_MANIFEST: /tmp/avalaos-server-results.json
      AUTHENTICATED_RESULTS_MANIFEST: /tmp/authenticated-results.json
      AUTHENTICATED_CONTROLLER_BINDING: /tmp/authenticated-controller-binding.json
      NETLIFY_DEPLOY_ID: aaaaaaaaaaaaaaaaaaaaaaaa
      HOSTED_PILOT_URL: https://preactivation.invalid
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies and verify initial checkout
        run: |-
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
          npm ci
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
        shell: bash
      - name: Validate catalogs, evidence and hosted contracts
        env:
          ACCEPTANCE_EXECUTION_KIND: hosted_preview
          AUTHENTICATED_ACCEPTANCE_EXECUTION_KIND: hosted_authenticated_synthetic
          AUTHENTICATED_ACCEPTANCE_FRONTEND_KIND: netlify
          AUTHENTICATED_ACCEPTANCE_BUILD_DIGEST: ''
        run: |-
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
          npm run test:acceptance:catalog
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
          npm run test:authenticated-product:source
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
          node scripts/runExhaustiveAcceptanceReport.test.mjs
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
          node scripts/exhaustiveAcceptanceEvidence.test.mjs
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
          node scripts/hostedSandboxAcceptanceEvidence.test.mjs
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
          node scripts/produceExhaustiveServerEvidence.test.mjs
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
          node scripts/authenticatedHostedWorkflowContract.test.mjs
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
          node --test scripts/localAcceptanceBuild.test.mjs scripts/localRealBackendAcceptanceMigration.test.mjs
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
          node --test scripts/runPr1gBridgeTempCleanup.test.mjs
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
          npm run test:hosted-evidence-family-attestations
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
          npm run test:acceptance:network-observer
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
          node tests/browser/exhaustiveHostedAcceptanceContract.test.mjs
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
        shell: bash
      - name: Run exact-run retained server-authority suites
        env:
          TRUST_ACCEPTANCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_exhaustive
          APPLICATION_PORTFOLIO_ACCEPTANCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_exhaustive
          ASSESS_V2_ACCEPTANCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_exhaustive
          STUDIO_ACCEPTANCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_exhaustive
          LEGACY_DELIVERY_ACCEPTANCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_exhaustive
          GOVERN_ACCEPTANCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_exhaustive
          ENTERPRISE_INTELLIGENCE_ACCEPTANCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_exhaustive
        run: |-
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
          node scripts/runExhaustiveRetainedSuites.mjs
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
        shell: bash
      - name: Run independent assessment oracle against production scoring
        run: |-
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
          node scripts/runAssessV1AcceptanceOracle.mjs
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
        shell: bash
      - name: Run same-run disposable PostgreSQL server evidence
        env:
          PILOT_OPERATIONS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_exhaustive
          CANDIDATE_SHA: ${{ env.RELEASE_SHA }}
        run: |-
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
          npm run test:migrations:pilot-operations:postgres
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
          node scripts/produceExhaustiveServerEvidence.mjs
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
        shell: bash
      - name: Validate deterministic public hosted declarations
        env:
          ACCEPTANCE_EXECUTION_KIND: declaration_only
          AUTHENTICATED_ACCEPTANCE_BUILD_DIGEST: ''
          HOSTED_PILOT_URL: ""
          NETLIFY_DEPLOY_ID: ""
          EXPECTED_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          ACCEPTANCE_RELEASE_SHA: ${{ env.RELEASE_SHA }}
        run: |-
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
          npx playwright test --config=playwright.exhaustive-acceptance.config.ts --list --reporter=list
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
        shell: bash
      - name: Install official Chromium
        run: |-
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
          npx playwright install --with-deps chromium
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
        shell: bash
      - name: Verify exact local build in secure loopback browser
        run: |-
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
          node scripts/localAcceptanceBuild.mjs smoke
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
        shell: bash
      - name: Verify original source attestation against loopback multipart
        run: |-
          node scripts/testAuthenticatedSupabaseMultipart.mjs
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
        shell: bash
      - name: Verify real hosted browser bootstrap without credentials
        run: |-
          node scripts/testAuthenticatedHostedBootstrap.mjs
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
        shell: bash
      - name: Verify pre-sign-in tracking across two local origins
        run: |-
          node scripts/testAuthenticatedHostedPreauthTracking.mjs
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
        shell: bash
      - name: Verify actual application sign-in entry without credentials
        run: |-
          node scripts/testAuthenticatedHostedSignInEntry.mjs
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
        shell: bash
      - name: Verify completed process-read failure states
        run: |-
          node scripts/testAuthenticatedHostedSignInEntry.mjs --process-read-state
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
        shell: bash
      - name: Verify scoped navigation while unrelated Delivery reads are pending
        run: |-
          node scripts/testAuthenticatedHostedSignInEntry.mjs --scoped-navigation
          node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }
        shell: bash
      - name: Retain scoped navigation preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-scoped-navigation-${{ env.RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/local-private/authenticated-product-acceptance/scoped-navigation-corrected.jsonl
          if-no-files-found: error
          retention-days: 14
      - name: Verify final preactivation checkout
        if: always()
        shell: bash
        run: node scripts/authenticatedHostedCheckout.mjs || { git status --porcelain=v1 --untracked-files=all; exit 1; }

  hosted-authenticated:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: hosted-nonproduction-pilot
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avalaos_exhaustive
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ACCEPTANCE_WORKFLOW_PATH: .github/workflows/exhaustive-acceptance.yml
      ACCEPTANCE_EXECUTION_KIND: ${{ inputs.frontend_kind == 'local_build' && 'local_real_backend' || 'hosted_preview' }}
      ACCEPTANCE_EVIDENCE_ENVIRONMENT: stable-release
      AUTHENTICATED_ACCEPTANCE_EXECUTION_KIND: ${{ inputs.frontend_kind == 'local_build' && 'local_real_backend_authenticated' || 'hosted_authenticated_synthetic' }}
      AUTHENTICATED_ACCEPTANCE_FRONTEND_KIND: ${{ inputs.frontend_kind }}
      AUTHENTICATED_ACCEPTANCE_AUTH_KIND: supabase_auth
      AUTHENTICATED_ACCEPTANCE_MODE: ${{ inputs.acceptance_mode }}
      AUTHENTICATED_ACCEPTANCE_SECRET_BACKEND: supabase_vault
      AVALA_PROVIDER_SECRET_BACKEND: supabase_vault
      RELEASE_SHA: ${{ inputs.release_sha }}
      NETLIFY_DEPLOY_ID: ${{ inputs.netlify_deploy_id }}
      HOSTED_PILOT_URL: ${{ inputs.frontend_kind == 'local_build' && 'http://127.0.0.1:4173' || inputs.hosted_url }}
      PLAYWRIGHT_JSON: artifacts/exhaustive-acceptance/playwright-results.json
      ACCEPTANCE_RESULTS_DIR: acceptance-results
      RETAINED_RESULTS_MANIFEST: /tmp/avalaos-retained-results.json
      ORACLE_RESULTS_MANIFEST: /tmp/avalaos-oracle-results.json
      SUT_RESULTS_MANIFEST: /tmp/avalaos-sut-oracle-results.json
      SERVER_RESULTS_MANIFEST: /tmp/avalaos-server-results.json
      AUTHENTICATED_RESULTS_MANIFEST: /tmp/authenticated-results.json
      AUTHENTICATED_CONTROLLER_BINDING: /tmp/authenticated-controller-binding.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Fail closed on exact protected request
        shell: bash
        env:
          EXPECTED_PROJECT_REF: ${{ inputs.expected_project_ref }}
          TARGET_PUBLIC_DIGEST: ${{ inputs.target_public_digest }}
          BACKEND_DIGEST: ${{ inputs.backend_digest }}
          MIGRATION_VERSION: ${{ inputs.migration_version }}
          MIGRATION_DIGEST: ${{ inputs.migration_digest }}
          EXERCISE_DIGEST: ${{ inputs.exercise_digest }}
          BASELINE_DIGEST: ${{ inputs.baseline_digest }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if test "${{ inputs.frontend_kind }}" = local_build; then
            test -z "$NETLIFY_DEPLOY_ID"
            test "$HOSTED_PILOT_URL" = "http://127.0.0.1:4173"
          else
            [[ "$NETLIFY_DEPLOY_ID" =~ ^[0-9a-f]{24}$ ]]
            test "$HOSTED_PILOT_URL" = "https://avalaos-pilot.netlify.app"
          fi
          [[ "$EXPECTED_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
          [[ "$TARGET_PUBLIC_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$MIGRATION_VERSION" =~ ^20[0-9]{12}$ ]]
          [[ "$MIGRATION_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$EXERCISE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$BASELINE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$AUTHENTICATED_ACCEPTANCE_MODE" =~ ^(full_acceptance|v2_primary_prefix_diagnostic|reviewer_selection_diagnostic|govern_studio_diagnostic)$ ]]
          if test "$AUTHENTICATED_ACCEPTANCE_MODE" = reviewer_selection_diagnostic \
            || test "$AUTHENTICATED_ACCEPTANCE_MODE" = govern_studio_diagnostic; then
            test "${{ inputs.frontend_kind }}" = local_build
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate catalogs, evidence and hosted contracts
        # Fixture contracts own their identity; the real local binding is built below.
        env:
          ACCEPTANCE_EXECUTION_KIND: hosted_preview
          AUTHENTICATED_ACCEPTANCE_EXECUTION_KIND: hosted_authenticated_synthetic
          AUTHENTICATED_ACCEPTANCE_FRONTEND_KIND: netlify
          AUTHENTICATED_ACCEPTANCE_BUILD_DIGEST: ''
        run: |
          npm run test:acceptance:catalog
          npm run test:authenticated-product:source
          node scripts/runExhaustiveAcceptanceReport.test.mjs
          node scripts/exhaustiveAcceptanceEvidence.test.mjs
          node scripts/hostedSandboxAcceptanceEvidence.test.mjs
          node scripts/produceExhaustiveServerEvidence.test.mjs
          node scripts/authenticatedHostedWorkflowContract.test.mjs
          node --test scripts/localAcceptanceBuild.test.mjs scripts/localRealBackendAcceptanceMigration.test.mjs
          node --test scripts/runPr1gBridgeTempCleanup.test.mjs
          npm run test:hosted-evidence-family-attestations
          npm run test:acceptance:network-observer
          node tests/browser/exhaustiveHostedAcceptanceContract.test.mjs
      - name: Run exact-run retained server-authority suites
        id: retained
        if: inputs.acceptance_mode == 'full_acceptance'
        continue-on-error: true
        env:
          TRUST_ACCEPTANCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_exhaustive
          APPLICATION_PORTFOLIO_ACCEPTANCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_exhaustive
          ASSESS_V2_ACCEPTANCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_exhaustive
          STUDIO_ACCEPTANCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_exhaustive
          LEGACY_DELIVERY_ACCEPTANCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_exhaustive
          GOVERN_ACCEPTANCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_exhaustive
          ENTERPRISE_INTELLIGENCE_ACCEPTANCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_exhaustive
        run: node scripts/runExhaustiveRetainedSuites.mjs
      - name: Run independent assessment oracle against production scoring
        id: oracle
        if: inputs.acceptance_mode == 'full_acceptance'
        continue-on-error: true
        run: node scripts/runAssessV1AcceptanceOracle.mjs
      - name: Run same-run disposable PostgreSQL server evidence
        id: server
        if: inputs.acceptance_mode == 'full_acceptance'
        continue-on-error: true
        env:
          PILOT_OPERATIONS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_exhaustive
          CANDIDATE_SHA: ${{ inputs.release_sha }}
        run: |
          npm run test:migrations:pilot-operations:postgres
          node scripts/produceExhaustiveServerEvidence.mjs
      - name: Build exact local acceptance frontend
        if: inputs.frontend_kind == 'local_build'
        shell: bash
        env:
          AUTHENTICATED_ACCEPTANCE_SUPABASE_URL: ${{ vars.AUTHENTICATED_ACCEPTANCE_SUPABASE_URL }}
          AUTHENTICATED_ACCEPTANCE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AUTHENTICATED_ACCEPTANCE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/localAcceptanceBuild.mjs build >> "$GITHUB_ENV"
      - name: Prepare authenticated exact source bindings
        env:
          AUTHENTICATED_ACCEPTANCE_FRONTEND_KIND: ${{ inputs.frontend_kind }}
          AUTHENTICATED_ACCEPTANCE_EXPECTED_PROJECT_REF: ${{ inputs.expected_project_ref }}
          AUTHENTICATED_ACCEPTANCE_TARGET_PUBLIC_DIGEST: ${{ inputs.target_public_digest }}
          AUTHENTICATED_ACCEPTANCE_BACKEND_DIGEST: ${{ inputs.backend_digest }}
          AUTHENTICATED_ACCEPTANCE_MIGRATION_VERSION: ${{ inputs.migration_version }}
          AUTHENTICATED_ACCEPTANCE_MIGRATION_DIGEST: ${{ inputs.migration_digest }}
          AUTHENTICATED_ACCEPTANCE_EXERCISE_DIGEST: ${{ inputs.frontend_kind == 'netlify' && inputs.exercise_digest || '' }}
          AUTHENTICATED_ACCEPTANCE_APPROVED_EXERCISE_DIGEST: ${{ inputs.frontend_kind == 'local_build' && inputs.exercise_digest || '' }}
          AUTHENTICATED_ACCEPTANCE_BASELINE_DIGEST: ${{ inputs.baseline_digest }}
        run: node scripts/prepareAuthenticatedHostedEnvironment.mjs >> "$GITHUB_ENV"
      - name: Validate deterministic public hosted declarations
        env:
          ACCEPTANCE_EXECUTION_KIND: declaration_only
          AUTHENTICATED_ACCEPTANCE_BUILD_DIGEST: ''
          HOSTED_PILOT_URL: ''
          NETLIFY_DEPLOY_ID: ''
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          ACCEPTANCE_RELEASE_SHA: ${{ inputs.release_sha }}
        run: npx playwright test --config=playwright.exhaustive-acceptance.config.ts --list --reporter=list
      - name: Install official Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify exact frontend identity
        id: deployment
        continue-on-error: true
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          EXPECTED_NETLIFY_DEPLOY_ID: ${{ inputs.netlify_deploy_id }}
        shell: bash
        run: |
          set -euo pipefail
          if test "${{ inputs.frontend_kind }}" = local_build; then
            RUNNER_TRACKING_ID= node scripts/localAcceptanceBuild.mjs serve --workspace "$LOCAL_ACCEPTANCE_BUILD_ROOT" >/dev/null 2>&1 &
            for attempt in $(seq 1 30); do
              curl --fail --silent --show-error "$HOSTED_PILOT_URL/" >/dev/null && break
              test "$attempt" -lt 30
              sleep 1
            done
            node scripts/localAcceptanceBuild.mjs verify --workspace "$LOCAL_ACCEPTANCE_BUILD_ROOT" \
              --evidence /tmp/local-acceptance-build-proof.json --phase before
          else
            node scripts/verify-hosted-deployment.mjs
          fi
      - name: Run real-auth hosted journeys and independently observed server frames
        id: authenticated
        if: steps.deployment.outcome == 'success'
        continue-on-error: true
        env:
          AUTHENTICATED_ACCEPTANCE_SUPABASE_URL: ${{ vars.AUTHENTICATED_ACCEPTANCE_SUPABASE_URL }}
          AUTHENTICATED_ACCEPTANCE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AUTHENTICATED_ACCEPTANCE_SUPABASE_SERVICE_ROLE_KEY }}
          AUTHENTICATED_ACCEPTANCE_SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.AUTHENTICATED_ACCEPTANCE_SUPABASE_MANAGEMENT_TOKEN }}
          AUTHENTICATED_ACCEPTANCE_DATABASE_URL: ${{ secrets.AUTHENTICATED_ACCEPTANCE_DATABASE_URL }}
          AUTHENTICATED_ACCEPTANCE_SCOPE: ${{ secrets.AUTHENTICATED_ACCEPTANCE_SCOPE }}
        run: node scripts/runAuthenticatedHostedAcceptance.mjs
      - name: Reconstruct authenticated evidence from browser actions and raw server frames
        id: authenticated_evidence
        if: inputs.acceptance_mode == 'full_acceptance' && steps.authenticated.outcome == 'success'
        continue-on-error: true
        run: node scripts/produceAuthenticatedHostedEvidence.mjs
      - name: Run all 18 public Sandbox cases on both browser projects
        id: hosted
        if: always() && inputs.acceptance_mode == 'full_acceptance' && steps.deployment.outcome == 'success'
        continue-on-error: true
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          ACCEPTANCE_RELEASE_SHA: ${{ inputs.release_sha }}
        run: npx playwright test --config=playwright.exhaustive-acceptance.config.ts --workers=1
      - name: Verify local frontend bytes after all browser journeys
        id: frontend_final
        if: always() && inputs.frontend_kind == 'local_build' && steps.deployment.outcome == 'success'
        continue-on-error: true
        run: >-
          node scripts/localAcceptanceBuild.mjs verify --workspace "$LOCAL_ACCEPTANCE_BUILD_ROOT"
          --evidence /tmp/local-acceptance-build-proof.json --phase after
      - name: Stop and remove owned local frontend
        id: frontend_cleanup
        if: always() && inputs.frontend_kind == 'local_build'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/localAcceptanceBuild.mjs stop --workspace "$LOCAL_ACCEPTANCE_BUILD_ROOT"
          node scripts/localAcceptanceBuild.mjs cleanup --workspace "$LOCAL_ACCEPTANCE_BUILD_ROOT"
      - name: Stage sanitized same-run manifests
        if: always() && inputs.acceptance_mode == 'full_acceptance'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-results
          test -f "$RETAINED_RESULTS_MANIFEST" && cp "$RETAINED_RESULTS_MANIFEST" acceptance-results/retained-suite-results.json || true
          test -f "$ORACLE_RESULTS_MANIFEST" && cp "$ORACLE_RESULTS_MANIFEST" acceptance-results/oracle-results.json || true
          test -f "$SUT_RESULTS_MANIFEST" && cp "$SUT_RESULTS_MANIFEST" acceptance-results/sut-oracle-results.json || true
          test -f "$SERVER_RESULTS_MANIFEST" && cp "$SERVER_RESULTS_MANIFEST" acceptance-results/server-results.json || true
          test -f "$AUTHENTICATED_RESULTS_MANIFEST" && cp "$AUTHENTICATED_RESULTS_MANIFEST" acceptance-results/authenticated-results.json || true
          test -f "$AUTHENTICATED_CONTROLLER_BINDING" && cp "$AUTHENTICATED_CONTROLLER_BINDING" acceptance-results/authenticated-controller-binding.json || true
          test -f /tmp/authenticated-hosted-diagnostic.json && cp /tmp/authenticated-hosted-diagnostic.json acceptance-results/authenticated-hosted-diagnostic.json || true
          test -f /tmp/local-acceptance-build-proof.json && cp /tmp/local-acceptance-build-proof.json acceptance-results/local-acceptance-build-proof.json || true
      - name: Stage sanitized V2 primary-prefix diagnostic
        if: always() && inputs.acceptance_mode == 'v2_primary_prefix_diagnostic'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic-results
          test -f /tmp/authenticated-v2-primary-prefix-diagnostic.json && cp /tmp/authenticated-v2-primary-prefix-diagnostic.json diagnostic-results/authenticated-v2-primary-prefix-diagnostic.json || true
          test -f /tmp/authenticated-hosted-diagnostic.json && cp /tmp/authenticated-hosted-diagnostic.json diagnostic-results/authenticated-hosted-diagnostic.json || true
          test -f /tmp/local-acceptance-build-proof.json && cp /tmp/local-acceptance-build-proof.json diagnostic-results/local-acceptance-build-proof.json || true
      - name: Stage sanitized reviewer-selection diagnostic
        if: always() && inputs.acceptance_mode == 'reviewer_selection_diagnostic'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reviewer-diagnostic-results
          test -f /tmp/authenticated-reviewer-selection-diagnostic.json && cp /tmp/authenticated-reviewer-selection-diagnostic.json reviewer-diagnostic-results/authenticated-reviewer-selection-diagnostic.json || true
          test -f /tmp/authenticated-hosted-diagnostic.json && cp /tmp/authenticated-hosted-diagnostic.json reviewer-diagnostic-results/authenticated-hosted-diagnostic.json || true
          test -f /tmp/local-acceptance-build-proof.json && cp /tmp/local-acceptance-build-proof.json reviewer-diagnostic-results/local-acceptance-build-proof.json || true
      - name: Stage sanitized Govern and Studio diagnostic
        if: always() && inputs.acceptance_mode == 'govern_studio_diagnostic'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p govern-studio-diagnostic-results
          test -f /tmp/authenticated-govern-studio-diagnostic.json && cp /tmp/authenticated-govern-studio-diagnostic.json govern-studio-diagnostic-results/authenticated-govern-studio-diagnostic.json || true
          test -f /tmp/authenticated-hosted-diagnostic.json && cp /tmp/authenticated-hosted-diagnostic.json govern-studio-diagnostic-results/authenticated-hosted-diagnostic.json || true
          test -f /tmp/local-acceptance-build-proof.json && cp /tmp/local-acceptance-build-proof.json govern-studio-diagnostic-results/local-acceptance-build-proof.json || true
      - name: Generate unified 108-case report
        id: report
        if: always() && inputs.acceptance_mode == 'full_acceptance'
        continue-on-error: true
        env:
          ACCEPTANCE_EXECUTION_DISPOSITION: ${{ steps.deployment.outcome == 'success' && 'EXECUTED' || 'BLOCKED' }}
        run: node scripts/runExhaustiveAcceptanceReport.mjs
      - name: Upload sanitized same-run acceptance evidence
        if: always() && inputs.acceptance_mode == 'full_acceptance'
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-exhaustive-${{ inputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            tests/acceptance/catalog/
            tests/acceptance/inventory.json
            tests/acceptance/execution-bindings.json
            tests/acceptance/source-provenance.json
            tests/acceptance/proof-owner-registry.json
            tests/acceptance/proof-owner-source-contracts.mjs
            acceptance-results/
            artifacts/exhaustive-acceptance/
      - name: Upload sanitized V2 primary-prefix diagnostic
        if: always() && inputs.acceptance_mode == 'v2_primary_prefix_diagnostic'
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-v2-primary-prefix-diagnostic-${{ inputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: diagnostic-results/
      - name: Upload sanitized reviewer-selection diagnostic
        if: always() && inputs.acceptance_mode == 'reviewer_selection_diagnostic'
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-reviewer-selection-diagnostic-${{ inputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: reviewer-diagnostic-results/
      - name: Upload sanitized Govern and Studio diagnostic
        if: always() && inputs.acceptance_mode == 'govern_studio_diagnostic'
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-govern-studio-diagnostic-${{ inputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: govern-studio-diagnostic-results/
      - name: Enforce one-run complete acceptance gates
        if: always() && inputs.acceptance_mode == 'full_acceptance'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'Authenticated browser outcome: ${{ steps.authenticated.outcome }}' \
            'Authenticated evidence outcome: ${{ steps.authenticated_evidence.outcome }}' \
            'Public browser outcome: ${{ steps.hosted.outcome }}' \
            'Combined report outcome: ${{ steps.report.outcome }}' | tee -a "$GITHUB_STEP_SUMMARY"
          test "${{ steps.retained.outcome }}" = success
          test "${{ steps.oracle.outcome }}" = success
          test "${{ steps.server.outcome }}" = success
          test "${{ steps.deployment.outcome }}" = success
          if test "${{ inputs.frontend_kind }}" = local_build; then
            test "${{ steps.frontend_final.outcome }}" = success
            test "${{ steps.frontend_cleanup.outcome }}" = success
          fi
          test "${{ steps.authenticated.outcome }}" = success
          test "${{ steps.authenticated_evidence.outcome }}" = success
          test "${{ steps.hosted.outcome }}" = success
          test "${{ steps.report.outcome }}" = success
          test -f "$AUTHENTICATED_RESULTS_MANIFEST"
          test -f "$AUTHENTICATED_CONTROLLER_BINDING"
      - name: Enforce V2 primary-prefix diagnostic gate
        if: always() && inputs.acceptance_mode == 'v2_primary_prefix_diagnostic'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'Authenticated diagnostic outcome: ${{ steps.authenticated.outcome }}' \
            'Deployment outcome: ${{ steps.deployment.outcome }}' | tee -a "$GITHUB_STEP_SUMMARY"
          test "${{ steps.deployment.outcome }}" = success
          if test "${{ inputs.frontend_kind }}" = local_build; then
            test "${{ steps.frontend_final.outcome }}" = success
            test "${{ steps.frontend_cleanup.outcome }}" = success
          fi
          test "${{ steps.authenticated.outcome }}" = success
          test -f /tmp/authenticated-v2-primary-prefix-diagnostic.json
          node -e 'const fs=require("node:fs");const value=JSON.parse(fs.readFileSync("/tmp/authenticated-v2-primary-prefix-diagnostic.json","utf8"));if(value.schemaVersion!=="authenticated-v2-primary-prefix-diagnostic-v2"||value.mode!=="v2_primary_prefix_diagnostic"||value.diagnosticCompleted!==true||value.acceptancePromoted!==false||value.cleanup?.status!=="verified")process.exit(1)'
      - name: Enforce reviewer-selection diagnostic gate
        if: always() && inputs.acceptance_mode == 'reviewer_selection_diagnostic'
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_SOURCE_DIGEST: ${{ env.AUTHENTICATED_ACCEPTANCE_SOURCE_DIGEST }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            'Authenticated reviewer diagnostic outcome: ${{ steps.authenticated.outcome }}' \
            'Deployment outcome: ${{ steps.deployment.outcome }}' | tee -a "$GITHUB_STEP_SUMMARY"
          test "${{ inputs.frontend_kind }}" = local_build
          test "${{ steps.deployment.outcome }}" = success
          test "${{ steps.frontend_final.outcome }}" = success
          test "${{ steps.frontend_cleanup.outcome }}" = success
          test "${{ steps.authenticated.outcome }}" = success
          test -f /tmp/authenticated-reviewer-selection-diagnostic.json
          node --input-type=module -e 'import fs from "node:fs";import assert from "node:assert/strict";import {canonicalDigest} from "./scripts/assessV1OracleEvidence.mjs";import {validateAuthenticatedReviewerSelectionDiagnostic} from "./scripts/authenticatedReviewerSelectionDiagnostic.mjs";const value=validateAuthenticatedReviewerSelectionDiagnostic(JSON.parse(fs.readFileSync("/tmp/authenticated-reviewer-selection-diagnostic.json","utf8")));const provenance=JSON.parse(fs.readFileSync("./tests/acceptance/source-provenance.json","utf8"));const canonicalSourceDigest=canonicalDigest(provenance.sourceDigests);assert.deepEqual(value.source,{releaseSha:process.env.EXPECTED_RELEASE_SHA,runId:process.env.EXPECTED_RUN_ID,attempt:process.env.EXPECTED_RUN_ATTEMPT,sourceDigest:process.env.EXPECTED_SOURCE_DIGEST});assert.equal(value.source.sourceDigest,canonicalSourceDigest)'
      - name: Enforce Govern and Studio diagnostic gate
        if: always() && inputs.acceptance_mode == 'govern_studio_diagnostic'
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_SOURCE_DIGEST: ${{ env.AUTHENTICATED_ACCEPTANCE_SOURCE_DIGEST }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            'Authenticated Govern and Studio diagnostic outcome: ${{ steps.authenticated.outcome }}' \
            'Deployment outcome: ${{ steps.deployment.outcome }}' | tee -a "$GITHUB_STEP_SUMMARY"
          test "${{ inputs.frontend_kind }}" = local_build
          test "${{ steps.deployment.outcome }}" = success
          test "${{ steps.frontend_final.outcome }}" = success
          test "${{ steps.frontend_cleanup.outcome }}" = success
          test "${{ steps.authenticated.outcome }}" = success
          test -f /tmp/authenticated-govern-studio-diagnostic.json
          node --input-type=module -e 'import fs from "node:fs";import assert from "node:assert/strict";import {canonicalDigest} from "./scripts/assessV1OracleEvidence.mjs";import {validateAuthenticatedGovernStudioDiagnostic} from "./scripts/authenticatedGovernStudioDiagnostic.mjs";const value=validateAuthenticatedGovernStudioDiagnostic(JSON.parse(fs.readFileSync("/tmp/authenticated-govern-studio-diagnostic.json","utf8")));const provenance=JSON.parse(fs.readFileSync("./tests/acceptance/source-provenance.json","utf8"));const canonicalSourceDigest=canonicalDigest(provenance.sourceDigests);assert.deepEqual(value.source,{releaseSha:process.env.EXPECTED_RELEASE_SHA,runId:process.env.EXPECTED_RUN_ID,attempt:process.env.EXPECTED_RUN_ATTEMPT,sourceDigest:process.env.EXPECTED_SOURCE_DIGEST});assert.equal(value.source.sourceDigest,canonicalSourceDigest);assert.equal(value.acceptancePromoted,false);assert.equal(value.fullAcceptanceExecuted,false);assert.equal(value.providerGenerationExecuted,false);assert.equal(value.cleanup.status,"verified")'
