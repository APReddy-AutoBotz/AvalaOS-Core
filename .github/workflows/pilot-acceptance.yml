name: Pilot Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PILOT_SYNTHETIC_SECRET: test-only-not-a-live-credential

jobs:
  source-and-journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.CANDIDATE_SHA }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run test:pilot-acceptance
      - name: Accepted V1 decision, source, portfolio, and artifact authority
        run: |
          npm run test:pr1b
          npm run test:pr1c
          npm run test:pr1d
          npm run test:pr1e
          npm run test:pr1f
          npm run test:pr1g
          npm run test:pr1g-coverage
          npm run test:studio-artifacts
          npm run test:studio-artifacts-coverage
          npm run test:studio-private-artifacts
          npm run test:studio-private-artifacts-coverage
          npm run test:enterprise-intelligence
          npm run test:enterprise-intelligence-provider
      - run: node scripts/runTrustAssuranceTest.mjs
      - name: Trust command, query, HTTP, and boundary authority
        run: |
          node scripts/runEdgeTypeScriptTest.mjs types.ts services/trustCenterModel.ts services/trustAssurance/contracts.ts services/trustAssurance/domain.ts supabase/functions/_shared/tenantAuthority.ts supabase/functions/_shared/trustAssuranceCommand.ts supabase/functions/_shared/trustAssuranceCommand.test.ts
          node scripts/runEdgeTypeScriptTest.mjs types.ts supabase/functions/_shared/trustAssuranceQuery.ts supabase/functions/_shared/trustAssuranceQuery.test.ts
          node scripts/runEdgeTypeScriptTest.mjs types.ts supabase/functions/_shared/http.ts supabase/functions/_shared/trustAssuranceHttp.ts supabase/functions/_shared/trustAssuranceHttp.test.ts
          node scripts/checkTrustAssuranceBoundaries.mjs
      - run: npm run test:ai-boundary-static && npm run test:secret-hygiene && npm run test:scoring
      - run: npm run typecheck && npm run typecheck:edge && npm run build && git diff --check

  disposable-postgresql-16:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: avalaos_pilot_synthetic}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.CANDIDATE_SHA }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Fresh, accepted-main upgrade, RLS, receipt/effect, and recovery contracts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_pilot_synthetic
          PR1B_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_pilot_synthetic
          PR1C_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_pilot_synthetic
          PR1E_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_pilot_synthetic
          STUDIO_ARTIFACT_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_pilot_synthetic
          STUDIO_PRIVATE_ARTIFACT_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_pilot_synthetic
          ENTERPRISE_INTELLIGENCE_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_pilot_synthetic
        run: |
          npm run test:migrations:pr1b
          npm run test:migrations:pr1c
          npm run test:migrations:pr1d
          npm run test:migrations:pr1e
          npm run test:migrations:pr1f
          npm run test:migrations:pr1g
          npm run test:migrations:studio-artifacts
          npm run test:migrations:enterprise-intelligence:postgres
          npm run test:migrations:studio-private-artifacts
          node scripts/testTrustAssurancePostgres.mjs
      - name: Prove teardown is independent of runner state
        if: always()
        run: dropdb --if-exists -h 127.0.0.1 -U postgres avalaos_pilot_synthetic
        env: {PGPASSWORD: postgres}

  browser-desktop-pixel7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.CANDIDATE_SHA }}'}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Accepted canonical projections, accessibility, responsive and performance budgets
        run: |
          npm run test:browser:pr1c
          npm run test:browser:pr1d
          npm run test:browser:pr1e
          npm run test:browser:pr1f
          npm run test:browser:pr1g
          npm run test:browser:studio-artifacts
          npm run test:browser:enterprise-intelligence
          npm run test:browser:studio-private-artifacts
          npx vite build --config vite.trust-assurance.config.ts
          npx playwright test --config=playwright.trust-assurance.config.ts

  evidence-manifest:
    if: always()
    needs: [source-and-journey, disposable-postgresql-16, browser-desktop-pixel7]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.CANDIDATE_SHA }}'}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Generate exact-head pilot gate results
        env:
          PILOT_ACCEPTANCE_HEAD: ${{ env.CANDIDATE_SHA }}
          SOURCE_RESULT: ${{ needs.source-and-journey.result }}
          POSTGRES_RESULT: ${{ needs.disposable-postgresql-16.result }}
          BROWSER_RESULT: ${{ needs.browser-desktop-pixel7.result }}
        run: |
          node - <<'NODE' >> "$GITHUB_ENV"
          const source = process.env.SOURCE_RESULT === 'success';
          const pg = process.env.POSTGRES_RESULT === 'success';
          const browser = process.env.BROWSER_RESULT === 'success';
          const pass = (ok, command) => ({result: ok ? 'passed' : 'failed', command, runId: process.env.GITHUB_RUN_ID});
          const result = {
            'canonical-journey': pass(source, 'npm run test:pilot-acceptance-model'),
            'tenant-adversarial': pass(source && pg, 'pilot model + PostgreSQL authority suites'),
            'recovery-rollback': pass(source && pg, 'pilot drills + retained reconciliation suites'),
            'studio-private-artifacts': pass(source && pg && browser, 'retained Studio PR B suites'),
            'postgres-fresh-upgrade': pass(pg, 'ordered disposable PostgreSQL 16 migration suites'),
            'browser-desktop': pass(browser, 'retained Chromium desktop projects'),
            'browser-pixel7': pass(browser, 'retained Pixel 7 projects'),
            'accessibility-performance': pass(browser, 'retained Playwright axe/viewport/budget assertions'),
            'security-hygiene': pass(source, 'AI boundary and secret hygiene')
          };
          process.stdout.write(`PILOT_ACCEPTANCE_GATE_RESULTS=${JSON.stringify(result)}\n`);
          NODE
      - name: Verify exact-head fail-closed pilot manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PILOT_ACCEPTANCE_HEAD: ${{ env.CANDIDATE_SHA }}
        run: npm run verify:pilot-acceptance:authoritative
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-acceptance-${{ env.CANDIDATE_SHA }}
          path: artifacts/pilot-acceptance/manifest.json
          if-no-files-found: error
          retention-days: 14
