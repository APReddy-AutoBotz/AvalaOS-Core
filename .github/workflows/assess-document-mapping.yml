name: Native Assess document mapping

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assess-document-mapping-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-local-feature:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Local campaign budget adversarial tests (no credentials or provider calls)
        run: npm run test:synthetic-ai-budget
      - name: Server campaign permit adversarial tests (mocked RPC and provider only)
        run: node scripts/runEnterpriseIntelligenceTest.mjs supabase/functions/deno.d.ts supabase/functions/_shared/syntheticAiCampaign.ts supabase/functions/_shared/syntheticAiCampaign.test.ts
      - name: Studio template and citation-reference contract regressions (mocked providers)
        run: npm run test:studio-output-contract
      - run: npx playwright install --with-deps chromium
      - name: Cache exact disposable projection RPC test images
        run: |
          docker pull postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          docker pull public.ecr.aws/supabase/postgrest@sha256:bca3f86f69d8ef7aa1e5ee65e66ce9a20c6c147be637517a7be8399e102901d1
      - name: Exact harness and authority contracts, typed mapping, hostile files, API mocks and coverage
        run: node scripts/runAssessImportValidation.mjs feature
      - name: Disposable PostgreSQL 16 application and tenant boundaries
        env:
          ASSESS_DOCUMENT_MAPPING_POSTGRES_ADMIN_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: node scripts/runAssessImportValidation.mjs postgres
      - name: Retained Assess, transcript, Enterprise and provider-mock regressions
        run: node scripts/runAssessImportValidation.mjs regression
      - name: Actual Assess route, Desktop and Pixel, synthetic transport only
        run: node scripts/runAssessImportValidation.mjs browser
      - name: Type, scoring, build and static security regressions
        run: node scripts/runAssessImportValidation.mjs static
      - run: npm audit --audit-level=moderate
      - run: git diff --check
      - name: Retain feature-owned local proof, not hosted or real-provider acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assess-document-mapping-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/assess-import/
            output/playwright/assess-import/
          if-no-files-found: error
          retention-days: 14
