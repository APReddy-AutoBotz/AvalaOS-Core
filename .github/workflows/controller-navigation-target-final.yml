name: Controller Navigation Target Finalizer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  finalizer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e5a628f288534fa1d1d8d0d82057f9fecfe3167c
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build exact Sol target
        env:
          GH_TOKEN: ${{ github.token }}
          SOL_RESULT: controller/navigation-durability-249-sol-result
          PATCH_BLOB: ec6bf087a97732cb1f23e9f7d2256488e796c76a
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${SOL_RESULT}:${SOL_RESULT}"
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${PATCH_BLOB}" --jq .content | tr -d '\n' | base64 -d > /tmp/nav.patch

          for path in \
            .github/workflows/preview-exhaustive-browser-qa.yml \
            playwright.config.ts \
            playwright.controller-navigation-history.config.ts \
            playwright.exhaustive-acceptance.config.ts \
            services/productNavigationController.test.ts \
            services/productNavigationController.ts \
            services/productNavigationState.ts; do
            git show "${SOL_RESULT}:${path}" > "$path"
          done

          section_apply() {
            python - "$1" "$2" <<'PY'
          import pathlib, sys
          path, out = sys.argv[1:]
          lines = pathlib.Path('/tmp/nav.patch').read_text().splitlines(keepends=True)
          marker = f'diff --git a/{path} b/{path}'
          start = next(i for i, line in enumerate(lines) if line.rstrip('\n') == marker)
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith('diff --git ')), len(lines))
          pathlib.Path(out).write_text(''.join(lines[start:end]))
          PY
            git apply --check "$2"
            git apply "$2"
          }
          section_apply App.tsx /tmp/app.patch
          section_apply package.json /tmp/package.patch

          node <<'NODE'
          const fs = require('node:fs');
          {
            const p = 'scripts/checkWorkflowYaml.test.mjs';
            let s = fs.readFileSync(p, 'utf8');
            const needle = "\nassert.throws(\n  () => parseWorkflowYaml(`jobs:";
            const block = "const controllerPlaywrightConfig = await readFile('playwright.controller-navigation-history.config.ts', 'utf8');\nassert.match(controllerPlaywrightConfig, /testMatch: 'controllerNavigationHistory\\.spec\\.ts'/u, 'the controller QA config must exclusively own its history specification');\nconst previewQaWorkflow = await readFile('.github/workflows/preview-exhaustive-browser-qa.yml', 'utf8');\nassert.match(previewQaWorkflow, /Wait for exact PR preview[\\s\\S]*playwright\\.controller-navigation-history\\.config\\.ts/u, 'controller history QA must execute only after immutable preview identity binding');\n";
            const i = s.indexOf(needle);
            if (i < 0) throw new Error('workflow anchor missing');
            s = s.slice(0, i) + block + s.slice(i);
            fs.writeFileSync(p, s);
          }
          {
            const p = 'services/viewStatePersistence.test.ts';
            let s = fs.readFileSync(p, 'utf8');
            const before = "  hasProductNavigationSearch,\n  parseProductNavigationSearch,";
            const after = "  hasProductNavigationSearch,\n  isStructurallyValidProductNavigationSearch,\n  parseProductNavigationSearch,";
            if (!s.includes(before)) throw new Error('view import anchor missing');
            s = s.replace(before, after);
            const anchor = "} from './productNavigationState';\n\nconst makeOrganization";
            const block = "} from './productNavigationState';\n\nassert.equal(isStructurallyValidProductNavigationSearch('?view=boards&view=delivery_pack&scope=my_work'), false);\nassert.equal(isStructurallyValidProductNavigationSearch('?view=boards&scope=project&scopeId=project-1&scopeName=One&projectId=project-2'), false);\nassert.equal(isStructurallyValidProductNavigationSearch('?view=workspace&scope=my_work&generationId=one&documentGenerationId=two'), false);\nassert.equal(isStructurallyValidProductNavigationSearch('?view=not-a-view&scope=my_work'), false);\n\nconst makeOrganization";
            if (!s.includes(anchor)) throw new Error('view assertion anchor missing');
            fs.writeFileSync(p, s.replace(anchor, block));
          }
          {
            const p = 'docs/quality/ai-boundary-static-scan-allowlist.json';
            const d = JSON.parse(fs.readFileSync(p, 'utf8'));
            const e = {pattern:'local'+'Storage',path:'tests/browser/controllerNavigationHistory.spec.ts',lines:[35,43],reason:'test/control documentation',futureAction:'Keep bounded inspection of non-secret persisted navigation evidence confined to controller browser QA; do not treat browser storage as runtime authority.'};
            if (!d.entries.some(x => x.pattern === e.pattern && x.path === e.path)) d.entries.push(e);
            fs.writeFileSync(p, JSON.stringify(d, null, 2) + '\n');
          }
          NODE

          check() { actual="$(git hash-object "$1")"; echo "$1 $actual"; case "$actual" in "$2"*) ;; *) exit 1;; esac; }
          check .github/workflows/preview-exhaustive-browser-qa.yml 01920e1
          check App.tsx 6fe17b4
          check package.json af280b2
          check playwright.config.ts 866a02a
          check playwright.controller-navigation-history.config.ts 6b4b0af
          check playwright.exhaustive-acceptance.config.ts 36c2b60
          check scripts/checkWorkflowYaml.test.mjs d605ba9
          check services/productNavigationController.test.ts 291e783
          check services/productNavigationController.ts 0242432
          check services/productNavigationState.ts 563195a
          check services/viewStatePersistence.test.ts 213931b

          npm run test:workflow-yaml
          npm run test:product-navigation-controller
          npm run test:view-state-persistence
          npm run test:ai-boundary-static
          npm run typecheck
          git diff --check

          mkdir -p artifacts/controller-navigation-target
          for path in \
            .github/workflows/preview-exhaustive-browser-qa.yml App.tsx package.json playwright.config.ts \
            playwright.controller-navigation-history.config.ts playwright.exhaustive-acceptance.config.ts \
            scripts/checkWorkflowYaml.test.mjs services/productNavigationController.test.ts \
            services/productNavigationController.ts services/productNavigationState.ts \
            services/viewStatePersistence.test.ts docs/quality/ai-boundary-static-scan-allowlist.json; do
            echo "$(git hash-object "$path") $path"
          done > artifacts/controller-navigation-target/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: controller-navigation-target-final
          if-no-files-found: error
          retention-days: 2
          path: |
            .github/workflows/preview-exhaustive-browser-qa.yml
            App.tsx
            package.json
            playwright.config.ts
            playwright.controller-navigation-history.config.ts
            playwright.exhaustive-acceptance.config.ts
            scripts/checkWorkflowYaml.test.mjs
            services/productNavigationController.test.ts
            services/productNavigationController.ts
            services/productNavigationState.ts
            services/viewStatePersistence.test.ts
            docs/quality/ai-boundary-static-scan-allowlist.json
            artifacts/controller-navigation-target/manifest.txt
