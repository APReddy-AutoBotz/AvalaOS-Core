name: Hosted Non-Production Pilot Activation Verification

on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: Exact approved 40-character commit already on this Draft PR branch
        required: true
        type: string
      hosted_url:
        description: Controller-supplied credential-free HTTPS non-production origin
        required: true
        type: string
      activation_run_id:
        description: Workflow run containing the sanitized hosted evidence manifest
        required: true
        type: string
      organization_id:
        description: Exact synthetic organization UUID proved by the activation run
        required: true
        type: string
      workspace_id:
        description: Exact synthetic workspace UUID proved by the activation run
        required: true
        type: string
      exercise_run_id:
        description: Exact immutable hosted exercise UUID proved by the activation run
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
  HOSTED_PILOT_URL: ${{ inputs.hosted_url }}
  ACTIVATION_PRODUCER_WORKFLOW: .github/workflows/hosted-pilot-activation-evidence-producer.yml
  ACTIVATION_MANIFEST_ARTIFACT: hosted-pilot-activation-manifest

jobs:
  source-and-deployment-identity:
    environment: hosted-nonproduction-pilot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_release_sha }}
          fetch-depth: 0
      - name: Fail closed unless checkout is the exact authorized release
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - name: Verify hosted response identifies exact release and non-production environment
        run: node scripts/verify-hosted-deployment.mjs

  hosted-browser-acceptance:
    needs: source-and-deployment-identity
    environment: hosted-nonproduction-pilot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.expected_release_sha }}'}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.hosted-pilot.config.ts

  exact-head-hosted-evidence:
    if: always()
    needs: [source-and-deployment-identity, hosted-browser-acceptance]
    environment: hosted-nonproduction-pilot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.expected_release_sha }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Resolve and authorize the exact controller-selected activation run
        id: activation-run
        uses: actions/github-script@v7
        env:
          ACTIVATION_RUN_ID: ${{ inputs.activation_run_id }}
          ACTIVATION_WORKFLOW_PATH: .github/workflows/hosted-pilot-activation-evidence-producer.yml
        with:
          script: |
            const selected = process.env.ACTIVATION_RUN_ID;
            if (!/^[1-9][0-9]{0,19}$/.test(selected)) core.setFailed('activation_run_id must be a bounded decimal workflow run ID');
            if (!/^[1-9][0-9]{0,19}$/.test(selected)) return;
            const selectedNumber = Number(selected);
            if (!Number.isSafeInteger(selectedNumber)) return core.setFailed('activation_run_id exceeds the safe API integer range');
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: selectedNumber,
            });
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            const workflowPath = String(run.path || '').split('@', 1)[0];
            const failures = [];
            if (String(run.id) !== selected) failures.push('run ID');
            if (run.repository?.full_name !== expectedRepository || run.head_repository?.full_name !== expectedRepository) failures.push('repository');
            if (run.head_sha !== process.env.EXPECTED_RELEASE_SHA) failures.push('head SHA');
            if (run.event !== 'workflow_dispatch') failures.push('event');
            if (run.status !== 'completed' || run.conclusion !== 'success') failures.push('result');
            if (!/^\.github\/workflows\/[A-Za-z0-9._-]+\.ya?ml$/.test(workflowPath)) failures.push('workflow path');
            if (workflowPath !== process.env.ACTIVATION_WORKFLOW_PATH) failures.push('trusted workflow identity');
            if (!Number.isSafeInteger(run.run_attempt) || run.run_attempt < 1) failures.push('run attempt');
            if (failures.length) return core.setFailed(`selected activation run failed trusted metadata checks: ${failures.join(', ')}`);
            core.setOutput('id', String(run.id));
            core.setOutput('attempt', String(run.run_attempt));
            core.setOutput('workflow', workflowPath);
            core.setOutput('repository', expectedRepository);
            core.setOutput('event', run.event);
            core.setOutput('head', run.head_sha);
            core.setOutput('conclusion', run.conclusion);
      - uses: actions/download-artifact@v4
        with:
          name: hosted-pilot-activation-manifest
          github-token: ${{ github.token }}
          run-id: ${{ inputs.activation_run_id }}
          path: artifacts/hosted-pilot/input
      - name: Require all hosted gates and exact release binding
        env:
          ACTIVATION_RUN_ID: ${{ steps.activation-run.outputs.id }}
          ACTIVATION_RUN_ATTEMPT: ${{ steps.activation-run.outputs.attempt }}
          ACTIVATION_WORKFLOW: ${{ steps.activation-run.outputs.workflow }}
          ACTIVATION_REPOSITORY: ${{ steps.activation-run.outputs.repository }}
          ACTIVATION_EVENT: ${{ steps.activation-run.outputs.event }}
          ACTIVATION_HEAD: ${{ steps.activation-run.outputs.head }}
          ACTIVATION_CONCLUSION: ${{ steps.activation-run.outputs.conclusion }}
        shell: bash
        run: |
          EXPECTED_DEPLOYMENT_FINGERPRINT="$(node --input-type=module -e 'import {safeHash,validateHostedUrl} from "./scripts/verify-hosted-pilot-evidence.mjs"; process.stdout.write(safeHash(validateHostedUrl(process.env.HOSTED_PILOT_URL)))')"
          node scripts/verify-hosted-pilot-evidence.mjs \
            --manifest artifacts/hosted-pilot/input/manifest.json \
            --expected-head "$EXPECTED_RELEASE_SHA" \
            --expected-deployment-fingerprint "$EXPECTED_DEPLOYMENT_FINGERPRINT" \
            --organization-id "${{ inputs.organization_id }}" \
            --workspace-id "${{ inputs.workspace_id }}" \
            --exercise-run-id "${{ inputs.exercise_run_id }}" \
            --activation-run-id "$ACTIVATION_RUN_ID" \
            --activation-run-attempt "$ACTIVATION_RUN_ATTEMPT" \
            --activation-workflow "$ACTIVATION_WORKFLOW" \
            --activation-repository "$ACTIVATION_REPOSITORY" \
            --activation-event "$ACTIVATION_EVENT" \
            --activation-head "$ACTIVATION_HEAD" \
            --activation-conclusion "$ACTIVATION_CONCLUSION"
      - name: Fail if deployment or browser verification did not pass
        env:
          DEPLOYMENT_RESULT: ${{ needs.source-and-deployment-identity.result }}
          BROWSER_RESULT: ${{ needs.hosted-browser-acceptance.result }}
        run: test "$DEPLOYMENT_RESULT" = success && test "$BROWSER_RESULT" = success
      - uses: actions/upload-artifact@v4
        with:
          name: hosted-pilot-verification-${{ inputs.expected_release_sha }}
          path: artifacts/hosted-pilot/verified-evidence.json
          if-no-files-found: error
          retention-days: 14
