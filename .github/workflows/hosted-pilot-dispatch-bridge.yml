name: Hosted Pilot Dispatch Bridge

on:
  create:

permissions:
  contents: read
  actions: write

jobs:
  dispatch-exact-hosted-pilot-producer:
    if: >-
      github.ref_type == 'branch' &&
      startsWith(github.event.ref, 'hosted-pilot-dispatch--') &&
      github.actor == 'APReddy-AutoBotz'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref }}
          fetch-depth: 0
      - name: Validate controller bridge and dispatch exact hosted producer
        env:
          GH_TOKEN: ${{ github.token }}
          CREATED_REF: ${{ github.event.ref }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          prefix='hosted-pilot-dispatch--'
          payload="${CREATED_REF#${prefix}}"
          if [ "$payload" = "$CREATED_REF" ] || [[ "$payload" != *--* ]]; then
            echo 'HOSTED_PILOT_DISPATCH_REF_INVALID' >&2
            exit 1
          fi
          DEPLOYMENT_ID="${payload%%--*}"
          EXERCISE_RUN_ID="${payload#*--}"
          if [[ ! "$DEPLOYMENT_ID" =~ ^[0-9a-f]{24}$ ]]; then
            echo 'HOSTED_PILOT_DEPLOYMENT_ID_INVALID' >&2
            exit 1
          fi
          if [[ ! "$EXERCISE_RUN_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]; then
            echo 'HOSTED_PILOT_EXERCISE_RUN_ID_INVALID' >&2
            exit 1
          fi
          RELEASE_SHA="$(git rev-parse HEAD)"
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'HOSTED_PILOT_RELEASE_SHA_INVALID' >&2
            exit 1
          fi
          git fetch --quiet origin main
          if [ "$RELEASE_SHA" != "$(git rev-parse origin/main)" ]; then
            echo 'HOSTED_PILOT_DISPATCH_NOT_CURRENT_MAIN' >&2
            exit 1
          fi
          request="$(jq -n \
            --arg ref "$CREATED_REF" \
            --arg expected_release_sha "$RELEASE_SHA" \
            --arg target_fingerprint 'sha256:865561c471b54b7df5e92a5ee29cc66a7a739d39c6b27bef93781830b7c7aaed' \
            --arg deployment_origin 'https://avalaos-pilot.netlify.app' \
            --arg deployment_id "$DEPLOYMENT_ID" \
            --arg organization_id '24de1bb5-ad49-4224-80b1-9d26b6dcfc15' \
            --arg workspace_id '06165d6f-19c9-4a0c-8847-f9cb6c63e9d2' \
            --arg exercise_run_id "$EXERCISE_RUN_ID" \
            --arg recovery_actor_id '6d65da73-84b0-4eb3-9be5-d7f1e53c0151' \
            --arg recovery_authorization_version '5' \
            '{ref:$ref,inputs:{expected_release_sha:$expected_release_sha,target_fingerprint:$target_fingerprint,deployment_origin:$deployment_origin,deployment_id:$deployment_id,organization_id:$organization_id,workspace_id:$workspace_id,exercise_run_id:$exercise_run_id,recovery_actor_id:$recovery_actor_id,recovery_authorization_version:$recovery_authorization_version}}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/hosted-pilot-activation-evidence-producer.yml/dispatches" \
            -d "$request"
          echo "Hosted pilot producer dispatch accepted for exact main ${RELEASE_SHA} via immutable ref ${CREATED_REF}."
