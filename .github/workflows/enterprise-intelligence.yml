name: Enterprise Intelligence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enterprise-intelligence-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run source, type, provider, ingestion, security, scoring, and build gates
        run: node scripts/runEnterpriseIntelligenceCiCheck.mjs source .agent/enterprise-intelligence-ci/source.log -- npm run ci:enterprise-intelligence:source
      - name: Upload sanitized source result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-intelligence-source-sanitized
          path: .agent/enterprise-intelligence-ci/source.log
          if-no-files-found: error
          retention-days: 14

  enterprise-intelligence-postgresql-16:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Execute the full ordered chain and Enterprise migration contract on disposable PostgreSQL 16
        env:
          STUDIO_ARTIFACT_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          ENTERPRISE_INTELLIGENCE_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: node scripts/runEnterpriseIntelligenceCiCheck.mjs postgresql-16 .agent/enterprise-intelligence-ci/postgresql-16.log -- npm run test:migrations:enterprise-intelligence:postgres
      - name: Upload sanitized PostgreSQL result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-intelligence-postgresql-16-sanitized
          path: .agent/enterprise-intelligence-ci/postgresql-16.log
          if-no-files-found: error
          retention-days: 14

  enterprise-intelligence-mocked-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run mocked BYOK lifecycle, resolver, secret-store, and audit checks
        run: node scripts/runEnterpriseIntelligenceCiCheck.mjs mocked-provider .agent/enterprise-intelligence-ci/mocked-provider.log -- npm run test:enterprise-intelligence-provider
      - name: Upload sanitized mocked-provider result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-intelligence-mocked-provider-sanitized
          path: .agent/enterprise-intelligence-ci/mocked-provider.log
          if-no-files-found: error
          retention-days: 14

  enterprise-intelligence-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run deterministic desktop and mobile Chromium journeys
        run: node scripts/runEnterpriseIntelligenceCiCheck.mjs browser .agent/enterprise-intelligence-ci/browser.log -- npm run test:browser:enterprise-intelligence
      - name: Upload sanitized browser result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-intelligence-browser-sanitized
          path: .agent/enterprise-intelligence-ci/browser.log
          if-no-files-found: error
          retention-days: 14
