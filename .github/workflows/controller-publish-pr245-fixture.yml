name: Controller publish PR245 retained reload fixture correction

on:
  push:
    branches:
      - controller/reload-reconstruction-closure

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: controller/reload-reconstruction-closure
          fetch-depth: 2

      - name: Guard exact published parent and apply approved correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1f5de8c5b18435e901c6ffee66faad7b52bc9a79"
          cat > /tmp/pr245.patch <<'PATCH'
          diff --git a/tests/browser/pr1d.spec.ts b/tests/browser/pr1d.spec.ts
          index 062e6c41645aa3b947ad5c8690c65462f1caa227..2264f1b1af7a7c2cc97e55e90020bb524f324c55 100644
          --- a/tests/browser/pr1d.spec.ts
          +++ b/tests/browser/pr1d.spec.ts
          @@ -115,8 +115,12 @@ const installEnterpriseFixture = async (page: Page, options: FixtureOptions = {}
                 expires_at:now+3600,
                 user,
               }));
          -    localStorage.setItem('avalaos-core-v1-view',JSON.stringify('process_catalog'));
          -    localStorage.setItem('avalaos-core-v1-scope',JSON.stringify({ type:'my_work' }));
          +    if (!localStorage.getItem('avalaos-core-v1-view')) {
          +      localStorage.setItem('avalaos-core-v1-view',JSON.stringify('process_catalog'));
          +    }
          +    if (!localStorage.getItem('avalaos-core-v1-scope')) {
          +      localStorage.setItem('avalaos-core-v1-scope',JSON.stringify({ type:'my_work' }));
          +    }
             },{ user });
           
             const fail = async (route: any, code: string, status = 409) => route.fulfill({
          @@ -489,8 +493,7 @@ test('V2 capability-controlled authoring finalizes server-only decision data and
             expect(violations.violations.filter(item=>['serious','critical'].includes(item.impact || ''))).toEqual([]);
             expect(errors.filter(item=>!item.includes('Failed to load resource: net::ERR_FAILED'))).toEqual([]);
             await page.reload();
          -  await expectProcessCatalog(page);
          -  await page.getByRole('button',{name:'View'}).first().click();
          +  await expect(page).toHaveURL(new RegExp(`view=process_detail.*scope=my_work.*processId=${PROCESS}`));
             await expect(page.getByTestId('assess-v2-decision-pack')).toBeVisible();
             await expect(page.getByText('Existing reviewer-ready Decision Pack reopened in read-only mode.')).toBeVisible();
             await expect(page.getByRole('button',{name:'Create V2 case'})).toHaveCount(0);
          @@ -611,8 +614,7 @@ test('persisted V2 draft is resumed after remount without duplicate creation', a
             await page.getByRole('button',{name:'Save V2 draft'}).click();
             await expect(page.getByText('Draft saved as a new immutable authoring version.')).toBeVisible();
             await page.reload();
          -  await expectProcessCatalog(page);
          -  await page.getByRole('button',{name:'View'}).first().click();
          +  await expect(page).toHaveURL(new RegExp(`view=process_detail.*scope=my_work.*processId=${PROCESS}`));
             await expect(page.getByLabel('Primitive 1 name')).toHaveValue('Persisted restore primitive');
             await expect(page.getByText('Existing V2 draft resumed from the current immutable authoring version.')).toBeVisible();
             await expect(page.getByRole('button',{name:'Create V2 case'})).toHaveCount(0);
          diff --git a/tests/browser/pr1f.spec.ts b/tests/browser/pr1f.spec.ts
          index 8703f71e6093e1afc01c12da3aa078443ec51718..9f9991a1f22fda3d36f33bfd237b00ae09fc7a1d 100644
          --- a/tests/browser/pr1f.spec.ts
          +++ b/tests/browser/pr1f.spec.ts
          @@ -41,7 +41,7 @@ const installEconomicsFixture=async(page:Page)=>{
             const rejected:string[]=[];
             let failNextSave=false;
             const user={id:USER,email:'economics.reviewer@avala.test',role:'authenticated',user_metadata:{full_name:'Independent Economics Reviewer'},aud:'authenticated',created_at:'2026-07-20T00:00:00.000Z'};
          -  await page.addInitScript(({user})=>{const now=Math.floor(Date.now()/1000);localStorage.setItem('sb-127-auth-token',JSON.stringify({access_token:'browser-fixture-token',refresh_token:'browser-fixture-refresh',token_type:'bearer',expires_in:3600,expires_at:now+3600,user}));localStorage.setItem('avalaos-core-v1-view',JSON.stringify('process_catalog'));localStorage.setItem('avalaos-core-v1-scope',JSON.stringify({type:'my_work'}));},{user});
          +  await page.addInitScript(({user})=>{const now=Math.floor(Date.now()/1000);localStorage.setItem('sb-127-auth-token',JSON.stringify({access_token:'browser-fixture-token',refresh_token:'browser-fixture-refresh',token_type:'bearer',expires_in:3600,expires_at:now+3600,user}));if(!localStorage.getItem('avalaos-core-v1-view'))localStorage.setItem('avalaos-core-v1-view',JSON.stringify('process_catalog'));if(!localStorage.getItem('avalaos-core-v1-scope'))localStorage.setItem('avalaos-core-v1-scope',JSON.stringify({type:'my_work'}));},{user});
             const ok=(route:any,body:unknown)=>route.fulfill({status:200,headers,body:JSON.stringify(body)});
             const fail=(route:any,code='INVALID_COMMAND',status=409)=>route.fulfill({status,headers,body:JSON.stringify({ok:false,error:{code,message:'Command rejected without persistence.'}})});
             const projection=()=>({version:version?{...version,id:server.id,version:server.version,status:server.status}:undefined,technicalReady:true,governanceApproved:true,latestOutcome,latestOutcomeReview,calibrationStatus:'Insufficient Data',portfolioDisposition:'Proceed to controlled design'});
          @@ -101,7 +101,7 @@ test('governed economics lifecycle in the Avala Assess workspace',async({page})=
             await expect(page.getByTestId('economics-lifecycle')).toHaveText('draft');expect(fixture.committed[0]).toMatchObject({type:'assessment_v2.economics.create',expectedVersion:0});
             await page.getByLabel('Analysis horizon years').fill('3');await page.getByLabel('Implementation horizon months').fill('6');await page.getByLabel('Discount rate').fill('0.08');await page.getByLabel('Capacity released hours').fill('120');await page.getByLabel('Avoidable cash benefit').fill('12000');await page.getByLabel('One-time implementation cost').fill('25000');await page.getByLabel('Evidence ID',{exact:true}).fill(EVIDENCE);await page.getByLabel('Accountable owner').fill('Finance Operations');
             const save=page.getByRole('button',{name:'Save evidence-linked assumptions'});await save.focus();await expect(save).toBeFocused();await save.press('Enter');await expect.poll(()=>fixture.server.version).toBe(2);
          -  await page.reload();await expect(page.getByRole('heading',{name:'Process Catalog'})).toBeVisible();await page.getByRole('button',{name:'View'}).first().click();await expect(workspace).toBeVisible();await expect(page.getByTestId('economics-lifecycle')).toHaveText('draft');
          +  await page.reload();await expect(page).toHaveURL(new RegExp(`view=process_detail.*scope=my_work.*processId=${PROCESS}`));await expect(workspace).toBeVisible();await expect(page.getByTestId('economics-lifecycle')).toHaveText('draft');
             await page.getByRole('button',{name:'Finalize'}).click();await expect(page.getByTestId('economics-lifecycle')).toHaveText('reviewer_ready');await expect(page.getByTestId('economics-scenarios')).toContainText('base: capacity 120');
             const committedBeforeSelfReview=fixture.committed.length;const selfReviewStatus=await page.evaluate(async endpoint=>(await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({requestId:crypto.randomUUID(),idempotencyKey:'self-review-attempt',commandType:'assessment_v2.economics.review.resolve',organizationId:'22222222-2222-4222-8222-222222222222',workspaceId:'33333333-3333-4333-8333-333333333333',authorizationVersion:12,expectedVersion:3,payload:{economicVersionId:'92000000-0000-4000-8000-000000000001',caseId:'70000000-0000-4000-8000-000000000001',decisionId:'88888888-8888-4888-8888-888888888888',resolution:'approved',rationale:'Self review must fail',conditions:[]}})})).status,`${API}/functions/v1/assess-v2-command`);expect(selfReviewStatus).toBe(403);expect(fixture.committed).toHaveLength(committedBeforeSelfReview);await expect(page.getByTestId('economics-lifecycle')).toHaveText('reviewer_ready');
          PATCH
          git apply --check /tmp/pr245.patch
          git apply /tmp/pr245.patch

      - name: Remove controller scaffold and publish exact correction
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/controller-publish-pr245-fixture.yml
          git diff --check
          git add tests/browser/pr1d.spec.ts tests/browser/pr1f.spec.ts .github/workflows/controller-publish-pr245-fixture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(browser): preserve navigation state across reload"
          git push origin HEAD:controller/reload-reconstruction-closure
