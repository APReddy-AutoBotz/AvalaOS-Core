name: Controller Reload Fail-Closed Order Fix

on:
  push:
    branches:
      - controller/reload-failclosed-order-20260821

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controller/reload-failclosed-order-20260821
      - name: Move durable agreement before data-loading wait
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('App.tsx')
          text = path.read_text()
          old = """    if (!explicitNavigationIntent || navigationHydrated.current) return;\n    if (processesLoading) return;\n\n    if (!hasDurableProductNavigationAgreement(window.location.search, persistedView, persistedScope)) {\n"""
          new = """    if (!explicitNavigationIntent || navigationHydrated.current) return;\n\n    if (!hasDurableProductNavigationAgreement(window.location.search, persistedView, persistedScope)) {\n"""
          if old not in text:
              raise SystemExit('expected pre-hydration guard sequence not found')
          text = text.replace(old, new, 1)
          anchor = """      navigationHydrated.current = true;\n      return;\n    }\n\n    const resolvedNavigation = resolveProductNavigationState({\n"""
          replacement = """      navigationHydrated.current = true;\n      return;\n    }\n\n    // Invalid durable navigation is rejected immediately. Only valid entity\n    // reconstruction waits for process data required by route resolution.\n    if (processesLoading) return;\n\n    const resolvedNavigation = resolveProductNavigationState({\n"""
          if anchor not in text:
              raise SystemExit('expected navigation-resolution anchor not found')
          path.write_text(text.replace(anchor, replacement, 1))
          PY
      - name: Remove one-shot controller workflow and commit only product fix
        run: |
          set -euo pipefail
          git rm .github/workflows/controller-reload-failclosed-order.yml
          git add App.tsx
          git config user.name 'avalaos-controller'
          git config user.email 'avalaos-controller@users.noreply.github.com'
          git commit -m 'fix(navigation): reject invalid durable deep links immediately'
          git push
