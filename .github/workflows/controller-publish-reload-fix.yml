name: Controller publish reload fix
on:
  push:
    branches:
      - controller/reload-reconstruction-closure
    paths:
      - .github/workflows/controller-publish-reload-fix.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply exact approved App.tsx correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('App.tsx')
          s = p.read_text()
          old1 = """    if (tempArtifacts && currentView === View.WORKSPACE) {\n"""
          insert = """    // URL hydration commits the view, scope, and entity selection as one\n    // navigation transition. Do not reconcile the pre-hydration render (where\n    // the process selection is still null) or it can downgrade a valid\n    // process-detail route to the catalog before React commits that selection.\n    if (navigationWriteSuppressed.current) {\n      navigationWriteSuppressed.current = false;\n      return;\n    }\n\n"""
          old2 = """    if (navigationWriteSuppressed.current) {\n      navigationWriteSuppressed.current = false;\n      return;\n    }\n\n    replaceProductNavigationSearch(buildProductNavigationSearch({\n"""
          new2 = """    replaceProductNavigationSearch(buildProductNavigationSearch({\n"""
          if insert in s:
              raise SystemExit('approved correction already present; refusing duplicate application')
          if old1 not in s or old2 not in s:
              raise SystemExit('exact approved patch context missing; refusing publication')
          s = s.replace(old1, insert + old1, 1)
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
          test "$(git hash-object App.tsx)" = "b101254757e482d0a495e03cba8ba48594ca4641"
      - name: Remove temporary controller workflow and publish
        shell: bash
        run: |
          rm .github/workflows/controller-publish-reload-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx .github/workflows/controller-publish-reload-fix.yml
          git commit -m "fix(navigation): preserve hydrated process selection"
          git push origin HEAD:controller/reload-reconstruction-closure
