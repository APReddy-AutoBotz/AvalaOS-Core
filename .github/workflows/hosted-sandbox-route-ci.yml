name: Sandbox Route CI

on:
  pull_request:
    paths:
      - 'services/hostedSandboxRoute.ts'
      - 'services/hostedSandboxRoute.test.ts'
      - 'services/supabaseClient.ts'
      - 'vite.config.ts'
      - 'vite-env.d.ts'
      - '.github/workflows/hosted-sandbox-route-ci.yml'

permissions:
  contents: read

jobs:
  sandbox-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: node scripts/runTypeScriptTest.mjs types.ts services/hostedSandboxRoute.ts services/hostedSandboxRoute.test.ts
      - run: npm run typecheck
      - run: npm run build
