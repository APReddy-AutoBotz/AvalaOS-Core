name: Hosted Pilot Activation Evidence Producer

on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: Exact approved non-production release SHA
        required: true
        type: string
      target_fingerprint:
        description: Sanitized sha256 database target fingerprint
        required: true
        type: string
      deployment_origin:
        description: Credential-free hosted non-production HTTPS origin tested by this run
        required: true
        type: string
      deployment_id:
        description: Sanitized non-production deployment identity
        required: true
        type: string
      organization_id:
        description: Controller-selected synthetic organization UUID
        required: true
        type: string
      workspace_id:
        description: Controller-selected synthetic workspace UUID
        required: true
        type: string
      exercise_run_id:
        description: Immutable hosted exercise run UUID
        required: true
        type: string
      recovery_actor_id:
        description: Current synthetic recovery operator UUID
        required: true
        type: string
      recovery_authorization_version:
        description: Current recovery operator authorization version
        required: true
        type: number

permissions:
  contents: read
  id-token: write

env:
  EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
  EXPECTED_NETLIFY_DEPLOY_ID: ${{ inputs.deployment_id }}
  HOSTED_PILOT_URL: ${{ inputs.deployment_origin }}

jobs:
  early-family-attestations:
    environment: hosted-nonproduction-pilot
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: avalaos_pilot_operations}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d avalaos_pilot_operations"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PILOT_OPERATIONS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_pilot_operations
      TARGET_FINGERPRINT: ${{ inputs.target_fingerprint }}
      HOSTED_PILOT_ORGANIZATION_ID: ${{ inputs.organization_id }}
      HOSTED_PILOT_WORKSPACE_ID: ${{ inputs.workspace_id }}
      HOSTED_PILOT_EXERCISE_RUN_ID: ${{ inputs.exercise_run_id }}
      DEPLOYMENT_ORIGIN: ${{ inputs.deployment_origin }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.expected_release_sha }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Execute authoritative family assertions before provider finalization
        run: |
          set -euo pipefail
          npm run test:migrations:pilot-operations:postgres
          npm run test:recovery:pilot-operations
          npm run test:hosted-evidence-family-attestations
          mkdir -p artifacts/hosted-pilot/family-source artifacts/hosted-pilot/families
          DEPLOYMENT_FINGERPRINT="$(node --input-type=module -e "import {safeHash,validateHostedUrl} from './scripts/verify-hosted-pilot-evidence.mjs';process.stdout.write(safeHash(validateHostedUrl(process.env.DEPLOYMENT_ORIGIN)))")"
          for FAMILY in tenant-adversarial provider-simulation-zero-egress canonical-journey backup-restore recovery-rollback; do
            jq -n --arg family "$FAMILY" --arg fingerprint "$DEPLOYMENT_FINGERPRINT" \
              '{gate:$family,result:"passed",deploymentTargetFingerprint:$fingerprint,observedAt:(now|todate),testIds:(if $family=="tenant-adversarial" then ["SAFETY-005"] elif $family=="provider-simulation-zero-egress" then ["AI-006"] elif $family=="canonical-journey" then ["E2E-001"] elif $family=="backup-restore" then ["ADMIN-004"] else ["SAFETY-005"] end)}' \
              > "artifacts/hosted-pilot/family-source/$FAMILY.json"
            node scripts/produceHostedEvidenceFamilyAttestation.mjs "$FAMILY" "artifacts/hosted-pilot/family-source/$FAMILY.json" "artifacts/hosted-pilot/families/$FAMILY.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hosted-family-attestations-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/hosted-pilot/families/*.json
          if-no-files-found: error
          retention-days: 14

  database-provider:
    environment: hosted-nonproduction-pilot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.expected_release_sha }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Verify exact connected database through GitHub OIDC and finalize exact hosted proof
        timeout-minutes: 18
        env:
          TARGET_FINGERPRINT: ${{ inputs.target_fingerprint }}
          DEPLOYMENT_ORIGIN: ${{ inputs.deployment_origin }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          ORGANIZATION_ID: ${{ inputs.organization_id }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          EXERCISE_RUN_ID: ${{ inputs.exercise_run_id }}
          RECOVERY_ACTOR_ID: ${{ inputs.recovery_actor_id }}
          RECOVERY_AUTHORIZATION_VERSION: ${{ inputs.recovery_authorization_version }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          HOSTED_PILOT_VERIFIER_URL="${HOSTED_PILOT_URL%/}/.netlify/functions/hosted-pilot-github-verifier-proxy"
          if [ "$HOSTED_PILOT_VERIFIER_URL" != 'https://avalaos-pilot.netlify.app/.netlify/functions/hosted-pilot-github-verifier-proxy' ]; then
            echo 'HOSTED_PILOT_VERIFIER_PROXY_TARGET_INVALID' >&2
            exit 1
          fi
          CANONICAL_PROOF="$(node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {loadCanonicalMigrationInventory} from './scripts/hostedPilotActivation.mjs';
          import {safeHash,validateHostedUrl} from './scripts/verify-hosted-pilot-evidence.mjs';
          const canonical=await loadCanonicalMigrationInventory();
          const migrations=[...canonical.migrations].sort((a,b)=>a.name.localeCompare(b.name));
          const ledger=migrations.map(m=>`${m.name}:${m.sha256}`).join('\n');
          process.stdout.write(JSON.stringify({migrationCount:migrations.length,ledgerDigest:`sha256:${createHash('sha256').update(ledger).digest('hex')}`,
            deploymentFingerprint:safeHash(validateHostedUrl(process.env.DEPLOYMENT_ORIGIN))}));
          NODE
          )"
          EXPECTED_MIGRATION_COUNT="$(jq -r '.migrationCount' <<<"$CANONICAL_PROOF")"
          EXPECTED_LEDGER_DIGEST="$(jq -r '.ledgerDigest' <<<"$CANONICAL_PROOF")"
          DEPLOYMENT_FINGERPRINT="$(jq -r '.deploymentFingerprint' <<<"$CANONICAL_PROOF")"
          [[ "$EXPECTED_MIGRATION_COUNT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_LEDGER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$DEPLOYMENT_FINGERPRINT" =~ ^sha256:[0-9a-f]{64}$ ]]

          oidc_token() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=avalaos-hosted-pilot" | jq -er '.value'
          }
          request_body() {
            local operation="$1"
            jq -n \
              --arg operation "$operation" \
              --arg expectedReleaseSha "$EXPECTED_RELEASE_SHA" \
              --arg deploymentId "$DEPLOYMENT_ID" \
              --arg exerciseRunId "$EXERCISE_RUN_ID" \
              --arg producerRunId "$GITHUB_RUN_ID" \
              --argjson producerRunAttempt "$GITHUB_RUN_ATTEMPT" \
              --arg targetFingerprint "$TARGET_FINGERPRINT" \
              --arg deploymentFingerprint "$DEPLOYMENT_FINGERPRINT" \
              --argjson expectedMigrationCount "$EXPECTED_MIGRATION_COUNT" \
              --arg expectedLedgerDigest "$EXPECTED_LEDGER_DIGEST" \
              --arg organizationId "$ORGANIZATION_ID" \
              --arg workspaceId "$WORKSPACE_ID" \
              --arg recoveryActorId "$RECOVERY_ACTOR_ID" \
              --argjson recoveryAuthorizationVersion "$RECOVERY_AUTHORIZATION_VERSION" \
              '{operation:$operation,expectedReleaseSha:$expectedReleaseSha,deploymentId:$deploymentId,exerciseRunId:$exerciseRunId,
                producerRunId:$producerRunId,producerRunAttempt:$producerRunAttempt,targetFingerprint:$targetFingerprint,
                deploymentFingerprint:$deploymentFingerprint,expectedMigrationCount:$expectedMigrationCount,expectedLedgerDigest:$expectedLedgerDigest,
                organizationId:$organizationId,workspaceId:$workspaceId,recoveryActorId:$recoveryActorId,recoveryAuthorizationVersion:$recoveryAuthorizationVersion}'
          }
          call_verifier() {
            local operation="$1" token body
            token="$(oidc_token)"
            body="$(request_body "$operation")"
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' \
              --data "$body" "$HOSTED_PILOT_VERIFIER_URL"
          }

          PREFLIGHT_RESULT="$(call_verifier preflight)"
          jq -e --arg target "$TARGET_FINGERPRINT" --arg digest "$EXPECTED_LEDGER_DIGEST" --argjson count "$EXPECTED_MIGRATION_COUNT" \
            '.status=="passed" and .targetFingerprint==$target and .ledgerDigest==$digest and .migrationCount==$count
              and .browserTableAuthority==false and .browserServiceRpcAuthority==false
              and .serviceRoleEvidenceMutationAuthority==false and .productionAuthorized==false' \
            <<<"$PREFLIGHT_RESULT" >/dev/null
          echo 'Credentialless hosted database preflight passed before evidence finalization.'

          ready=false
          for _ in $(seq 1 90); do
            STATUS_RESULT="$(call_verifier status)"
            family_count="$(jq -r '.evidenceFamilyCount // 0' <<<"$STATUS_RESULT")"
            if [ "$family_count" = '5' ]; then ready=true; break; fi
            sleep 10
          done
          if [ "$ready" != 'true' ]; then echo 'HOSTED_PILOT_EVIDENCE_WAIT_TIMEOUT' >&2; exit 1; fi

          FINAL_RESULT="$(call_verifier finalize)"
          jq -e '.status=="passed" and .exactVerificationResultCount==1 and .productionAuthorized==false' <<<"$FINAL_RESULT" >/dev/null
          echo 'Exact hosted database evidence and recovery verification passed through GitHub OIDC.'

  recovery-operations:
    environment: hosted-nonproduction-pilot
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: avalaos_pilot_operations}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d avalaos_pilot_operations"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PILOT_OPERATIONS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_pilot_operations
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.expected_release_sha }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Verify retained recovery, authority, replay and operations contracts
        run: |
          npm run test:pilot-operations
          npm run test:migrations:pilot-operations:postgres
          npm run test:recovery:pilot-operations

  hosted-browser:
    environment: hosted-nonproduction-pilot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.expected_release_sha }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: node scripts/verify-hosted-deployment.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.hosted-pilot.config.ts --workers=1

  accessibility-performance:
    environment: hosted-nonproduction-pilot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.expected_release_sha }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Verify exact hosted deployment before accessibility and performance assertions
        run: node scripts/verify-hosted-deployment.mjs
      - run: npx playwright install --with-deps chromium
      - name: Run repository-owned hosted accessibility and performance contracts
        run: npx playwright test --config=playwright.hosted-accessibility-performance.config.ts --workers=1
      - name: Record sanitized successful assertion identity
        env:
          TARGET_FINGERPRINT: ${{ inputs.target_fingerprint }}
          DEPLOYMENT_ORIGIN: ${{ inputs.deployment_origin }}
          HOSTED_PILOT_ORGANIZATION_ID: ${{ inputs.organization_id }}
          HOSTED_PILOT_WORKSPACE_ID: ${{ inputs.workspace_id }}
          HOSTED_PILOT_EXERCISE_RUN_ID: ${{ inputs.exercise_run_id }}
        run: |
          mkdir -p artifacts/hosted-pilot/accessibility-performance
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          import {safeHash,validateHostedUrl,ACTIVATION_PRODUCER_WORKFLOW} from './scripts/verify-hosted-pilot-evidence.mjs';
          const result={schemaVersion:1,gate:'accessibility-performance',result:'passed',gitCommit:process.env.EXPECTED_RELEASE_SHA,
            workflowRunId:process.env.GITHUB_RUN_ID,workflowRunAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),workflowPath:ACTIVATION_PRODUCER_WORKFLOW,
            environment:'hosted_nonproduction_pilot',targetFingerprint:process.env.TARGET_FINGERPRINT,
            organizationId:process.env.HOSTED_PILOT_ORGANIZATION_ID,workspaceId:process.env.HOSTED_PILOT_WORKSPACE_ID,exerciseRunId:process.env.HOSTED_PILOT_EXERCISE_RUN_ID,
            deploymentTargetFingerprint:safeHash(validateHostedUrl(process.env.DEPLOYMENT_ORIGIN)),projects:['hosted-accessibility-performance-desktop-chrome','hosted-accessibility-performance-pixel-7']};
          await writeFile('artifacts/hosted-pilot/accessibility-performance/result.json',`${JSON.stringify(result,null,2)}\n`,{mode:0o600});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: hosted-accessibility-performance-result-${{ github.run_attempt }}
          path: artifacts/hosted-pilot/accessibility-performance/result.json
          if-no-files-found: error
          retention-days: 14

  produce-sanitized-manifest:
    needs: [database-provider, recovery-operations, hosted-browser, accessibility-performance]
    environment: hosted-nonproduction-pilot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.expected_release_sha }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/download-artifact@v4
        with:
          name: hosted-accessibility-performance-result-${{ github.run_attempt }}
          path: artifacts/hosted-pilot/accessibility-performance
      - name: Compose results only from required successful jobs in this immutable run
        env:
          TARGET_FINGERPRINT: ${{ inputs.target_fingerprint }}
          DEPLOYMENT_ORIGIN: ${{ inputs.deployment_origin }}
          HOSTED_PILOT_ORGANIZATION_ID: ${{ inputs.organization_id }}
          HOSTED_PILOT_WORKSPACE_ID: ${{ inputs.workspace_id }}
          HOSTED_PILOT_EXERCISE_RUN_ID: ${{ inputs.exercise_run_id }}
        shell: bash
        run: |
          TRUSTED_GATE_RESULTS_JSON="$(node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {safeHash,validateHostedUrl,ACTIVATION_PRODUCER_WORKFLOW,REQUIRED_GATES} from './scripts/verify-hosted-pilot-evidence.mjs';
          const target=process.env.TARGET_FINGERPRINT;
          const scope={organizationId:process.env.HOSTED_PILOT_ORGANIZATION_ID,workspaceId:process.env.HOSTED_PILOT_WORKSPACE_ID,exerciseRunId:process.env.HOSTED_PILOT_EXERCISE_RUN_ID};
          const deployment=safeHash(validateHostedUrl(process.env.DEPLOYMENT_ORIGIN));
          const accessibility=JSON.parse(await readFile('artifacts/hosted-pilot/accessibility-performance/result.json','utf8'));
          if(accessibility.gate!=='accessibility-performance' || accessibility.result!=='passed'
            || accessibility.gitCommit!==process.env.EXPECTED_RELEASE_SHA || accessibility.workflowRunId!==process.env.GITHUB_RUN_ID
            || Number(accessibility.workflowRunAttempt)!==Number(process.env.GITHUB_RUN_ATTEMPT) || accessibility.workflowPath!==ACTIVATION_PRODUCER_WORKFLOW
            || accessibility.environment!=='hosted_nonproduction_pilot' || accessibility.targetFingerprint!==target
            || accessibility.organizationId!==scope.organizationId || accessibility.workspaceId!==scope.workspaceId || accessibility.exerciseRunId!==scope.exerciseRunId
            || accessibility.deploymentTargetFingerprint!==deployment
            || JSON.stringify(accessibility.projects)!==JSON.stringify(['hosted-accessibility-performance-desktop-chrome','hosted-accessibility-performance-pixel-7']))
            throw new Error('missing or mismatched accessibility/performance assertion artifact');
          const jobFor={
            'database-preflight':'database-provider','migration-chain':'database-provider',
            'provider-simulation-zero-egress':'database-provider','runtime-fail-closed':'database-provider',
            'tenant-adversarial':'database-provider','backup-restore':'database-provider','canonical-journey':'database-provider',
            'browser-desktop':'hosted-browser','browser-pixel':'hosted-browser','accessibility-performance':'accessibility-performance',
          };
          const results=Object.fromEntries(REQUIRED_GATES.map(g=>[g,{result:'passed',gitCommit:process.env.EXPECTED_RELEASE_SHA,
            workflowRunId:process.env.GITHUB_RUN_ID,workflowRunAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),
            workflowPath:ACTIVATION_PRODUCER_WORKFLOW,workflowConclusion:'success',environment:'hosted_nonproduction_pilot',
            targetFingerprint:target,deploymentTargetFingerprint:deployment,...scope,resultId:g==='accessibility-performance'
              ? `accessibility-performance-artifact:${process.env.GITHUB_RUN_ID}:${process.env.GITHUB_RUN_ATTEMPT}`
              : `${jobFor[g]}:${process.env.GITHUB_RUN_ID}:${process.env.GITHUB_RUN_ATTEMPT}`}]))
          process.stdout.write(JSON.stringify(results));
          NODE
          )"
          printf 'TRUSTED_GATE_RESULTS_JSON=%s\n' "$TRUSTED_GATE_RESULTS_JSON" >> "$GITHUB_ENV"
      - name: Produce exact-run sanitized activation manifest
        env:
          TARGET_FINGERPRINT: ${{ inputs.target_fingerprint }}
          DEPLOYMENT_ORIGIN: ${{ inputs.deployment_origin }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          HOSTED_PILOT_ORGANIZATION_ID: ${{ inputs.organization_id }}
          HOSTED_PILOT_WORKSPACE_ID: ${{ inputs.workspace_id }}
          HOSTED_PILOT_EXERCISE_RUN_ID: ${{ inputs.exercise_run_id }}
        run: node scripts/produce-hosted-pilot-activation-manifest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hosted-pilot-activation-manifest
          path: artifacts/hosted-pilot/manifest.json
          if-no-files-found: error
          retention-days: 14
