name: Preview Exhaustive Browser QA

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
  PREVIEW_ALIAS_URL: https://deploy-preview-${{ github.event.number }}--avalaos-pilot.netlify.app
  ACCEPTANCE_EXECUTION_KIND: hosted_preview

jobs:
  select-pr264-controlled-preview:
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.selection.outputs.profile }}
    steps:
      - name: Select exact same-repository PR 264 head branch
        id: selection
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [ "$PR_NUMBER" != "264" ] && [ "$PR_HEAD_REF" != "controller/governed-delivery-monitor-pr-c-20260831" ]; then
            echo "profile=ordinary" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PR_NUMBER" = "264" ] \
            && [ "$PR_HEAD_REF" = "controller/governed-delivery-monitor-pr-c-20260831" ] \
            && [ "$PR_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
            echo "profile=controlled" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "PR264_CONTROLLED_PREVIEW_PARTIAL_IDENTITY_REJECTED" >&2
          exit 1

  preview-exhaustive-browser-qa:
    needs: select-pr264-controlled-preview
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate exhaustive browser contracts
        run: |
          npm run test:acceptance:catalog
          npm run test:pr-c-preview-profile-contract
          node tests/acceptance/pr255ControlledHumanTestingCharter.test.mjs

      - name: Wait for exact PR preview and bind immutable deploy identity
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            headers="$(curl -fsSIL --max-redirs 5 "$PREVIEW_ALIAS_URL/" 2>/dev/null || true)"
            served_release="$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^x-avalaos-release:/ {gsub("\r", ""); sub(/^[^:]+:[[:space:]]*/, ""); value=$0} END{print value}')"
            served_deploy="$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^x-avalaos-netlify-deploy-id:/ {gsub("\r", ""); sub(/^[^:]+:[[:space:]]*/, ""); value=$0} END{print value}')"
            served_environment="$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^x-avalaos-environment:/ {gsub("\r", ""); sub(/^[^:]+:[[:space:]]*/, ""); value=$0} END{print value}')"
            if [ "$served_release" = "$RELEASE_SHA" ] && [[ "$served_deploy" =~ ^[0-9a-f]{24}$ ]] && [ "$served_environment" = "hosted_nonproduction_pilot" ]; then
              immutable_url="https://${served_deploy}--avalaos-pilot.netlify.app"
              immutable_headers="$(curl -fsSIL --max-redirs 5 "$immutable_url/" 2>/dev/null || true)"
              immutable_release="$(printf '%s\n' "$immutable_headers" | awk 'BEGIN{IGNORECASE=1} /^x-avalaos-release:/ {gsub("\r", ""); sub(/^[^:]+:[[:space:]]*/, ""); value=$0} END{print value}')"
              immutable_deploy="$(printf '%s\n' "$immutable_headers" | awk 'BEGIN{IGNORECASE=1} /^x-avalaos-netlify-deploy-id:/ {gsub("\r", ""); sub(/^[^:]+:[[:space:]]*/, ""); value=$0} END{print value}')"
              immutable_environment="$(printf '%s\n' "$immutable_headers" | awk 'BEGIN{IGNORECASE=1} /^x-avalaos-environment:/ {gsub("\r", ""); sub(/^[^:]+:[[:space:]]*/, ""); value=$0} END{print value}')"
              test "$immutable_release" = "$RELEASE_SHA"
              test "$immutable_deploy" = "$served_deploy"
              test "$immutable_environment" = "hosted_nonproduction_pilot"
              echo "NETLIFY_DEPLOY_ID=$served_deploy" >> "$GITHUB_ENV"
              echo "HOSTED_PILOT_URL=$immutable_url" >> "$GITHUB_ENV"
              echo "Preview identity verified; browser QA is bound to the immutable deploy permalink without the Netlify Drawer."
              exit 0
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Exact PR preview never exposed the required release/deploy/environment identity." >&2
              echo "served_release=$served_release served_deploy=$served_deploy served_environment=$served_environment" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Install official Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify controlled observer route termination on loopback
        if: needs.select-pr264-controlled-preview.outputs.profile == 'controlled'
        env:
          HOSTED_PILOT_URL: ''
          NETLIFY_DEPLOY_ID: ''
          ACCEPTANCE_EXECUTION_KIND: local_source_fixture
        run: npm run test:pr-c-preview-route-termination

      - name: Run exact immutable-preview accessibility and performance
        env:
          EXPECTED_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          EXPECTED_NETLIFY_DEPLOY_ID: ${{ env.NETLIFY_DEPLOY_ID }}
          NETLIFY_DEPLOY_ID: ${{ env.NETLIFY_DEPLOY_ID }}
        run: npx playwright test --config=playwright.hosted-accessibility-performance.config.ts --workers=1

      - name: Run strict hosted shell and offline acceptance
        env:
          EXPECTED_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          EXPECTED_NETLIFY_DEPLOY_ID: ${{ env.NETLIFY_DEPLOY_ID }}
        run: npx playwright test --config=playwright.hosted-pilot.config.ts --workers=1

      - name: Run controlled preview fail-closed boundary on Desktop Chrome and Pixel 7
        if: needs.select-pr264-controlled-preview.outputs.profile == 'controlled'
        env:
          EXPECTED_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          ACCEPTANCE_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          EXPECTED_NETLIFY_DEPLOY_ID: ${{ env.NETLIFY_DEPLOY_ID }}
          NETLIFY_DEPLOY_ID: ${{ env.NETLIFY_DEPLOY_ID }}
          HOSTED_PILOT_URL: ${{ env.PREVIEW_ALIAS_URL }}
          CONTROLLED_PREVIEW_ALIAS_URL: ${{ env.PREVIEW_ALIAS_URL }}
          CONTROLLED_PREVIEW_IMMUTABLE_URL: ${{ env.HOSTED_PILOT_URL }}
        run: npx playwright test --config=playwright.controlled-preview-boundary.config.ts --workers=1

      - name: Verify controlled preview result inventory
        if: needs.select-pr264-controlled-preview.outputs.profile == 'controlled'
        env:
          EXPECTED_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          NETLIFY_DEPLOY_ID: ${{ env.NETLIFY_DEPLOY_ID }}
          EXPECTED_NETLIFY_DEPLOY_ID: ${{ env.NETLIFY_DEPLOY_ID }}
          ACCEPTANCE_WORKFLOW_PATH: .github/workflows/preview-exhaustive-browser-qa.yml
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/verifyPreviewBrowserEvidence.mjs --report artifacts/controlled-preview-boundary/playwright-results.json --output artifacts/controlled-preview-boundary/result-inventory.json

      - name: Run exact-head local Sandbox regression on Desktop Chrome and Pixel 7
        if: needs.select-pr264-controlled-preview.outputs.profile == 'controlled'
        env:
          HOSTED_PILOT_URL: ''
          NETLIFY_DEPLOY_ID: ''
        run: node scripts/runTranscriptFlowBrowser.mjs --preview-sandbox-regression

      - name: Run exact-head local navigation regression on Desktop Chrome and Pixel 7
        if: needs.select-pr264-controlled-preview.outputs.profile == 'controlled'
        env:
          HOSTED_PILOT_URL: ''
          NETLIFY_DEPLOY_ID: ''
        run: node scripts/runTranscriptFlowBrowser.mjs --preview-navigation-regression

      - name: Run exhaustive Desktop Chrome and Pixel 7 Sandbox acceptance
        if: needs.select-pr264-controlled-preview.outputs.profile == 'ordinary'
        env:
          EXPECTED_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          ACCEPTANCE_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          NETLIFY_DEPLOY_ID: ${{ env.NETLIFY_DEPLOY_ID }}
        run: npx playwright test --config=playwright.exhaustive-acceptance.config.ts --workers=1

      - name: Run controller navigation history on Desktop Chrome and Pixel 7
        if: needs.select-pr264-controlled-preview.outputs.profile == 'ordinary'
        env:
          EXPECTED_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          ACCEPTANCE_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          NETLIFY_DEPLOY_ID: ${{ env.NETLIFY_DEPLOY_ID }}
        run: npx playwright test --config=playwright.controller-navigation-history.config.ts --workers=1

      - name: Upload hosted baseline browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-hosted-baseline-${{ env.RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: test-results/

      - name: Upload controlled preview boundary evidence
        if: always() && needs.select-pr264-controlled-preview.outputs.profile == 'controlled'
        uses: actions/upload-artifact@v4
        with:
          name: preview-controlled-boundary-${{ env.RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/controlled-preview-boundary/

      - name: Upload local Sandbox regression evidence
        if: always() && needs.select-pr264-controlled-preview.outputs.profile == 'controlled'
        uses: actions/upload-artifact@v4
        with:
          name: preview-local-sandbox-regression-${{ env.RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: output/playwright/pr264-synthetic-regression/${{ env.RELEASE_SHA }}/sandbox/

      - name: Upload local navigation regression evidence
        if: always() && needs.select-pr264-controlled-preview.outputs.profile == 'controlled'
        uses: actions/upload-artifact@v4
        with:
          name: preview-local-navigation-regression-${{ env.RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: output/playwright/pr264-synthetic-regression/${{ env.RELEASE_SHA }}/navigation/

      - name: Upload ordinary preview exhaustive evidence
        if: always() && needs.select-pr264-controlled-preview.outputs.profile == 'ordinary'
        uses: actions/upload-artifact@v4
        with:
          name: preview-exhaustive-browser-qa-${{ env.RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/exhaustive-acceptance/
            artifacts/controller-navigation-history/
