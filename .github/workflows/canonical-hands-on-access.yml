name: Canonical Hands-on Access

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare or revoke the exact temporary hands-on personas
        required: true
        type: choice
        options: [prepare, revoke]
      operator_sha:
        description: Exact reviewed commit containing this operator workflow
        required: true
        type: string
      preview_release_sha:
        description: Exact release served by the bounded preview
        required: true
        type: string
      preview_url:
        description: Exact bounded nonproduction preview origin
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: canonical-hands-on-access
  cancel-in-progress: false

jobs:
  access:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: hosted-nonproduction-pilot
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: canonical_hands_on_disposable
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d canonical_hands_on_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.operator_sha }}
          fetch-depth: 0
      - name: Fail closed on exact operator and preview request
        shell: bash
        env:
          REQUESTED_OPERATION: ${{ inputs.operation }}
          REQUESTED_OPERATOR_SHA: ${{ inputs.operator_sha }}
          REQUESTED_PREVIEW_RELEASE_SHA: ${{ inputs.preview_release_sha }}
          REQUESTED_PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_OPERATOR_SHA"
          [[ "$REQUESTED_OPERATOR_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUESTED_PREVIEW_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUESTED_PREVIEW_URL" =~ ^https://ap-acceptance-[0-9a-f]{8}--avalaos-pilot\.netlify\.app$ ]]
          [[ "$REQUESTED_OPERATION" =~ ^(prepare|revoke)$ ]]
          if [[ "$REQUESTED_OPERATION" = prepare ]]; then
            test "$GITHUB_SHA" = "$REQUESTED_OPERATOR_SHA"
          else
            git merge-base --is-ancestor "$REQUESTED_OPERATOR_SHA" "$GITHUB_SHA"
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify operator contracts
        env:
          CANONICAL_HANDS_ON_DISPOSABLE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/canonical_hands_on_disposable
        run: node --test scripts/canonicalHandsOnAccess.test.mjs
      - name: Prepare or revoke exact hands-on access
        env:
          CANONICAL_HANDS_ON_OPERATION: ${{ inputs.operation }}
          CANONICAL_HANDS_ON_OPERATOR_SHA: ${{ inputs.operator_sha }}
          CANONICAL_HANDS_ON_PREVIEW_RELEASE_SHA: ${{ inputs.preview_release_sha }}
          CANONICAL_HANDS_ON_PREVIEW_URL: ${{ inputs.preview_url }}
          CANONICAL_HANDS_ON_ACCESS_BUNDLE: ${{ secrets.CANONICAL_HANDS_ON_ACCESS_BUNDLE }}
          AUTHENTICATED_ACCEPTANCE_SUPABASE_URL: ${{ vars.AUTHENTICATED_ACCEPTANCE_SUPABASE_URL }}
          AUTHENTICATED_ACCEPTANCE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AUTHENTICATED_ACCEPTANCE_SUPABASE_SERVICE_ROLE_KEY }}
          AUTHENTICATED_ACCEPTANCE_DATABASE_URL: ${{ secrets.AUTHENTICATED_ACCEPTANCE_DATABASE_URL }}
          AUTHENTICATED_ACCEPTANCE_SCOPE: ${{ secrets.AUTHENTICATED_ACCEPTANCE_SCOPE }}
        run: node scripts/canonicalHandsOnAccess.mjs
      - name: Verify exact checkout remains clean
        if: always()
        shell: bash
        env:
          REQUESTED_OPERATOR_SHA: ${{ inputs.operator_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_OPERATOR_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
