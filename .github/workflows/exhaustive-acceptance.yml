name: Exhaustive AvalaOS Acceptance

on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact 40-character release SHA served by the hosted pilot
        required: true
        type: string
      netlify_deploy_id:
        description: Sanitized Netlify deploy ID
        required: true
        type: string
      hosted_url:
        description: Canonical hosted non-production pilot origin
        required: true
        type: string
  pull_request:

permissions:
  contents: read

env:
  RELEASE_SHA: ${{ inputs.release_sha || github.event.pull_request.head.sha }}
  NETLIFY_DEPLOY_ID: ${{ inputs.netlify_deploy_id || 'pull-request-not-deployed' }}
  HOSTED_PILOT_URL: ${{ inputs.hosted_url || 'https://avalaos-pilot.netlify.app' }}
  PLAYWRIGHT_JSON: artifacts/exhaustive-acceptance/playwright-results.json
  ACCEPTANCE_RESULTS_DIR: acceptance-results
  RETAINED_RESULTS_MANIFEST: /tmp/avalaos-retained-results.json
  ORACLE_RESULTS_MANIFEST: /tmp/avalaos-oracle-results.json

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Fail closed on release and hosted target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$HOSTED_PILOT_URL" = "https://avalaos-pilot.netlify.app"
          [[ "$NETLIFY_DEPLOY_ID" =~ ^[0-9a-f]{24}$|^pull-request-not-deployed$ ]]

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate catalog, inventory, bindings and controller bridge
        run: |
          npm run test:acceptance:catalog
          node scripts/runExhaustiveAcceptanceReport.test.mjs
          node scripts/exhaustiveAcceptanceEvidence.test.mjs
          node scripts/exhaustiveAcceptanceDispatchBridge.test.mjs

      - name: Run exact-run retained server-authority suites
        id: retained
        continue-on-error: true
        run: node scripts/runExhaustiveRetainedSuites.mjs

      - name: Run independent assessment oracle against production scoring
        id: oracle
        continue-on-error: true
        run: node scripts/runAssessV1AcceptanceOracle.mjs

      - name: Validate deterministic hosted declarations
        env:
          EXPECTED_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          ACCEPTANCE_RELEASE_SHA: ${{ env.RELEASE_SHA }}
        run: npx playwright test --config=playwright.exhaustive-acceptance.config.ts --list --reporter=list

      - name: Stage sanitized non-browser manifests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-results
          test -f "$RETAINED_RESULTS_MANIFEST" && cp "$RETAINED_RESULTS_MANIFEST" acceptance-results/retained-suite-results.json || true
          test -f "$ORACLE_RESULTS_MANIFEST" && cp "$ORACLE_RESULTS_MANIFEST" acceptance-results/oracle-results.json || true

      - name: Install official Chromium for exact hosted execution
        if: env.NETLIFY_DEPLOY_ID != 'pull-request-not-deployed'
        run: npx playwright install --with-deps chromium

      - name: Verify exact hosted deployment identity
        id: deployment
        if: env.NETLIFY_DEPLOY_ID != 'pull-request-not-deployed'
        continue-on-error: true
        env:
          EXPECTED_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          EXPECTED_NETLIFY_DEPLOY_ID: ${{ env.NETLIFY_DEPLOY_ID }}
        run: node scripts/verify-hosted-deployment.mjs

      - name: Run exhaustive real hosted Sandbox acceptance
        id: hosted
        if: env.NETLIFY_DEPLOY_ID != 'pull-request-not-deployed' && steps.deployment.outcome == 'success'
        continue-on-error: true
        env:
          EXPECTED_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          ACCEPTANCE_RELEASE_SHA: ${{ env.RELEASE_SHA }}
        run: npx playwright test --config=playwright.exhaustive-acceptance.config.ts

      - name: Generate unified PASS FAIL BLOCKED UNCOVERED results
        id: report
        if: always()
        continue-on-error: true
        env:
          ACCEPTANCE_EXECUTION_DISPOSITION: ${{ env.NETLIFY_DEPLOY_ID == 'pull-request-not-deployed' && 'NOT_EXECUTED' || steps.deployment.outcome != 'success' && 'BLOCKED' || 'EXECUTED' }}
        run: node scripts/runExhaustiveAcceptanceReport.mjs

      - name: Upload sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exhaustive-acceptance-${{ env.RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            tests/acceptance/catalog/
            tests/acceptance/inventory.json
            tests/acceptance/execution-bindings.json
            tests/acceptance/fixtures/
            acceptance-results/
            artifacts/exhaustive-acceptance/

      - name: Enforce framework and release gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.retained.outcome }}" = success
          test "${{ steps.oracle.outcome }}" = success
          test "${{ steps.report.outcome }}" = success
          if [ "$NETLIFY_DEPLOY_ID" != "pull-request-not-deployed" ]; then
            test "${{ steps.deployment.outcome }}" = success
            test "${{ steps.hosted.outcome }}" = success
          fi
