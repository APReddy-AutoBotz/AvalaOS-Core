name: Controller publish navigation hydration recovery

on:
  push:
    branches:
      - controller/reload-reconstruction-closure
    paths:
      - .github/workflows/controller-publish-navigation-hydration.yml

permissions:
  contents: write

jobs:
  publish-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: controller/reload-reconstruction-closure
      - name: Verify exact recovery base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8a77f7e643354da47efd6618072fa4ec57790be1"
      - name: Apply approved recovery patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/recovery.patch <<'PATCH'
          diff --git a/App.tsx b/App.tsx
          index b101254..46e4b62 100644
          --- a/App.tsx
          +++ b/App.tsx
          @@ -174,6 +174,12 @@ function App() {
             );
             const navigationHydrated = useRef(false);
             const navigationWriteSuppressed = useRef(false);
          +  const pendingNavigationHydration = useRef<{
          +    view: View;
          +    scope: Scope;
          +    selectedProcessId: string | null;
          +    activeGenerationId: string | null;
          +  } | null>(null);
             const marketingCapture = useMemo(() => resolveMarketingCapture(
               typeof window === 'undefined' ? '' : window.location.search,
               {
          @@ -514,6 +520,12 @@ function App() {
           
               if (!hasDurableProductNavigationAgreement(window.location.search, persistedView, persistedScope)) {
                 navigationWriteSuppressed.current = true;
          +      pendingNavigationHydration.current = {
          +        view: DEFAULT_PERSISTED_VIEW,
          +        scope: DEFAULT_PERSISTED_SCOPE,
          +        selectedProcessId: null,
          +        activeGenerationId: null,
          +      };
                 setCurrentScope(DEFAULT_PERSISTED_SCOPE);
                 setCurrentView(DEFAULT_PERSISTED_VIEW);
                 setSelectedProcessId(null);
          @@ -537,6 +549,12 @@ function App() {
               });
           
               navigationWriteSuppressed.current = true;
          +    pendingNavigationHydration.current = {
          +      view: resolvedNavigation.view,
          +      scope: resolvedNavigation.scope,
          +      selectedProcessId: resolvedNavigation.selectedProcessId,
          +      activeGenerationId: resolvedNavigation.activeGenerationId,
          +    };
               setScopeIfChanged(resolvedNavigation.scope);
               setCurrentView(resolvedNavigation.view);
               setSelectedProcessId(resolvedNavigation.selectedProcessId);
          @@ -574,11 +592,20 @@ function App() {
               if (explicitNavigationIntent && !navigationHydrated.current) return;
               if (processesLoading) return;
           
          -    // URL hydration commits the view, scope, and entity selection as one
          -    // navigation transition. Do not reconcile the pre-hydration render (where
          -    // the process selection is still null) or it can downgrade a valid
          -    // process-detail route to the catalog before React commits that selection.
          +    // Effects later in the same flush can observe ref writes from URL hydration
          +    // while still closing over the pre-hydration render. Keep reconciliation
          +    // suppressed until a committed render contains the complete hydrated
          +    // navigation tuple; otherwise a null process selection can downgrade a
          +    // valid process-detail route to the catalog.
               if (navigationWriteSuppressed.current) {
          +      const pending = pendingNavigationHydration.current;
          +      const hydrationCommitted = Boolean(pending
          +        && currentView === pending.view
          +        && areScopesEqual(currentScope, pending.scope)
          +        && selectedProcessId === pending.selectedProcessId
          +        && activeGenerationId === pending.activeGenerationId);
          +      if (!hydrationCommitted) return;
          +      pendingNavigationHydration.current = null;
                 navigationWriteSuppressed.current = false;
                 return;
               }
          diff --git a/services/falseSuccess.test.ts b/services/falseSuccess.test.ts
          index dadae87..5638569 100644
          --- a/services/falseSuccess.test.ts
          +++ b/services/falseSuccess.test.ts
          @@ -7,6 +7,16 @@ assert.doesNotMatch(appSource, /setTempArtifacts\(artifacts\)[\s\S]{0,450}applyG
           assert.match(appSource, /await persistBeforeCommit/);
           assert.match(appSource, /\(\) => deliverySaveGeneration\(newGeneration\)/);
           assert.match(appSource, /Document generation requires an active project/);
          +assert.match(
          +  appSource,
          +  /pendingNavigationHydration\.current = \{[\s\S]*selectedProcessId: resolvedNavigation\.selectedProcessId,[\s\S]*activeGenerationId: resolvedNavigation\.activeGenerationId,/,
          +  'URL hydration must retain the complete expected navigation tuple until React commits it',
          +);
          +assert.match(
          +  appSource,
          +  /const hydrationCommitted = Boolean\(pending[\s\S]*currentView === pending\.view[\s\S]*areScopesEqual\(currentScope, pending\.scope\)[\s\S]*selectedProcessId === pending\.selectedProcessId[\s\S]*activeGenerationId === pending\.activeGenerationId\);[\s\S]*if \(!hydrationCommitted\) return;[\s\S]*navigationWriteSuppressed\.current = false;/,
          +  'pre-hydration effects must not release reconciliation suppression before the full navigation tuple commits',
          +);
           
           const providerSource = readFileSync('components/docs/DocsProvider.tsx', 'utf8');
           assert.match(providerSource, /Promise<DocumentGeneration>/);
          PATCH
          git apply --check /tmp/recovery.patch
          git apply /tmp/recovery.patch
          git diff --check
      - name: Validate approved correction
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run test:view-state-persistence
          npm run test:false-success
          npm run test:pr1f
          npm run test:pilot-acceptance
          npm run test:ai-boundary-static
          node tests/browser/exhaustiveHostedAcceptanceContract.test.mjs
          npm run test:acceptance:catalog
          npm run build
      - name: Publish to existing PR branch and remove controller scaffold
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/controller-publish-navigation-hydration.yml
          git add App.tsx services/falseSuccess.test.ts .github/workflows/controller-publish-navigation-hydration.yml
          git config user.name "APReddy-AutoBotz"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(navigation): await committed hydration tuple"
          git push origin HEAD:controller/reload-reconstruction-closure
