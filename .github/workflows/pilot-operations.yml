name: Pilot Operations

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  LIVE_ACTIVATION_STATE: LIVE_ACTIVATION_NOT_AUTHORIZED

jobs:
  operations-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.CANDIDATE_SHA }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: node scripts/checkPilotOperationsCi.mjs
      - run: npm run test:pilot-operations
      - run: npm run typecheck && npm run typecheck:edge
      - run: npm run test:scoring && npm run test:ai-boundary-static && npm run test:secret-hygiene
      - run: npm run build && npm audit --audit-level=moderate && git diff --check

  retained-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.CANDIDATE_SHA }}'}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Compose accepted authority suites without hosted effects
        run: npm run test:pilot-acceptance

  disposable-postgresql-16:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: avalaos_pilot_operations}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.CANDIDATE_SHA }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Fresh, upgrade, tenant and maintenance/rollback authority
        env: {PILOT_OPERATIONS_DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:5432/avalaos_pilot_operations'}
        run: npm run test:migrations:pilot-operations
      - if: always()
        run: dropdb --if-exists -h 127.0.0.1 -U postgres avalaos_pilot_operations
        env: {PGPASSWORD: postgres}

  backup-restore-recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: avalaos_pilot_recovery}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.CANDIDATE_SHA }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Disposable backup, clean restore, corruption and interrupted recovery
        env: {PILOT_OPERATIONS_DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:5432/avalaos_pilot_recovery'}
        run: npm run test:recovery:pilot-operations
      - if: always()
        run: dropdb --if-exists -h 127.0.0.1 -U postgres avalaos_pilot_recovery avalaos_pilot_restore
        env: {PGPASSWORD: postgres}

  browser-desktop-pixel7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.CANDIDATE_SHA }}'}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.pilot-operations.config.ts

  evidence-manifest:
    if: always()
    needs: [operations-source, retained-authority, disposable-postgresql-16, backup-restore-recovery, browser-desktop-pixel7]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.CANDIDATE_SHA }}'}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Bind independently required gates to this exact workflow and head
        env:
          PILOT_OPERATIONS_HEAD: ${{ env.CANDIDATE_SHA }}
          SOURCE: ${{ needs.operations-source.result }}
          RETAINED: ${{ needs.retained-authority.result }}
          POSTGRES: ${{ needs.disposable-postgresql-16.result }}
          RECOVERY: ${{ needs.backup-restore-recovery.result }}
          BROWSER: ${{ needs.browser-desktop-pixel7.result }}
        run: |
          node - <<'NODE' >> "$GITHUB_ENV"
          const head=process.env.PILOT_OPERATIONS_HEAD,runId=process.env.GITHUB_RUN_ID;
          const gate=(result,job,command)=>({result:result==='success'?'passed':'failed',head,runId,job,command});
          const e={
            'retained-authority':gate(process.env.RETAINED,'retained-authority','npm run test:pilot-acceptance'),
            'operations-source':gate(process.env.SOURCE,'operations-source','npm run test:pilot-operations'),
            'postgres-fresh-upgrade':gate(process.env.POSTGRES,'disposable-postgresql-16','npm run test:migrations:pilot-operations'),
            'tenant-adversarial':gate(process.env.POSTGRES,'disposable-postgresql-16','two-tenant pilot operations scenarios'),
            'backup-restore-recovery':gate(process.env.RECOVERY,'backup-restore-recovery','npm run test:recovery:pilot-operations'),
            'maintenance-rollback':gate(process.env.POSTGRES,'disposable-postgresql-16','maintenance and rollback scenarios'),
            'browser-desktop':gate(process.env.BROWSER,'browser-desktop-pixel7','Desktop Chrome project'),
            'browser-pixel7':gate(process.env.BROWSER,'browser-desktop-pixel7','Pixel 7 project'),
            'accessibility-performance':gate(process.env.BROWSER,'browser-desktop-pixel7','axe, responsive and performance assertions'),
            'security-hygiene':gate(process.env.SOURCE,'operations-source','AI boundary and secret hygiene')};
          process.stdout.write(`PILOT_OPERATIONS_GATE_RESULTS=${JSON.stringify(e)}\n`);
          NODE
      - run: node scripts/verify-pilot-operations.mjs --authoritative
        env: {PILOT_OPERATIONS_HEAD: '${{ env.CANDIDATE_SHA }}'}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'pilot-operations-${{ env.CANDIDATE_SHA }}', path: artifacts/pilot-operations/manifest.json, if-no-files-found: error, retention-days: 14}
