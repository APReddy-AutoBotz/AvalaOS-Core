name: Controller Export Main Source

on:
  push:
    branches:
      - controller/export-main-for-netlify-20260812

permissions:
  contents: read

jobs:
  export-exact-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact audited main
        uses: actions/checkout@v4
        with:
          ref: f518c569fa1d0505c141bd656476ba30cfcb1e72
          fetch-depth: 1

      - name: Verify exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f518c569fa1d0505c141bd656476ba30cfcb1e72"

      - name: Export exact source tree
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=/tmp/avalaos-main-f518c569.zip HEAD
          test -s /tmp/avalaos-main-f518c569.zip

      - name: Upload exact source artifact
        uses: actions/upload-artifact@v4
        with:
          name: avalaos-main-source-f518c569
          path: /tmp/avalaos-main-f518c569.zip
          if-no-files-found: error
          retention-days: 1
