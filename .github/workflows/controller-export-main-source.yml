name: Controller Export Main Source

on:
  push:
    branches:
      - controller/export-main-for-netlify-20260812

permissions:
  contents: read
  id-token: write

jobs:
  deploy-exact-main-to-stable-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact audited main
        uses: actions/checkout@v4
        with:
          ref: f518c569fa1d0505c141bd656476ba30cfcb1e72
          fetch-depth: 1

      - name: Verify exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f518c569fa1d0505c141bd656476ba30cfcb1e72"
          test -f netlify.toml
          test -f package-lock.json

      - name: Request repository-scoped OIDC identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=avalaos-netlify-controller")"
          token="$(jq -r '.value' <<<"$response")"
          test -n "$token"
          test "$token" != "null"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Trigger Git-backed production-branch Netlify build through OIDC relay
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://fcsfvonhvyrevwhyvano.supabase.co/functions/v1/controller-netlify-build-relay-20260812" \
            | tee /tmp/netlify-relay-response.json
          jq -e '.ok == true' /tmp/netlify-relay-response.json >/dev/null
          jq '{ok, upstream_status, upstream_body}' /tmp/netlify-relay-response.json
