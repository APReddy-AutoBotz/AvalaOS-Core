name: Controller Export Main Source

on:
  push:
    branches:
      - controller/export-main-for-netlify-20260812

permissions:
  contents: read

jobs:
  export-exact-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact audited main
        uses: actions/checkout@v4
        with:
          ref: f518c569fa1d0505c141bd656476ba30cfcb1e72
          fetch-depth: 1

      - name: Verify exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f518c569fa1d0505c141bd656476ba30cfcb1e72"
          test -f netlify.toml
          test -f package-lock.json

      - name: Upload exact source tree directly
        uses: actions/upload-artifact@v4
        with:
          name: avalaos-main-tree-f518c569
          path: .
          if-no-files-found: error
          retention-days: 1
