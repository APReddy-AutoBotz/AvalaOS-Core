name: Controller Export Main Source

on:
  push:
    branches:
      - controller/export-main-for-netlify-20260812

permissions:
  contents: read

jobs:
  read-netlify-tuple-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read isolated diagnostic artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "https://6a7ca1fcbe5f5b76aefd92e2--avalaos-pilot.netlify.app/netlify-tuple.json" \
            | tee /tmp/netlify-tuple.json
          jq . /tmp/netlify-tuple.json
          jq -e '.context == "branch-deploy"' /tmp/netlify-tuple.json >/dev/null
          jq -e '.siteName == "avalaos-pilot"' /tmp/netlify-tuple.json >/dev/null
