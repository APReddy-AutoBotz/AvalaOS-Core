name: Controller Export Main Source

on:
  push:
    branches:
      - controller/export-main-for-netlify-20260812

permissions:
  contents: read
  id-token: write

jobs:
  rerun-netlify-tuple-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request repository-scoped OIDC identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=avalaos-netlify-controller")"
          token="$(jq -r '.value' <<<"$response")"
          test -n "$token"
          test "$token" != "null"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Trigger isolated Netlify branch tuple diagnostic
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://fcsfvonhvyrevwhyvano.supabase.co/functions/v1/controller-netlify-build-relay-20260812" \
            | tee /tmp/netlify-relay-response.json
          jq -e '.ok == true' /tmp/netlify-relay-response.json >/dev/null
          jq '{ok, upstream_status, upstream_body}' /tmp/netlify-relay-response.json
