name: Controller Export Main Source

on:
  push:
    branches:
      - controller/export-main-for-netlify-20260812

permissions:
  contents: read
  actions: write

jobs:
  dispatch-canonical-hosted-live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical hosted pilot live acceptance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 4a324422d7b8180940422e1f602a9aec52415a41
          HOSTED_URL: https://avalaos-pilot.netlify.app
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -nc --arg sha "$EXPECTED_SHA" --arg url "$HOSTED_URL" '{ref:"main",inputs:{expected_release_sha:$sha,hosted_url:$url}}')" \
            "https://api.github.com/repos/APReddy-AutoBotz/AvalaOS-Core/actions/workflows/hosted-pilot-live-acceptance.yml/dispatches"
          for attempt in $(seq 1 20); do
            response="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/APReddy-AutoBotz/AvalaOS-Core/actions/workflows/hosted-pilot-live-acceptance.yml/runs?event=workflow_dispatch&branch=main&per_page=20")"
            run_id="$(jq -r --arg sha "$EXPECTED_SHA" --arg started "$started_at" '.workflow_runs | map(select(.head_sha==$sha and .created_at >= $started)) | sort_by(.created_at) | last | .id // empty' <<<"$response")"
            if [ -n "$run_id" ]; then
              echo "canonical_live_acceptance_run_id=$run_id"
              exit 0
            fi
            sleep 2
          done
          echo "Canonical live acceptance dispatch was not discoverable" >&2
          exit 1
