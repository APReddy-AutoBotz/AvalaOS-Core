name: Hosted Pilot Live Acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: Exact 40-character Git SHA deployed to the hosted pilot
        required: true
        type: string
      expected_netlify_deploy_id:
        description: Exact 24-character lowercase Netlify deploy ID selected for acceptance
        required: true
        type: string
      hosted_url:
        description: Credential-free HTTPS hosted pilot origin
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_RELEASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.expected_release_sha }}
  EXPECTED_NETLIFY_DEPLOY_ID: ${{ inputs.expected_netlify_deploy_id }}
  HOSTED_PILOT_URL: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--avalaos-pilot.netlify.app', github.event.number) || inputs.hosted_url }}

jobs:
  live-hosted-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/hosted-nonproduction-pilot-activation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact authorized release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_RELEASE_SHA }}
          fetch-depth: 1

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for exact-head Netlify deployment identity
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if node scripts/verify-hosted-deployment.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Exact-head hosted deployment did not become verifiable" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Install official Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real hosted Desktop Chrome and Pixel 7 acceptance serially
        run: npx playwright test --config=playwright.hosted-pilot.config.ts --workers=1

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-pilot-live-acceptance-${{ env.EXPECTED_RELEASE_SHA }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
