name: Creation access and synthetic Admin

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creation-access-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  isolated-creation-access:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install disposable test dependencies (no deployment credentials)
        run: |
          npx playwright install --with-deps chromium
          docker pull postgres:16-alpine
      - run: node --test scripts/runCreationAccessValidation.test.mjs scripts/checkCreationAccessCommittedPatch.test.mjs scripts/runTranscriptFlowBrowser.test.mjs
      - run: node scripts/runCreationAccessValidation.mjs authority
      - run: node scripts/runCreationAccessValidation.mjs regression
      - run: node scripts/runCreationAccessValidation.mjs coverage
      - run: node scripts/runCreationAccessValidation.mjs postgres
      - run: node scripts/runCreationAccessValidation.mjs browser
      - run: node scripts/runCreationAccessValidation.mjs static
      - name: Check the exact committed PR patch
        env:
          CREATION_ACCESS_BASE_SHA: ${{ github.event.pull_request.base.sha || '5433cad41721355e3ec5a29bc2f87772540c77b5' }}
          CREATION_ACCESS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/checkCreationAccessCommittedPatch.mjs
      - name: Retain isolated test results, not hosted acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: creation-access-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/creation-access/
            output/playwright/creation-access/
            output/playwright/local-controlled-boundary/
          if-no-files-found: error
          retention-days: 14
