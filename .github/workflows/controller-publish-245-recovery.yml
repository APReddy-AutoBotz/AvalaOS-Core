name: Controller publish PR245 recovery

on:
  push:
    branches:
      - controller/reload-reconstruction-closure

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recovery trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Guard exact recovery parent and scope
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='fa3a844fad41950e13ac5e2f184c360c5a907095'
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/controller-publish-245-recovery.yml'

      - name: Apply exact approved recovery patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr245.patch <<'PATCH'
          diff --git a/App.tsx b/App.tsx
          index 46e4b62112eec1889dbb36b967d53a305019b2ae..f0c1234dc0a0e274927117a5049fb49e52ffd7fc 100644
          --- a/App.tsx
          +++ b/App.tsx
          @@ -478,6 +478,12 @@ function App() {
           
             useEffect(() => {
               if (guardLoading || !currentUser || !currentOrganization) return;
          +    // Explicit URL reconstruction owns the whole navigation tuple until React
          +    // commits it. Persisted view/scope normalization must not race that
          +    // transition and replace process_detail with a fallback computed from the
          +    // pre-hydration render.
          +    if (explicitNavigationIntent && !navigationHydrated.current) return;
          +    if (navigationWriteSuppressed.current) return;
           
               const resolvedState = resolvePersistedViewScopeState({
                 view: persistedView,
          @@ -506,6 +512,7 @@ function App() {
               authoritativeViewCapabilities,
               currentView,
               enabledModules,
          +    explicitNavigationIntent,
               guardLoading,
               persistedScope,
               persistedView,
          diff --git a/services/falseSuccess.test.ts b/services/falseSuccess.test.ts
          index 56385693fd9e8dd2d8cfab8d3fca070b4a7c75ac..bbac8ab234da740ad4955fbdc1df64ccdacac6a7 100644
          --- a/services/falseSuccess.test.ts
          +++ b/services/falseSuccess.test.ts
          @@ -17,6 +17,11 @@ assert.match(
             /const hydrationCommitted = Boolean\(pending[\s\S]*currentView === pending\.view[\s\S]*areScopesEqual\(currentScope, pending\.scope\)[\s\S]*selectedProcessId === pending\.selectedProcessId[\s\S]*activeGenerationId === pending\.activeGenerationId\);[\s\S]*if \(!hydrationCommitted\) return;[\s\S]*navigationWriteSuppressed\.current = false;/,
             'pre-hydration effects must not release reconciliation suppression before the full navigation tuple commits',
           );
          +assert.match(
          +  appSource,
          +  /if \(explicitNavigationIntent && !navigationHydrated\.current\) return;\s*if \(navigationWriteSuppressed\.current\) return;[\s\S]*resolvePersistedViewScopeState/,
          +  'persisted view/scope normalization must not race explicit URL hydration or its commit',
          +);
           
           const providerSource = readFileSync('components/docs/DocsProvider.tsx', 'utf8');
           assert.match(providerSource, /Promise<DocumentGeneration>/);
          PATCH
          sed -i 's/^          //' /tmp/pr245.patch
          git apply --check /tmp/pr245.patch
          git apply /tmp/pr245.patch
          test "$(git hash-object App.tsx)" = 'f0c1234dc0a0e274927117a5049fb49e52ffd7fc'
          test "$(git hash-object services/falseSuccess.test.ts)" = 'bbac8ab234da740ad4955fbdc1df64ccdacac6a7'
          rm .github/workflows/controller-publish-245-recovery.yml
          git diff --check

      - name: Publish exact recovery to existing branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'APReddy-AutoBotz'
          git config user.email '218099629+APReddy-AutoBotz@users.noreply.github.com'
          git add App.tsx services/falseSuccess.test.ts .github/workflows/controller-publish-245-recovery.yml
          git commit -m 'fix(navigation): serialize persisted hydration'
          git push origin HEAD:controller/reload-reconstruction-closure
