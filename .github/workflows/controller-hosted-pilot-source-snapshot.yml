name: Controller Hosted Pilot Source Snapshot

on:
  push:
    branches:
      - controller/hosted-pilot-source-snapshot

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact current main release
        uses: actions/checkout@v4
        with:
          ref: 4a324422d7b8180940422e1f602a9aec52415a41
          fetch-depth: 1

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "4a324422d7b8180940422e1f602a9aec52415a41"

      - name: Package source without Git metadata
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/avalaos-source-4a324422.tar.gz" .
          sha256sum "$RUNNER_TEMP/avalaos-source-4a324422.tar.gz" > "$RUNNER_TEMP/avalaos-source-4a324422.tar.gz.sha256"

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: avalaos-hosted-pilot-source-4a324422
          path: |
            ${{ runner.temp }}/avalaos-source-4a324422.tar.gz
            ${{ runner.temp }}/avalaos-source-4a324422.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
