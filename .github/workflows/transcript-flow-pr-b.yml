name: Governed multi-source transcript Studio PR B

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transcript-flow-pr-b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-governed-evidence:
    runs-on: ubuntu-latest
    env:
      PR_B_EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checked-out head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$PR_B_EXACT_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify immutable PR B evidence contract at its retained exact head
        run: npm run test:transcript-flow:studio-evidence-contract:retained
