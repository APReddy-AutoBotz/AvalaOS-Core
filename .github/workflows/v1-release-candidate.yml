name: V1 Release Candidate Evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compose-source-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:workflow-yaml
      - name: Resolve exact-candidate workflow evidence
        id: workflow-evidence
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          V1_RC_COMPOSE_WAIT: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 225) || github.event_name == 'workflow_dispatch' }}
        with:
          script: |
            const { resolveWorkflowEvidence } = require(`${process.env.GITHUB_WORKSPACE}/scripts/resolve-v1-rc-workflow-evidence.cjs`);
            const checks = [
              ['core', 'AvalaOS Core CI', 'ci.yml'],
              ['enterprise-intelligence', 'Enterprise Intelligence', 'enterprise-intelligence.yml'],
              ['trust-assurance', 'Trust Assurance Evidence Hub', 'trust-assurance.yml'],
              ['studio-governed-artifacts', 'Studio Governed Artifacts', 'studio-governed-artifacts.yml'],
              ['pr1f', 'PR 1F Assess V2 Economics', 'pr1f-assess-v2-economics.yml'],
              ['pr1g', 'PR 1G Application Portfolio', 'pr1g-application-portfolio.yml'],
            ];
            const evidence = await resolveWorkflowEvidence({
              candidateSha: process.env.CANDIDATE_SHA,
              checks,
              waitForCompletion: process.env.V1_RC_COMPOSE_WAIT === 'true',
              listWorkflowRuns: async ({ workflowFile, candidateSha }) => {
                const response = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflowFile,
                  head_sha: candidateSha,
                  per_page: 20,
                });
                return response.data;
              },
            });
            core.setOutput('json', JSON.stringify(evidence));
      - name: Verify RC model and fail-closed evidence composition
        run: npm run test:v1-rc
        env:
          V1_RC_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          V1_RC_WORKFLOW_EVIDENCE_JSON: ${{ steps.workflow-evidence.outputs.json }}
      - name: Enforce authoritative exact-candidate evidence gate
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.number == 225)
        run: npm run verify:v1-rc-evidence:authoritative
        env:
          V1_RC_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          V1_RC_WORKFLOW_EVIDENCE_JSON: ${{ steps.workflow-evidence.outputs.json }}
      - run: npm run build
        env:
          VITE_RC_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: v1-rc-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/v1-rc/evidence-manifest.json
          if-no-files-found: error
          retention-days: 14
