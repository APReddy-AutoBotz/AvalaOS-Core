name: Hosted Closure One-Shot Test Tip Patch

on:
  pull_request:
    paths:
      - '.github/workflows/hosted-closure-one-shot-test-tip-patch.yml'

permissions:
  contents: write

jobs:
  patch-exact-stale-tip-assertion:
    if: github.actor == 'APReddy-AutoBotz' && github.head_ref == 'controller/hosted-final-evidence-gate-closure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Replace exactly one stale hosted migration-tip assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/testPilotOperationsPostgres.mjs')
          text=path.read_text()
          old="assert.equal((await db.query('SELECT public.hosted_pilot_assert_current_identity() tip')).rows[0].tip,'20260811200000');"
          new="assert.equal((await db.query('SELECT public.hosted_pilot_assert_current_identity() tip')).rows[0].tip,canonical.tip.slice(0,14));"
          if text.count(old) != 1:
              raise SystemExit('HOSTED_CLOSURE_STALE_TIP_ASSERTION_NOT_EXACTLY_ONCE')
          path.write_text(text.replace(old,new))
          PY
          git diff --check
          git diff -- scripts/testPilotOperationsPostgres.mjs
          git config user.name 'AvalaOS Controller'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/testPilotOperationsPostgres.mjs
          git commit -m 'test(hosted-pilot): derive current canonical migration tip'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
