name: PR 264 Controlled Human Edge Deployment

on:
  workflow_call:
    inputs:
      exact_head_sha: { required: true, type: string }
      ci_run_id: { required: true, type: string }
      ci_run_attempt: { required: true, type: string }
      ci_artifact_name: { required: true, type: string }
      ci_artifact_digest: { required: true, type: string }
      netlify_deploy_id: { required: true, type: string }
      exercise_digest: { required: true, type: string }
      target_fingerprint: { required: true, type: string }
      public_target_digest: { required: true, type: string }
permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  deploy-exact-edge-source:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 264 && github.event.pull_request.head.sha == inputs.exact_head_sha }}
    environment: hosted-nonproduction-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_C_CONTROLLED_HUMAN_ENVIRONMENT_CLASS: hosted_nonproduction_pilot
      PR_C_CONTROLLED_HUMAN_PR_NUMBER: 264
      PR_C_CONTROLLED_HUMAN_RELEASE_SHA: ${{ inputs.exact_head_sha }}
      PR_C_CONTROLLED_HUMAN_REVIEW_HEAD_SHA: ${{ inputs.exact_head_sha }}
      PR_C_CONTROLLED_HUMAN_DEPLOY_ID: ${{ inputs.netlify_deploy_id }}
      PR_C_CONTROLLED_HUMAN_DEPLOY_ORIGIN: https://deploy-preview-264--avalaos-pilot.netlify.app
      PR_C_CONTROLLED_HUMAN_EXERCISE_DIGEST: ${{ inputs.exercise_digest }}
      PR_C_CONTROLLED_HUMAN_TARGET_FINGERPRINT: ${{ inputs.target_fingerprint }}
      PR_C_CONTROLLED_HUMAN_EXPECTED_PUBLIC_TARGET_DIGEST: ${{ inputs.public_target_digest }}
      PR_C_CONTROLLED_HUMAN_EDGE_WORKFLOW_PATH: .github/workflows/pr264-controlled-human-edge-deploy.yml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.exact_head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact checkout and accepted base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_C_CONTROLLED_HUMAN_RELEASE_SHA"
          test "$(git merge-base 5433cad41721355e3ec5a29bc2f87772540c77b5 HEAD)" = 5433cad41721355e3ec5a29bc2f87772540c77b5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies before protected values
        run: npm ci

      - name: Verify terminal exact-head PR C CI and immutable artifact
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          EXPECTED_HEAD: ${{ inputs.exact_head_sha }}
          EXPECTED_RUN_ID: ${{ inputs.ci_run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
          EXPECTED_ARTIFACT_NAME: ${{ inputs.ci_artifact_name }}
          EXPECTED_ARTIFACT_DIGEST: ${{ inputs.ci_artifact_digest }}
        with:
          script: |
            const fail = message => core.setFailed(`PR 264 Edge authority rejected: ${message}`);
            if (!/^[0-9a-f]{40}$/.test(process.env.EXPECTED_HEAD) || !/^[1-9][0-9]{0,19}$/.test(process.env.EXPECTED_RUN_ID) || !/^[1-9][0-9]*$/.test(process.env.EXPECTED_RUN_ATTEMPT) || !/^sha256:[0-9a-f]{64}$/.test(process.env.EXPECTED_ARTIFACT_DIGEST)) return fail('invalid binding');
            const { data: pull } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: 264 });
            if (pull.head.sha !== process.env.EXPECTED_HEAD || pull.head.ref !== 'controller/governed-delivery-monitor-pr-c-20260831') return fail('PR head mismatch');
            const runId = Number(process.env.EXPECTED_RUN_ID);
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner: context.repo.owner, repo: context.repo.repo, run_id: runId });
            if (!Number.isSafeInteger(runId) || String(run.path || '').split('@',1)[0] !== '.github/workflows/transcript-flow-pr-c.yml' || run.head_sha !== process.env.EXPECTED_HEAD || run.event !== 'pull_request' || run.status !== 'completed' || run.conclusion !== 'success' || String(run.run_attempt) !== process.env.EXPECTED_RUN_ATTEMPT) return fail('CI run mismatch');
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ owner: context.repo.owner, repo: context.repo.repo, run_id: runId, per_page: 100 });
            const artifact = data.artifacts.find(item => item.name === process.env.EXPECTED_ARTIFACT_NAME);
            if (!artifact || artifact.expired || artifact.digest !== process.env.EXPECTED_ARTIFACT_DIGEST) return fail('CI artifact mismatch');

      - name: Verify exact PR-only Deploy Preview before deployment
        run: node scripts/verifyPr264ControlledHumanPreview.mjs

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.101.0

      - name: Bind Supabase project, API and database without disclosure
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_PROJECT_REF }}
          PR_C_CONTROLLED_HUMAN_SUPABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_URL }}
          PR_C_CONTROLLED_HUMAN_DATABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_DATABASE_URL }}
        run: node --input-type=module -e "import {validateSupabaseTargetTuple} from './scripts/prCControlledHumanEnvironment.mjs'; validateSupabaseTargetTuple(process.env.SUPABASE_PROJECT_REF,process.env.PR_C_CONTROLLED_HUMAN_SUPABASE_URL,process.env.PR_C_CONTROLLED_HUMAN_DATABASE_URL)"

      - name: Capture provider deployment baseline
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_ACCESS_TOKEN }}
        run: node scripts/producePrCControlledHumanEdgeDeploymentManifest.mjs --provider-baseline output/controlled-human/provider-baseline.json

      - name: Derive exact controlled-human migration digest
        run: node --input-type=module -e "import {appendFileSync,readFileSync} from 'node:fs'; import {createHash} from 'node:crypto'; appendFileSync(process.env.GITHUB_ENV,'PR_C_CONTROLLED_HUMAN_MIGRATION_DIGEST=sha256:'+createHash('sha256').update(readFileSync('supabase/migrations/20260904120000_pr_c_controlled_human_exercise_authority.sql')).digest('hex')+'\n')"

      - name: Apply and verify exact additive migration on the dedicated database
        env:
          PR_C_CONTROLLED_HUMAN_DATABASE_URL: ${{ secrets.PR_C_CONTROLLED_HUMAN_DATABASE_URL }}
          PR_C_CONTROLLED_HUMAN_EXERCISE_ID: ${{ secrets.PR_C_CONTROLLED_HUMAN_EXERCISE_ID }}
        run: |
          npm run pr-c-controlled-human:migration-preflight -- --output output/controlled-human/migration-preflight.json
          npm run pr-c-controlled-human:migration-apply -- --output output/controlled-human/migration-apply.json
          npm run pr-c-controlled-human:migration-verify -- --output output/controlled-human/migration-verify.json
          npm run pr-c-controlled-human:preflight -- --output output/controlled-human/edge-preflight.json

      - name: Deploy only the allowlisted functions
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for function_name in assess-command assess-v2-command enterprise-intelligence-command enterprise-intelligence-query studio-artifact-command studio-private-artifact-command tenant-context tenant-session pr-c-controlled-human-synthetic-generation; do
            log_file="$RUNNER_TEMP/pr264-edge-${function_name}.log"
            if ! supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_REF" >"$log_file" 2>&1; then
              node --input-type=module -e "import {rmSync} from 'node:fs'; rmSync(process.argv[1],{force:true})" "$log_file"
              echo "::error::PR_C_CONTROLLED_HUMAN_EDGE_DEPLOYMENT_FAILED:${function_name}"
              exit 1
            fi
            node --input-type=module -e "import {rmSync} from 'node:fs'; rmSync(process.argv[1],{force:true})" "$log_file"
          done

      - name: Produce provider-attested deployment and runtime manifest
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PR_C_CONTROLLED_HUMAN_SUPABASE_ACCESS_TOKEN }}
          PR_C_CONTROLLED_HUMAN_EVIDENCE_HMAC_KEY: ${{ secrets.PR_C_CONTROLLED_HUMAN_EVIDENCE_HMAC_KEY }}
        run: node scripts/producePrCControlledHumanEdgeDeploymentManifest.mjs --migration-preflight output/controlled-human/migration-preflight.json --migration-apply output/controlled-human/migration-apply.json --migration-verify output/controlled-human/migration-verify.json --preflight output/controlled-human/edge-preflight.json --provider-baseline output/controlled-human/provider-baseline.json --output output/controlled-human/edge-deployment.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr264-controlled-human-edge-deployment-${{ inputs.exact_head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/controlled-human/edge-deployment.json
            output/controlled-human/provider-baseline.json
          if-no-files-found: error
          retention-days: 14
