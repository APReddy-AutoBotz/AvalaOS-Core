name: Hosted OIDC One-Shot Contract Patch

on:
  push:
    branches: [controller/hosted-oidc-db-verifier]
    paths: ['.github/workflows/hosted-oidc-one-shot-contract-patch.yml']

permissions:
  contents: write

jobs:
  patch-retained-contract:
    if: github.actor == 'APReddy-AutoBotz'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: controller/hosted-oidc-db-verifier, fetch-depth: 0}
      - name: Update retained authority-catalog unit test exactly once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/hostedPilotDatabaseContract.test.mjs')
          s=p.read_text()
          old="""  const tables=[{owner:'postgres',rls_enabled:true,force_rls:true,public_mutation:false,anon_mutation:false,authenticated_mutation:false}];\n  assert.doesNotThrow(()=>assertAuthorityTableCatalog(tables));\n  assert.throws(()=>assertAuthorityTableCatalog([]),/AUTHORITY_TABLE/);\n  assert.throws(()=>assertAuthorityTableCatalog([{...tables[0],authenticated_mutation:true}]),/AUTHORITY_TABLE/);"""
          new="""  const tables=[{relname:'safe_table',owner:'postgres',rls_enabled:true,force_rls:true,public_mutation:false,anon_mutation:false,authenticated_mutation:false}];\n  assert.doesNotThrow(()=>assertAuthorityTableCatalog(tables,['safe_table']));\n  assert.throws(()=>assertAuthorityTableCatalog([],['safe_table']),/AUTHORITY_TABLE/);\n  assert.throws(()=>assertAuthorityTableCatalog([{...tables[0],authenticated_mutation:true}],['safe_table']),/AUTHORITY_TABLE/);"""
          if s.count(old)!=1: raise SystemExit('RETAINED_AUTHORITY_TEST_PATTERN_MISMATCH')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          git config user.name 'AvalaOS Controller'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/hostedPilotDatabaseContract.test.mjs
          git commit -m 'test(hosted-pilot): bind retained authority catalog expectation'
          git push origin HEAD:controller/hosted-oidc-db-verifier
