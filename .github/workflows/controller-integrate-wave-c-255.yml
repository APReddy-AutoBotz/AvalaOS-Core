name: Controller Integrate Wave C 255

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/controller-integrate-wave-c-255.yml

permissions:
  contents: write
  issues: read

jobs:
  verify-and-publish-source:
    if: >-
      github.event.pull_request.number == 255 &&
      github.event.pull_request.head.ref == 'controller/acceptance-evidence-closure-20260822'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avalaos_pilot_operations
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Verify controller staging ancestry
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "704f628378dab003042d2397c2d923299230ca11"
          test "${{ github.event.pull_request.base.sha }}" = "862351f9150e013a075a630401b9405dd34d0df8"

      - name: Recover and cryptographically verify Wave C transport
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/5381879020" --jq .body > /tmp/wave-c-comment.md
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, re

          body = Path('/tmp/wave-c-comment.md').read_text()
          match = re.search(
              r'`BEGIN_WAVE_C_255_PATCH_GZIP_BASE64`\s*```text\s*(.*?)\s*```\s*`END_WAVE_C_255_PATCH_GZIP_BASE64`',
              body,
              re.S,
          )
          if not match:
              raise SystemExit('Wave C payload markers missing or malformed')
          payload = re.sub(r'\s+', '', match.group(1))
          compressed = base64.b64decode(payload, validate=True)
          if len(compressed) != 7257:
              raise SystemExit(f'Unexpected Wave C gzip byte count: {len(compressed)}')
          gzip_sha = hashlib.sha256(compressed).hexdigest()
          if gzip_sha != 'b3abc855397e3a02315e239462d7fb88be1bfe8626f583d0193e7f0f4ecfe41a':
              raise SystemExit(f'Wave C gzip SHA mismatch: {gzip_sha}')
          patch = gzip.decompress(compressed)
          if len(patch) != 26951:
              raise SystemExit(f'Unexpected Wave C patch byte count: {len(patch)}')
          patch_sha = hashlib.sha256(patch).hexdigest()
          if patch_sha != '7825cf0e8a152d475a7f931cf671ca7bc7ddc8fa1cce76d8593a2f9d82c7f4ad':
              raise SystemExit(f'Wave C patch SHA mismatch: {patch_sha}')
          Path('/tmp/wave-c.patch').write_bytes(patch)

          text = patch.decode('utf-8')
          observed = set()
          for left, right in re.findall(r'^diff --git a/(.*?) b/(.*?)$', text, re.M):
              if left != right:
                  raise SystemExit(f'Rename/mismatched path not authorized: {left} -> {right}')
              observed.add(right)
          expected = {
              '.github/workflows/exhaustive-acceptance.yml',
              'scripts/exhaustiveAcceptanceEvidence.mjs',
              'scripts/exhaustiveAcceptanceEvidence.test.mjs',
              'scripts/exhaustiveAcceptanceModel.mjs',
              'scripts/exhaustiveAcceptanceReport.mjs',
              'scripts/exhaustiveAcceptanceValidate.mjs',
              'scripts/produceExhaustiveServerEvidence.mjs',
              'scripts/produceRetainedAcceptanceEvidence.mjs',
              'scripts/produceRetainedAcceptanceEvidence.test.mjs',
              'scripts/runExhaustiveRetainedSuites.mjs',
              'tests/acceptance/execution-bindings.json',
          }
          if observed != expected:
              raise SystemExit(f'Wave C patch file set mismatch: {sorted(observed)}')
          print(f'Verified Wave C durable patch: {patch_sha}')
          PY
          git apply --check /tmp/wave-c.patch
          git apply /tmp/wave-c.patch
          git diff --check

      - name: Verify exact Wave C after-state blobs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/exhaustive-acceptance.yml': 'd5a550878e3693b3126a3631a16f69659bb688f2',
              'scripts/exhaustiveAcceptanceEvidence.mjs': '08511b863edba64671017252356cbf8154fd2d92',
              'scripts/exhaustiveAcceptanceEvidence.test.mjs': '033130d417448077e3b7b8b200e108b908ee59f8',
              'scripts/exhaustiveAcceptanceModel.mjs': 'f95bf7664964839a4d7ea9c6a77dfd7c7ee769e7',
              'scripts/exhaustiveAcceptanceReport.mjs': '9608e1c70cec90922b4dd1f2733c6c78c83b5f38',
              'scripts/exhaustiveAcceptanceValidate.mjs': 'd30abe969e7465f056cf10d59442fb4cc5867237',
              'scripts/produceExhaustiveServerEvidence.mjs': '141fad606ec19d849b4795723f425fe6a1e814ba',
              'scripts/produceRetainedAcceptanceEvidence.mjs': 'c18b8f7ad405beeaa25b229c153f9aff8447e31a',
              'scripts/produceRetainedAcceptanceEvidence.test.mjs': '3515acd544a6df60bccd3ee4aa8bc5c32dbde18d',
              'scripts/runExhaustiveRetainedSuites.mjs': '281f0a05eb661764c55ecb8953f78e6b6663cd20',
              'tests/acceptance/execution-bindings.json': '1b0fdfa39b65b0151471fad1ca1fad932521a040',
          }
          for path, wanted in expected.items():
              got = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if got != wanted:
                  raise SystemExit(f'Wave C blob mismatch for {path}: {got} != {wanted}')
          print('All 11 Wave C after-state blobs verified')
          PY

      - name: Install locked dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Validate exact retained producers and fail-closed evidence framework
        shell: bash
        run: |
          set -euo pipefail
          node scripts/produceRetainedAcceptanceEvidence.test.mjs
          node scripts/exhaustiveAcceptanceEvidence.test.mjs
          node scripts/runExhaustiveAcceptanceReport.test.mjs
          npm run test:acceptance:catalog
          npm run test:workflow-yaml
          npm run typecheck
          npm run typecheck:edge
          npm run test:ai-boundary-static
          npm run test:secret-hygiene
          npm run build
          git diff --check

      - name: Prove PostgreSQL authority and SAFETY-005 source path
        env:
          PILOT_OPERATIONS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/avalaos_pilot_operations
        shell: bash
        run: |
          set -euo pipefail
          npm run test:migrations:pilot-operations
          test -s artifacts/pilot-operations/postgres-execution.json

      - name: Export verified Exhaustive workflow after-state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/controller-export
          cp .github/workflows/exhaustive-acceptance.yml /tmp/controller-export/exhaustive-acceptance.yml
          test "$(git hash-object /tmp/controller-export/exhaustive-acceptance.yml)" = "d5a550878e3693b3126a3631a16f69659bb688f2"
      - uses: actions/upload-artifact@v4
        with:
          name: wave-c-exhaustive-workflow-after-state
          path: /tmp/controller-export/exhaustive-acceptance.yml
          if-no-files-found: error
          retention-days: 1

      - name: Publish verified non-workflow Wave C files
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows/exhaustive-acceptance.yml
          git add \
            scripts/exhaustiveAcceptanceEvidence.mjs \
            scripts/exhaustiveAcceptanceEvidence.test.mjs \
            scripts/exhaustiveAcceptanceModel.mjs \
            scripts/exhaustiveAcceptanceReport.mjs \
            scripts/exhaustiveAcceptanceValidate.mjs \
            scripts/produceExhaustiveServerEvidence.mjs \
            scripts/produceRetainedAcceptanceEvidence.mjs \
            scripts/produceRetainedAcceptanceEvidence.test.mjs \
            scripts/runExhaustiveRetainedSuites.mjs \
            tests/acceptance/execution-bindings.json
          git diff --cached --check
          python - <<'PY'
          import subprocess
          expected = {
              'scripts/exhaustiveAcceptanceEvidence.mjs',
              'scripts/exhaustiveAcceptanceEvidence.test.mjs',
              'scripts/exhaustiveAcceptanceModel.mjs',
              'scripts/exhaustiveAcceptanceReport.mjs',
              'scripts/exhaustiveAcceptanceValidate.mjs',
              'scripts/produceExhaustiveServerEvidence.mjs',
              'scripts/produceRetainedAcceptanceEvidence.mjs',
              'scripts/produceRetainedAcceptanceEvidence.test.mjs',
              'scripts/runExhaustiveRetainedSuites.mjs',
              'tests/acceptance/execution-bindings.json',
          }
          out = subprocess.check_output(['git','diff','--cached','--name-only'], text=True)
          observed = {line for line in out.splitlines() if line}
          if observed != expected:
              raise SystemExit(f'Unexpected staged Wave C source set: {sorted(observed)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Controller: integrate verified Wave C evidence producers'
          git push origin HEAD:controller/acceptance-evidence-closure-20260822
